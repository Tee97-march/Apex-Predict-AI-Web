<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX Predict AI - Match Analysis</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#081b33;
color:white;
font-family:Arial,sans-serif;
margin:0;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.header{
text-align:center;
margin-bottom:25px;
}

.card{
background:#102847;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.35);
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#00c853;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.analysis{
margin-top:20px;
line-height:2;
}

.tag{
display:inline-block;
padding:6px 14px;
border-radius:20px;
background:#00c853;
font-weight:bold;
margin-top:10px;
}

.back{
display:inline-block;
margin-top:25px;
padding:12px 20px;
background:#00c853;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>🤖 AI Match Analysis</h1>
<p>Version 2.1 Stable</p>
</div>

<div class="card">

<input type="text" placeholder="Home Team">

<input type="text" placeholder="Away Team">

<button>Analyze Match</button>

<div class="analysis">

<h3>AI Analysis Result</h3>

<p>📈 Team Form : Good</p>

<p>⚽ Expected Goals : 2.45</p>

<p>🛡 Defensive Rating : Strong</p>

<p>🔥 Attack Rating : Excellent</p>

<p>📊 Head to Head : Home Advantage</p>
