<script>

"use strict";


/* =========================================================
   VERIFIED APEX BACKEND
   ========================================================= */

const APEX_API_URL =
"https://script.google.com/macros/s/AKfycbxygAHM7CTxHK5SXXCoc7AyfhivumaYJDKSYv5OFdI_woZdSnpVgBM400W8Gkny1Y8I/exec";

const MAX_MATCHES = 30;

const REQUEST_TIMEOUT = 45000;

const RETRIES = 2;


/* =========================================================
   SAFE HTML
   ========================================================= */

function safe(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   NORMALISE KEYS
   ========================================================= */

function normaliseKey(value){

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");
}


/* =========================================================
   FLEXIBLE FIELD READER
   ========================================================= */

function getValue(
    object,
    names
){

    if(
        !object ||
        typeof object !== "object"
    ){

        return "";
    }

    const keys =
        Object.keys(
            object
        );

    for(
        const wantedName of names
    ){

        const wanted =
            normaliseKey(
                wantedName
            );

        const found =
            keys.find(
                key =>
                    normaliseKey(key) === wanted
            );

        if(
            found !== undefined
        ){

            const value =
                object[found];

            if(
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            ){

                return value;
            }
        }
    }

    return "";
}


/* =========================================================
   FIELD HELPERS
   ========================================================= */

function getFixtureId(match){

    return getValue(
        match,
        [
            "Fixture ID",
            "API Fixture ID",
            "fixture_id",
            "fixtureId",
            "Fixture"
        ]
    );
}


function getDate(match){

    return getValue(
        match,
        [
            "Date",
            "Match Date",
            "Fixture Date",
            "date"
        ]
    );
}


function getTime(match){

    return getValue(
        match,
        [
            "Time",
            "Match Time",
            "Kickoff",
            "Kick-off",
            "Kick Off",
            "Start Time"
        ]
    );
}


function getHome(match){

    return getValue(
        match,
        [
            "Home Team",
            "HomeTeam",
            "Home",
            "Team Home"
        ]
    );
}


function getAway(match){

    return getValue(
        match,
        [
            "Away Team",
            "AwayTeam",
            "Away",
            "Team Away"
        ]
    );
}


function getLeague(match){

    return getValue(
        match,
        [
            "League",
            "Competition",
            "League Name",
            "Tournament"
        ]
    );
}


function getPrediction(match){

    return getValue(
        match,
        [
            "Prediction",
            "AI Prediction",
            "Prediction Advice",
            "Advice"
        ]
    );
}


function getConfidence(match){

    const value =
        getValue(
            match,
            [
                "Final Confidence",
                "Final confidence",
                "Final Confidence %",
                "Final confidence %",
                "Confidence %",
                "Confidence",
                "AI Confidence"
            ]
        );

    if(
        value === "" ||
        value === null ||
        value === undefined
    ){

        return null;
    }

    const parsed =
        parseFloat(
            String(value)
                .replace("%","")
                .replace(",",".")
                .trim()
        );

    return Number.isFinite(parsed)
        ? parsed
        : null;
}


function getRisk(match){

    const direct =
        getValue(
            match,
            [
                "Risk Level",
                "Risk",
                "Risk Category",
                "Risk Rating",
                "AI Risk"
            ]
        );

    if(
        direct !== ""
    ){

        return String(direct);
    }

    const confidence =
        getConfidence(match);

    if(
        confidence === null
    ){

        return "";
    }

    if(
        confidence >= 70
    ){

        return "LOW";
    }

    if(
        confidence >= 55
    ){

        return "MEDIUM";
    }

    return "HIGH";
}


function getMarket(match){

    const direct =
        getValue(
            match,
            [
                "Recommended Market",
                "recommended market",
                "Recommended market",
                "Market",
                "Betting Market",
                "Selection Market",
                "Prediction Market"
            ]
        );

    if(
        direct !== ""
    ){

        return String(direct);
    }

    const text =
        String(
            getPrediction(match)
        ).toLowerCase();

    if(
        text.includes("double chance")
    ){

        return "Double Chance";
    }

    if(
        text.includes("over 0.5")
    ){

        return "Over 0.5 Goals";
    }

    if(
        text.includes("over 1.5")
    ){

        return "Over 1.5 Goals";
    }

    if(
        text.includes("over 2.5")
    ){

        return "Over 2.5 Goals";
    }

    if(
        text.includes("under 2.5")
    ){

        return "Under 2.5 Goals";
    }

    if(
        text.includes("under 3.5")
    ){

        return "Under 3.5 Goals";
    }

    if(
        text.includes("btts") ||
        text.includes("both teams to score")
    ){

        return "Both Teams To Score";
    }

    if(
        text.includes("draw")
    ){

        return "Draw";
    }

    return "";
}


function getH2H(match){

    return getValue(
        match,
        [
            "Head to Head",
            "Head To Head",
            "head to head",
            "H2H"
        ]

}


function getH2HScore(match){

        ]

}


function getOddsValue(match){

    return getValue(
        match,
        [
            "Odds Value Score",
            "Odds value score",
            "Odds Value",
            "Value Score"
        ]
    );
}


function getFormScore(match){

    return getValue(
        match,
        [
            "Form Score",
            "form score",
            "Team Form Score"
        ]
    );
}


function getGoalsScore(match){

    return getValue(
        match,
        [
            "Goals Score",
            "Goals score",
            "goals score"
        ]
    );
}


function getDefensiveScore(match){

    return getValue(
        match,
        [
            "Defensive Score",
            "Defensive score",
            "defensive score"
        ]
    );
}


function getHomeGoals(match){

    return getValue(
        match,
        [
            "Home Goals Scored Avg",
            "Home Goals Scored",
            "Home Avg Goals"
        ]
    );
}


function getAwayGoals(match){

    return getValue(
        match,
        [
            "Away Goals Scored Avg",
            "Away Goals Scored",
            "Away Avg Goals"
        ]
    );
}


/* =========================================================
   BACKEND RESPONSE
   ========================================================= */

function extractMatches(data){

    /*
     * CURRENT APEX RESPONSE:
     *
     * {
     *   status:"SUCCESS",
     *   matches:[...]
     * }
     */

    if(
        data &&
        Array.isArray(data.matches)
    ){

        return data.matches;
    }

    /* Compatibility */

    if(
        data &&
        data.smartGate &&
        Array.isArray(data.smartGate.objects)
    ){

        return data.smartGate.objects;
    }

    if(
        data &&
        Array.isArray(data.smartGate)
    ){

        return data.smartGate;
    }

    if(
        data &&
        data.matchDatabase &&
        Array.isArray(data.matchDatabase.objects)
    ){

        return data.matchDatabase.objects;
    }

    if(
        data &&
        Array.isArray(data.data)
    ){

        return data.data;
    }

    return [];
}


/* =========================================================
   PREPARE 30 MATCHES
   ========================================================= */

function prepareMatches(source){

    const matches =
        Array.isArray(source)
            ? source
            : [];

    const seen =
        new Set();

    const result =
        [];

    matches.forEach(
        function(match,index){

            const home =
                String(
                    getHome(match)
                ).trim();

            const away =
                String(
                    getAway(match)
                ).trim();

            const prediction =
                String(
                    getPrediction(match)
                ).trim();

            if(
                !home ||
                !away ||
                !prediction
            ){

                return;
            }

            if(
                prediction.toLowerCase()
                ===
                "no predictions available"
            ){

                return;
            }

            const fixture =
                String(
                    getFixtureId(match)
                ).trim();

            const identity =
                fixture
                    ?
                    "fixture:" +
                    normaliseKey(fixture)

                    :

                    [
                        getDate(match),
                        home,
                        away,
                        getLeague(match)
                    ]
                    .map(normaliseKey)
                    .join("|");

            const key =
                identity ||
                "row:" + index;

            if(
                seen.has(key)
            ){

                return;
            }

            seen.add(key);

            result.push(match);

        }
    );

    result.sort(
        function(a,b){

            return(
                (
                    getConfidence(b)
                    ?? -1
                )
                -
                (
                    getConfidence(a)
                    ?? -1
                )
            );

        }
    );

    return result.slice(
        0,
        MAX_MATCHES
    );
}


/* =========================================================
   API REQUEST
   ========================================================= */

async function fetchAPEXData(){

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            function(){

                controller.abort();

            },
            REQUEST_TIMEOUT
        );

    try{

        const url =
            APEX_API_URL +
            "?request=dashboard" +
            "&limit=" +
            MAX_MATCHES +
            "&ts=" +
            Date.now();

        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store",
                    redirect:"follow",
                    signal:
                        controller.signal
                }
            );

        const raw =
            await response.text();

        if(
            !response.ok
        ){

            throw new Error(
                "APEX backend HTTP " +
                response.status
            );
        }

        if(
            !raw.trim()
        ){

            throw new Error(
                "APEX backend returned an empty response."
            );
        }

        let data;

        try{

            data =
                JSON.parse(raw);

        }catch(error){

            console.error(
                "APEX ANALYSIS RAW RESPONSE:",
                raw
            );

            throw new Error(
                "APEX backend returned invalid JSON."
            );
        }

        if(
            data &&
            String(data.status).toUpperCase()
            ===
            "ERROR"
        ){

            throw new Error(
                data.message ||
                "APEX backend returned an error."
            );
        }

        return data;

    }catch(error){

        if(
            error.name ===
            "AbortError"
        ){

            throw new Error(
                "APEX backend request timed out."
            );
        }

        throw error;

    }finally{

        clearTimeout(timer);
    }
}


/* =========================================================
   RETRY
   ========================================================= */

async function loadAPEXData(){

    let lastError =
        null;

    for(
        let attempt = 0;
        attempt <= RETRIES;
        attempt++
    ){

        try{

            return await fetchAPEXData();

        }catch(error){

            lastError =
                error;

            if(
                attempt <
                RETRIES
            ){

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            1000
                        )
                );
            }
        }
    }

    throw(
        lastError ||
        new Error(
            "Unable to connect to APEX backend."
        )
    );
}


/* =========================================================
   CREATE METRIC
   ========================================================= */

function createMetric(
    title,
    value,
    className
){

    if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ){

        return "";
    }

    return `

        <div class="metric">

            <div class="metric-title">

                ${safe(title)}

            </div>

            <div class="
                metric-value
                ${className || ""}
            ">

                ${safe(value)}

            </div>

        </div>

    `;
}


/* =========================================================
   RENDER
   ========================================================= */

function renderAnalysis(
    matches
){

    const container =
        document.getElementById(
            "analysisContainer"
        );

    if(
        !container
    ){

        return;
    }

    if(
        !matches.length
    ){

        container.innerHTML = `

            <div class="empty">

                <h2>
                    ⚠️ No Analysis Available
                </h2>

                <p>
                    The APEX backend is connected,
                    but no qualified analysis records
                    were returned.
                </p>

            </div>

        `;

        return;
    }


    let html = `

        <div class="summary">

            <div class="summary-top">

                <div>

                    <h1>
                        🤖 AI Match Analysis
                    </h1>

                    <p>
                        Detailed analysis of the current
                        APEX Smart Gate selections.
                    </p>

                </div>


                <div class="count-box">

                    <div class="count-number">
                        ${matches.length}
                    </div>

                    <div class="count-label">
                        ANALYSIS RECORDS
                    </div>

                </div>

            </div>

        </div>

    `;


    matches.forEach(
        function(
            match,
            index
        ){

            const home =
                getHome(match);

            const away =
                getAway(match);

            const league =
                getLeague(match);

            const date =
                getDate(match);

            const time =
                getTime(match);

            const prediction =
                getPrediction(match);

            const confidence =
                getConfidence(match);

            const risk =
                getRisk(match);

            const market =
                getMarket(match);

            const h2h =
                getH2H(match);

            const h2hScore =
                getH2HScore(match);

            const homeAdvantage =
                getHomeAdvantage(match);

            const odds =
                getOdds(match);

            const oddsValue =
                getOddsValue(match);

            const formScore =
                getFormScore(match);

            const goalsScore =
                getGoalsScore(match);

            const defensiveScore =
                getDefensiveScore(match);

            const homeGoals =
                getHomeGoals(match);

            const awayGoals =
                getAwayGoals(match);

            const riskText =
                String(
                    risk || ""
                ).toLowerCase();

            let riskClass =
                "high";

            if(
                riskText.includes("low")
            ){

                riskClass =
                    "low";

            }else if(
                riskText.includes("medium")
            ){

                riskClass =
                    "medium";
            }


            html += `

                <div class="match-card">


                    <div class="match-top">

                        <div class="match-number">
                            MATCH ${index + 1}
                        </div>

                        <div class="league">

                            🏆 ${safe(
                                league ||
                                "League"
                            )}

                        </div>

                    </div>


                    <div class="match-main">

                        <div class="teams">

                            <div class="team">

                                ${safe(
                                    home ||
                                    "Home Team"
                                )}

                            </div>


                            <div class="vs">
                                VS
                            </div>


                            <div class="team">

                                ${safe(
                                    away ||
                                    "Away Team"
                                )}

                            </div>

                        </div>


                        <div class="match-date">

                            ${safe(
                                date ||
                                "Date unavailable"
                            )}

                            ${
                                time
                                    ? " · " +
                                      safe(time)
                                    : ""
                            }

                        </div>

                    </div>


                    <div class="prediction-box">

                        <div class="prediction-label">

                            🤖 AI Prediction

                        </div>


                        <div class="prediction-value">

                            ${safe(
                                prediction ||
                                "—"
                            )}

                        </div>

                    </div>


                    <div class="section-title">

                        📊 Core Analysis

                    </div>


                    <div class="metric-grid">

                        ${createMetric(
                            "Confidence",
                            confidence !== null
                                ? confidence + "%"
                                : "",
                            "confidence"
                        )}


                        ${createMetric(
                            "Risk Level",
                            risk,
                            riskClass
                        )}


                        ${createMetric(
                            "Recommended Market",
                            market
                        )}


                        ${createMetric(
                            "Home Advantage",
                            homeAdvantage
                        )}


                        ${createMetric(
                            "H2H Score",
                            h2hScore
                        )}


                        ${createMetric(
                            "Bookmaker Odds",
                            odds
                        )}

                    </div>


                    <div class="advanced-section">

                        <div
                            class="section-title"
                            style="padding-left:0;"
                        >
                            🔍 Additional Metrics
                        </div>


                        <div class="advanced-grid">


                            <div class="advanced-item">

                                <div class="advanced-label">
                                    HEAD TO HEAD
                                </div>

                                <div class="advanced-value">
                                    ${safe(
                                        h2h ||
                                        "Not available"
                                    )}
                                </div>

                            </div>


                            <div class="advanced-item">

                                <div class="advanced-label">
                                    ODDS VALUE SCORE
                                </div>

                                <div class="advanced-value">
                                    ${safe(
                                        oddsValue ||
                                        "Not available"
                                    )}
                                </div>

                            </div>


                            <div class="advanced-item">

                                <div class="advanced-label">
                                    FORM SCORE
                                </div>

                                <div class="advanced-value">
                                    ${safe(
                                        formScore ||
                                        "Not available"
                                    )}
                                </div>

                            </div>


                            <div class="advanced-item">

                                <div class="advanced-label">
                                    GOALS SCORE
                                </div>

                                <div class="advanced-value">
                                    ${safe(
                                        goalsScore ||
                                        "Not available"
                                    )}
                                </div>

                            </div>


                            <div class="advanced-item">

                                <div class="advanced-label">
                                    DEFENSIVE SCORE
                                </div>

                                <div class="advanced-value">
                                    ${safe(
                                        defensiveScore ||
                                        "Not available"
                                    )}
                                </div>

                            </div>


                            <div class="advanced-item">

                                <div class="advanced-label">
                                    HOME GOALS AVG
                                </div>

                                <div class="advanced-value">
                                    ${safe(
                                        homeGoals ||
                                        "Not available"
                                    )}
                                </div>

                            </div>


                            <div class="advanced-item">

                                <div class="advanced-label">
                                    AWAY GOALS AVG
                                </div>

                                <div class="advanced-value">
                                    ${safe(
                                        awayGoals ||
                                        "Not available"
                                    )}
                                </div>

                            </div>


                        </div>

                    </div>


                    <div class="match-footer">

                        <span>
                            APEX AI ENGINE
                        </span>

                        <span>
                            SMART GATE · MATCH ${index + 1}
                        </span>

                    </div>


                </div>

            `;
        }
    );


    container.innerHTML =
        html;
}


/* =========================================================
   MAIN
   ========================================================= */

async function loadAnalysis(){

    const status =
        document.getElementById(
            "analysisStatus"
        );

    const container =
        document.getElementById(
            "analysisContainer"
        );


    try{

        status.className =
            "status";

        status.textContent =
            "🔄 Connecting to current APEX backend...";


        const data =
            await loadAPEXData();


        const source =
            extractMatches(
                data
            );


        const matches =
            prepareMatches(
                source
            );


        renderAnalysis(
            matches
        );


        status.textContent =
            "✅ APEX AI Connected · " +
            matches.length +
            " analysis records";


        console.log(
            "APEX ANALYSIS SUCCESS",
            {
                backendStatus:
                    data.status,

                backendMatches:
                    source.length,

                displayedMatches:
                    matches.length,

                maximum:
                    MAX_MATCHES
            }
        );


    }catch(error){

        console.error(
            "APEX Analysis Error:",
            error
        );


        status.className =
            "status error";

        status.textContent =
            "❌ APEX Analysis failed to load";


        container.innerHTML = `

            <div class="error">

                <h2>
                    ❌ Unable to Load Analysis
                </h2>

                <p>
                    ${safe(
                        error.message
                    )}
                </p>

            </div>

        `;
    }
}


/* =========================================================
   NAVIGATION
   ========================================================= */

function go(page){

    const allowed = [

        "dashboard.html",
        "predictions.html",
        "analysis.html",
        "statistics.html",
        "livescores.html",
        "leagues.html",
        "headtohead.html",
        "settings.html",
        "index.html"

    ];

    window.location.href =
        "./" +
        (
            allowed.includes(page)
                ? page
                : "dashboard.html"
        );
}


/* =========================================================
   GLOBAL
   ========================================================= */

window.go =
    go;

window.loadAnalysis =
    loadAnalysis;


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadAnalysis
);

</script>
