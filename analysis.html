<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Analysis</title>

<link rel="stylesheet" href="styles.css">

<style>

:root{
    --bg:#071321;
    --panel:#0d1c2d;
    --panel2:#10243a;
    --border:rgba(255,255,255,.08);
    --text:#ffffff;
    --muted:#9eacba;
    --green:#00d66b;
    --green-dark:#00a950;
    --blue:#2f7cff;
    --yellow:#ffbf22;
    --red:#ff4d5f;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at top left,
            rgba(0,214,107,.10),
            transparent 32%
        ),
        radial-gradient(
            circle at top right,
            rgba(47,124,255,.10),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #050d17,
            #071321 50%,
            #0a1828
        );

    color:var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

.app{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:14px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-icon{
    width:46px;
    height:46px;
    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #19354e,
            #0a1828
        );

    border:1px solid rgba(0,214,107,.22);

    font-size:24px;
}

.brand-title{
    margin:0;
    font-size:21px;
    font-weight:800;
}

.brand-title span{
    color:var(--green);
}

.brand-subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.page-badge{
    padding:7px 10px;
    border-radius:999px;

    background:rgba(0,214,107,.08);
    border:1px solid rgba(0,214,107,.18);

    color:#9ff0c1;
    font-size:11px;
    font-weight:700;
}

.status{
    padding:12px 14px;
    margin-bottom:15px;

    border-radius:13px;

    background:rgba(255,255,255,.035);
    border:1px solid var(--border);

    color:#a9f0c2;

    text-align:center;
    font-size:12px;
    font-weight:700;
}

.summary{
    background:
        linear-gradient(
            145deg,
            rgba(13,28,45,.98),
            rgba(8,20,34,.98)
        );

    border:1px solid var(--border);
    border-radius:20px;

    padding:18px;

    margin-bottom:15px;

    box-shadow:
        0 15px 35px rgba(0,0,0,.24);
}

.summary-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.summary h1{
    margin:0 0 6px;
    font-size:23px;
}

.summary p{
    margin:0;
    color:var(--muted);
    font-size:12px;
}

.count-box{
    text-align:right;
}

.count-number{
    color:var(--green);
    font-size:28px;
    font-weight:900;
}

.count-label{
    color:#788797;
    font-size:10px;
}

.analysis-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.match-card{
    background:
        linear-gradient(
            145deg,
            rgba(13,28,45,.98),
            rgba(8,20,34,.98)
        );

    border:1px solid var(--border);
    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 15px 35px rgba(0,0,0,.24);
}

.match-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:15px 16px 10px;
}

.match-number{
    color:#7f8d9d;
    font-size:10px;
    font-weight:800;
}

.league{
    color:#c6d1dc;
    font-size:10px;
    font-weight:700;
    text-align:right;
}

.match-main{
    padding:7px 16px 17px;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:9px;
    text-align:center;
}

.team{
    color:#fff;
    font-size:18px;
    font-weight:800;
    line-height:1.3;
}

.vs{
    color:#7e8b9b;
    font-size:11px;
    font-weight:900;
}

.match-date{
    color:#718091;
    font-size:10px;
    text-align:center;
    margin-top:9px;
}

.prediction-box{
    margin:0 15px 15px;

    padding:15px;

    background:
        linear-gradient(
            135deg,
            rgba(0,214,107,.10),
            rgba(0,214,107,.035)
        );

    border:1px solid rgba(0,214,107,.15);

    border-left:4px solid var(--green);

    border-radius:14px;
}

.prediction-label{
    color:#8edbaa;
    font-size:10px;
    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.5px;

    margin-bottom:6px;
}

.prediction-value{
    color:#fff;
    font-size:16px;
    font-weight:800;
    line-height:1.4;
}

.section-title{
    padding:0 15px 10px;

    color:#dfe7ef;
    font-size:14px;
    font-weight:800;
}

.metric-grid{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);

    gap:9px;

    padding:0 15px 15px;
}

.metric{
    min-height:72px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.055);

    border-radius:12px;

    padding:12px;
}

.metric-title{
    color:#788797;
    font-size:10px;
    font-weight:700;

    margin-bottom:7px;
}

.metric-value{
    color:#fff;
    font-size:14px;
    font-weight:800;
    word-break:break-word;
    line-height:1.35;
}

.metric-value.confidence{
    color:var(--green);
    font-size:20px;
}

.metric-value.low{
    color:#7ef0ad;
}

.metric-value.medium{
    color:#ffd56d;
}

.metric-value.high{
    color:#ff8d99;
}

.advanced-section{
    padding:0 15px 15px;
}

.advanced-grid{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);

    gap:8px;
}

.advanced-item{
    background:#091725;
    border:1px solid rgba(255,255,255,.05);
    border-radius:11px;
    padding:11px;
}

.advanced-label{
    color:#728194;
    font-size:9px;
    margin-bottom:5px;
    font-weight:700;
}

.advanced-value{
    color:#dce5ed;
    font-size:12px;
    font-weight:700;
    word-break:break-word;
}

.match-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:11px 15px;

    border-top:1px solid rgba(255,255,255,.06);

    color:#697888;

    font-size:9px;
}

.empty,
.error{
    padding:25px;
    border-radius:17px;
    text-align:center;
}

.empty{
    background:#0d1c2d;
    border:1px solid var(--border);
    color:#b9c6d3;
}

.error{
    background:#3a1515;
    color:#ffb4ab;
}

.navigation{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:9px;

    margin-top:18px;
    padding-bottom:25px;
}

.navigation button{
    min-height:48px;

    border:1px solid var(--border);
    border-radius:12px;

    background:#0d1c2d;
    color:#e8edf3;

    font-size:11px;
    font-weight:700;
}

.navigation button:hover{
    border-color:rgba(0,214,107,.35);
}

@media(max-width:650px){

    .app{
        padding:10px;
    }

    .page-badge{
        display:none;
    }

    .teams{
        grid-template-columns:1fr;
    }

    .vs{
        margin:-3px 0;
    }

    .navigation{
        grid-template-columns:
            1fr 1fr;
    }

}

@media(max-width:390px){

    .summary-top{
        flex-direction:column;
        align-items:flex-start;
    }

    .count-box{
        text-align:left;
    }

    .metric-grid,
    .advanced-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

<div class="app">

    <div class="topbar">

        <div class="brand">

            <div class="brand-icon">
                ⚽
            </div>

            <div>

                <h2 class="brand-title">
                    APEX <span>PREDICT AI</span>
                </h2>

                <div class="brand-subtitle">
                    Professional Football Intelligence
                </div>

            </div>

        </div>


        <div class="page-badge">
            AI ANALYSIS
        </div>

    </div>


    <div
        id="analysisStatus"
        class="status"
    >
        🔄 Loading today's analysis...
    </div>


    <div
        id="analysisContainer"
        class="analysis-list"
    >

        <div class="empty">

            🔄 Loading APEX analysis...

        </div>

    </div>


    <div class="navigation">

        <button onclick="go('dashboard.html')">
            🏠 Dashboard
        </button>

        <button onclick="go('predictions.html')">
            🤖 Predictions
        </button>

        <button onclick="go('statistics.html')">
            📈 Statistics
        </button>

        <button onclick="go('livescores.html')">
            ⚽ Live Scores
        </button>

        <button onclick="go('leagues.html')">
            🏆 Leagues
        </button>

        <button onclick="go('headtohead.html')">
            ⚔ Head To Head
        </button>

        <button onclick="go('settings.html')">
            ⚙ Settings
        </button>

        <button onclick="go('index.html')">
            🚪 Logout
        </button>

    </div>

</div>


<script>

"use strict";


const GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getValue(match,names){

    const keys =
        Object.keys(match);

    for(const wanted of names){

        const key =
            keys.find(function(existingKey){

                return existingKey
                    .trim()
                    .toLowerCase()
                    ===
                    wanted
                        .trim()
                        .toLowerCase();

            });


        if(key !== undefined){

            const value =
                match[key];

            if(
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            ){

                return value;

            }

        }

    }

    return "";

}


function getRiskClass(risk){

    const text =
        String(risk || "")
            .toLowerCase();

    if(text === "low"){
        return "low";
    }

    if(text === "medium"){
        return "medium";
    }

    return "high";

}


function createMetric(
    title,
    value,
    extraClass
){

    if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ){

        return "";

    }

    return `

        <div class="metric">

            <div class="metric-title">
                ${escapeHTML(title)}
            </div>

            <div class="
                metric-value
                ${extraClass || ""}
            ">

                ${escapeHTML(value)}

            </div>

        </div>

    `;

}


async function loadAnalysis(){

    const status =
        document.getElementById(
            "analysisStatus"
        );

    const container =
        document.getElementById(
            "analysisContainer"
        );


    try{

        status.textContent =
            "🔄 Connecting to APEX Predict AI...";


        const response =
            await fetch(
                GOOGLE_SHEETS_API,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !data.matchDatabase ||
            !Array.isArray(
                data.matchDatabase.objects
            )
        ){

            throw new Error(
                "APEX Match Database was not returned."
            );

        }


        const allMatches =
            data.matchDatabase.objects;


        /*
         * Preserve the working analysis selection
         * logic used by the current APEX web app.
         */

        const completedMatches =
            allMatches.filter(
                function(match){

                    const prediction =
                        getValue(
                            match,
                            [
                                "Prediction",
                                "prediction",
                                "AI Prediction"
                            ]
                        );

                    const confidence =
                        getValue(
                            match,
                            [
                                "Confidence %",
                                "Confidence",
                                "confidence %",
                                "Final Confidence"
                            ]
                        );

                    const market =
                        getValue(
                            match,
                            [
                                "Recommended Market",
                                "recommended market",
                                "Recommended market",
                                "Market"
                            ]
                        );

                    return(
                        prediction !== "" ||
                        confidence !== "" ||
                        market !== ""
                    );

                }
            );


        const matches =
            completedMatches
                .slice()
                .reverse()
                .slice(0,10);


        status.textContent =
            "✅ APEX AI Connected — " +
            matches.length +
            " analysis records";


        if(!matches.length){

            container.innerHTML = `

                <div class="empty">

                    <h2>
                        ⚠️ No Analysis Available
                    </h2>

                    <p>
                        APEX is connected, but completed
                        AI analysis is not available yet.
                    </p>

                </div>

            `;

            return;

        }


        let html = `

            <div class="summary">

                <div class="summary-top">

                    <div>

                        <h1>
                            🤖 AI Match Analysis
                        </h1>

                        <p>
                            Analysis generated from the
                            final APEX selections.
                        </p>

                    </div>


                    <div class="count-box">

                        <div class="count-number">
                            ${matches.length}
                        </div>

                        <div class="count-label">
                            ANALYSIS RECORDS
                        </div>

                    </div>

                </div>

            </div>

        `;


        matches.forEach(
            function(match,index){

                const home =
                    getValue(
                        match,
                        [
                            "Home Team",
                            "home team",
                            "HomeTeam",
                            "home_team",
                            "Home"
                        ]
                    );


                const away =
                    getValue(
                        match,
                        [
                            "Away Team",
                            "away team",
                            "AwayTeam",
                            "away_team",
                            "Away"
                        ]
                    );


                const league =
                    getValue(
                        match,
                        [
                            "League",
                            "league",
                            "League Name"
                        ]
                    );


                const date =
                    getValue(
                        match,
                        [
                            "Date",
                            "date",
                            "Match Date",
                            "match date"
                        ]
                    );


                const prediction =
                    getValue(
                        match,
                        [
                            "Prediction",
                            "prediction",
                            "AI Prediction",
                            "AI prediction"
                        ]
                    );


                const confidence =
                    getValue(
                        match,
                        [
                            "Confidence %",
                            "Confidence",
                            "confidence %",
                            "confidence",
                            "Final Confidence"
                        ]
                    );


                const risk =
                    getValue(
                        match,
                        [
                            "Risk Level",
                            "Risk",
                            "risk level",
                            "risk"
                        ]
                    );


                const market =
                    getValue(
                        match,
                        [
                            "Recommended Market",
                            "recommended market",
                            "Recommended market",
                            "Market"
                        ]
                    );


                const homeAdvantage =
                    getValue(
                        match,
                        [
                            "Home Advantage Score",
                            "Home advantage score",
                            "home advantage score",
                            "Home Advantage"
                        ]
                    );


                const h2h =
                    getValue(
                        match,
                        [
                            "Head to Head",
                            "Head To Head",
                            "head to head",
                            "H2H"
                        ]
                    );


                const h2hScore =
                    getValue(
                        match,
                        [
                            "Head to Head Score",
                            "Head To Head Score",
                            "head to head score",
                            "H2H Score"
                        ]
                    );


                const odds =
                    getValue(
                        match,
                        [
                            "Bookmaker Odds",
                            "Bookmaker odds",
                            "bookmaker odds",
                            "Odds"
                        ]
                    );


                const oddsValue =
                    getValue(
                        match,
                        [
                            "Odds Value Score",
                            "Odds value score",
                            "odds value score",
                            "Odds Value"
                        ]
                    );


                const formScore =
                    getValue(
                        match,
                        [
                            "Form Score",
                            "form score",
                            "Team Form Score"
                        ]
                    );


                const goalsScore =
                    getValue(
                        match,
                        [
                            "Goals Score",
                            "Goals score",
                            "goals score"
                        ]
                    );


                const defensiveScore =
                    getValue(
                        match,
                        [
                            "Defensive Score",
                            "Defensive score",
                            "defensive score"
                        ]
                    );


                const riskClass =
                    getRiskClass(risk);


                html += `

                    <div class="match-card">


                        <div class="match-top">

                            <div class="match-number">
                                MATCH ${index + 1}
                            </div>

                            <div class="league">

                                🏆 ${escapeHTML(
                                    league || "League"
                                )}

                            </div>

                        </div>


                        <div class="match-main">

                            <div class="teams">

                                <div class="team">

                                    ${escapeHTML(
                                        home || "Home Team"
                                    )}

                                </div>


                                <div class="vs">
                                    VS
                                </div>


                                <div class="team">

                                    ${escapeHTML(
                                        away || "Away Team"
                                    )}

                                </div>

                            </div>


                            <div class="match-date">

                                ${escapeHTML(
                                    date || "Date unavailable"
                                )}

                            </div>

                        </div>


                        <div class="prediction-box">

                            <div class="prediction-label">
                                🤖 AI Prediction
                            </div>

                            <div class="prediction-value">

                                ${escapeHTML(
                                    prediction || "—"
                                )}

                            </div>

                        </div>


                        <div class="section-title">
                            📊 Core Analysis
                        </div>


                        <div class="metric-grid">

                            ${createMetric(
                                "Confidence",
                                confidence !== ""
                                    ? confidence + "%"
                                    : "",
                                "confidence"
                            )}

                            ${createMetric(
                                "Risk Level",
                                risk,
                                riskClass
                            )}

                            ${createMetric(
                                "Recommended Market",
                                market
                            )}

                            ${createMetric(
                                "Home Advantage",
                                homeAdvantage
                            )}

                            ${createMetric(
                                "H2H Score",
                                h2hScore
                            )}

                            ${createMetric(
                                "Bookmaker Odds",
                                odds
                            )}

                        </div>


                        <div class="advanced-section">

                            <div class="section-title"
                                 style="padding-left:0;">

                                🔍 Additional Metrics

                            </div>


                            <div class="advanced-grid">


                                <div class="advanced-item">

                                    <div class="advanced-label">
                                        HEAD TO HEAD
                                    </div>

                                    <div class="advanced-value">

                                        ${escapeHTML(
                                            h2h || "Not available"
                                        )}

                                    </div>

                                </div>


                                <div class="advanced-item">

                                    <div class="advanced-label">
                                        ODDS VALUE SCORE
                                    </div>

                                    <div class="advanced-value">

                                        ${escapeHTML(
                                            oddsValue || "Not available"
                                        )}

                                    </div>

                                </div>


                                <div class="advanced-item">

                                    <div class="advanced-label">
                                        FORM SCORE
                                    </div>

                                    <div class="advanced-value">

                                        ${escapeHTML(
                                            formScore || "Not available"
                                        )}

                                    </div>

                                </div>


                                <div class="advanced-item">

                                    <div class="advanced-label">
                                        GOALS SCORE
                                    </div>

                                    <div class="advanced-value">

                                        ${escapeHTML(
                                            goalsScore || "Not available"
                                        )}

                                    </div>

                                </div>


                                <div class="advanced-item">

                                    <div class="advanced-label">
                                        DEFENSIVE SCORE
                                    </div>

                                    <div class="advanced-value">

                                        ${escapeHTML(
                                            defensiveScore || "Not available"
                                        )}

                                    </div>

                                </div>


                            </div>

                        </div>


                        <div class="match-footer">

                            <span>
                                APEX AI ENGINE
                            </span>

                            <span>
                                SMART GATE SELECTION
                            </span>

                        </div>

                    </div>

                `;

            }
        );


        container.innerHTML =
            html;


    }
    catch(error){

        console.error(
            "APEX Analysis Error:",
            error
        );


        status.textContent =
            "❌ APEX Analysis failed to load";


        container.innerHTML = `

            <div class="error">

                <h2>
                    ❌ Unable to Load Analysis
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


function go(page){

    window.location.href =
        page;

}


document.addEventListener(
    "DOMContentLoaded",
    loadAnalysis
);

</script>

</body>

</html>
