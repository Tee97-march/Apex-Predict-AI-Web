/* =========================================================

/* =========================================================
   GOOGLE SHEETS API
   ========================================================= */

const GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";



/* =========================================================
   SAFE VALUE FUNCTION
   ========================================================= */

function getValue(match, names) {

    for (let i = 0; i < names.length; i++) {

        const key = names[i];

        if (
            match[key] !== undefined &&
            match[key] !== null &&
            match[key] !== ""
        ) {

            return match[key];

        }

    }

    return "—";

}



/* =========================================================
   LOAD MATCH ANALYSIS
   ========================================================= */

        document.getElementById("analysisContainer");

    const status =
        document.getElementById("connectionStatus");


    try {

        status.textContent =
            "🔄 Connecting to Google Sheets...";


        const response =
            await fetch(GOOGLE_SHEETS_API);


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "APEX Predict AI Analysis Data:",
            data
        );


        const matchDatabase =
            data.matchDatabase;


        if (
            !matchDatabase ||
            !Array.isArray(matchDatabase.objects) ||
            matchDatabase.objects.length === 0
        ) {

            status.textContent =
                "⚠️ No match data available";


            container.innerHTML = `

                <div style="
                    background:#ffffff;
                    color:#111;
                    padding:25px;
                    border-radius:16px;
                    text-align:center;
                ">

                    <h2>
                        ⚠️ No Match Data
                    </h2>

                    <p style="margin-top:10px;">
                        No matches were found in the
                        Google Sheets Match Database.
                    </p>

                </div>

            `;

            return;

        }


        status.textContent =
            "✅ Google Sheets Connected";


        const matches =
            matchDatabase.objects;

                    margin-bottom:8px;

           ANALYSE EACH MATCH

                    "home team",
                    "Home"
                ]);

                    "Away Team",

                    "Away"

                    "Confidence",

                ]);

                    "Risk",

                    "Market"
