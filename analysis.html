<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Match Analysis</title>

<link rel="stylesheet" href="styles.css">

<style>

.analysis-header{
    text-align:center;
    margin-bottom:25px;
}

.analysis-header h1{
    font-size:34px;
    margin-bottom:10px;
}

.analysis-header p{
    color:#cfd8e3;
    font-size:17px;
}

.analysis-status{
    text-align:center;
    margin:15px 0 25px;
    padding:14px;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    font-weight:bold;
    color:#b9f6ca;
}

.analysis-summary{
    background:#ffffff;
    color:#111;
    border-radius:22px;
    padding:25px;
    margin-bottom:22px;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.analysis-summary h2{
    color:#061326;
    margin-bottom:10px;
    font-size:26px;
}

.analysis-summary p{
    color:#333;
    margin:5px 0;
}

.match-card{
    background:#ffffff;
    color:#111;
    border-radius:22px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.match-card h2{
    color:#061326;
    margin-bottom:18px;
    font-size:25px;
}

.match-teams{
    background:#f5f7fa;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

.match-teams .teams{
    font-size:25px;
    font-weight:bold;
    color:#061326;
    margin-bottom:12px;
}

.match-teams .vs{
    color:#777;
    font-weight:normal;
}

.match-teams p{
    margin:7px 0;
    color:#333;
}

.prediction-box{
    background:#e8f7eb;
    border-left:7px solid #00c853;
    border-radius:15px;
    padding:20px;
    margin:20px 0;
}

.prediction-box h3{
    color:#061326;
    margin-bottom:8px;
}

.prediction-value{
    font-size:24px;
    font-weight:bold;
    color:#00a844;
}

.analysis-section-title{
    color:#061326;
    font-size:23px;
    margin:25px 0 15px;
    border-bottom:1px solid #ddd;
    padding-bottom:10px;
}

.analysis-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.data-field{
    background:#f7f8fa;
    border:1px solid #e4e7eb;
    border-radius:14px;
    padding:16px;
    min-width:0;
}

.data-label{
    font-weight:bold;
    color:#555;
    margin-bottom:7px;
    font-size:15px;
}

.data-value{
    color:#111;
    font-size:18px;
    word-break:break-word;
}

.empty-message{
    background:#ffffff;
    color:#222;
    padding:25px;
    border-radius:20px;
    text-align:center;
    margin-bottom:25px;
}

.navigation{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:25px;
    padding-bottom:30px;
}

.navigation button{
    margin-top:0;
}

@media(max-width:600px){

    .analysis-header h1{
        font-size:28px;
    }

    .analysis-grid{
        grid-template-columns:1fr;
    }

    .analysis-summary,
    .match-card{
        padding:20px;
    }

    .match-teams .teams{
        font-size:21px;
    }

    .prediction-value{
        font-size:21px;
    }

    .navigation{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="analysis-header">

        <h1>🤖 AI Match Analysis</h1>

        <p>
            Analysis generated from APEX Predict AI
        </p>

    </div>


    <div
        id="analysisStatus"
        class="analysis-status"
    >
        🔄 Loading today's analysis...
    </div>


    <div id="analysisContainer">

        <div class="empty-message">
            🔄 Loading analysis...
        </div>

    </div>


    <div class="navigation">

        <button onclick="goTo('dashboard.html')">
            🏠 Dashboard
        </button>

        <button onclick="goTo('predictions.html')">
            🤖 Predictions
        </button>

        <button onclick="goTo('statistics.html')">
            📈 Statistics
        </button>

        <button onclick="goTo('livescores.html')">
            ⚽ Live Scores
        </button>

        <button onclick="goTo('leagues.html')">
            🏆 Leagues
        </button>

        <button onclick="goTo('headtohead.html')">
            ⚔ Head To Head
        </button>

        <button onclick="goTo('settings.html')">
            ⚙ Settings
        </button>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   APEX GOOGLE SHEETS API
   ========================================================= */

const GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


/* =========================================================
   SAFE HTML
   ========================================================= */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   FLEXIBLE COLUMN READER
   ========================================================= */

function getValue(match,names){

    for(const name of names){

        if(
            Object.prototype.hasOwnProperty.call(
                match,
                name
            )
        ){

            const value = match[name];

            if(
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            ){

                return value;

            }

        }

    }

    return "";

}


/* =========================================================
   DATA FIELD
   ========================================================= */

function createField(label,value){

    if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ){

        return "";

    }

    return `

        <div class="data-field">

            <div class="data-label">
                ${escapeHTML(label)}
            </div>

            <div class="data-value">
                ${escapeHTML(value)}
            </div>

        </div>

    `;

}


/* =========================================================
   LOAD ANALYSIS
   ========================================================= */

async function loadAnalysis(){

    const status =
        document.getElementById("analysisStatus");

    const container =
        document.getElementById("analysisContainer");


    try{

        status.textContent =
            "🔄 Connecting to APEX Predict AI...";


        const response =
            await fetch(
                GOOGLE_SHEETS_API,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "APEX Analysis Data:",
            data
        );


        if(
            !data.matchDatabase ||
            !Array.isArray(
                data.matchDatabase.objects
            )
        ){

            throw new Error(
                "Match Database was not returned."
            );

        }


        const allMatches =
            data.matchDatabase.objects;


        /* =================================================
           FIND RECORDS THAT CONTAIN AI RESULTS
           ================================================= */

        const completedMatches =
            allMatches.filter(function(match){

                const prediction =
                    getValue(match,[
                        "Prediction",
                        "prediction",
                        "AI Prediction"
                    ]);

                const confidence =
                    getValue(match,[
                        "Confidence %",
                        "Confidence",
                        "confidence %",
                        "confidence",
                        "Final Confidence"
                    ]);

                const market =
                    getValue(match,[
                        "Recommended Market",
                        "recommended market",
                        "Recommended market",
                        "Market"
                    ]);

                return (
                    prediction !== "" ||
                    confidence !== "" ||
                    market !== ""
                );

            });


        /* =================================================
           SAME DISPLAY RULE AS PREDICTIONS
           
           DO NOT CHANGE GOOGLE SHEETS.
           ONLY DISPLAY 10 ON THE WEBSITE.
           ================================================= */

        const matches =
            completedMatches
                .slice()
                .reverse()
                .slice(0,10);


        console.log(
            "APEX total database records:",
            allMatches.length
        );

        console.log(
            "APEX completed records:",
            completedMatches.length
        );

        console.log(
            "APEX Analysis display:",
            matches.length
        );


        if(matches.length === 0){

            status.textContent =
                "⚠️ No analysis available";

            container.innerHTML = `

                <div class="empty-message">

                    <h2>
                        ⚠️ No Analysis Available
                    </h2>

                    <p>
                        APEX is connected, but no completed
                        prediction analysis was found.
                    </p>

                </div>

            `;

            return;

        }


        status.textContent =
            "✅ APEX AI Connected — " +
            matches.length +
            " analysis records";


        /* =================================================
           SUMMARY
           ================================================= */

        let html = `

            <div class="analysis-summary">

                <h2>
                    🤖 APEX AI MATCH ANALYSIS
                </h2>

                <p>
                    Showing analysis for the final
                    ${matches.length} selected matches.
                </p>

            </div>

        `;


        /* =================================================
           BUILD THE 10 MATCHES
           ================================================= */

        matches.forEach(function(match,index){

            const homeTeam =
                getValue(match,[
                    "Home Team",
                    "home team",
                    "HomeTeam",
                    "home_team",
                    "Home"
                ]);


            const awayTeam =
                getValue(match,[
                    "Away Team",
                    "away team",
                    "AwayTeam",
                    "away_team",
                    "Away"
                ]);


            const league =
                getValue(match,[
                    "League",
                    "league",
                    "League Name"
                ]);


            const date =
                getValue(match,[
                    "Date",
                    "date",
                    "Match Date",
                    "match date"
                ]);


            const prediction =
                getValue(match,[
                    "Prediction",
                    "prediction",
                    "AI Prediction",
                    "AI prediction"
                ]);


            const confidence =
                getValue(match,[
                    "Confidence %",
                    "Confidence",
                    "confidence %",
                    "confidence",
                    "Final Confidence"
                ]);


            const risk =
                getValue(match,[
                    "Risk Level",
                    "Risk",
                    "risk level",
                    "risk"
                ]);


            const recommendedMarket =
                getValue(match,[
                    "Recommended Market",
                    "recommended market",
                    "Recommended market",
                    "Market"
                ]);


            /* =============================================
               ANALYSIS METRICS
               ============================================= */

            const homeAdvantage =
                getValue(match,[
                    "Home Advantage Score",
                    "Home advantage score",
                    "home advantage score",
                    "Home Advantage"
                ]);


            const headToHead =
                getValue(match,[
                    "Head to Head",
                    "Head To Head",
                    "head to head",
                    "H2H"
                ]);


            const headToHeadScore =
                getValue(match,[
                    "Head to Head Score",
                    "Head To Head Score",
                    "head to head score",
                    "H2H Score"
                ]);


            const bookmakerOdds =
                getValue(match,[
                    "Bookmaker Odds",
                    "Bookmaker odds",
                    "bookmaker odds",
                    "Odds"
                ]);


            const oddsValueScore =
                getValue(match,[
                    "Odds Value Score",
                    "Odds value score",
                    "odds value score"
                ]);


            const formScore =
                getValue(match,[
                    "Form Score",
                    "form score",
                    "Team Form Score"
                ]);


            const goalsScore =
                getValue(match,[
                    "Goals Score",
                    "Goals score",
                    "goals score"
                ]);


            const defensiveScore =
                getValue(match,[
                    "Defensive Score",
                    "Defensive score",
                    "defensive score"
                ]);


            /* =============================================
               MATCH CARD
               ============================================= */

            html += `

                <div class="match-card">

                    <h2>
                        ⚽ Match ${index + 1}
                    </h2>


                    <div class="match-teams">

                        <div class="teams">

                            ${escapeHTML(
                                homeTeam || "Home Team"
                            )}

                            <span class="vs">
                                vs
                            </span>

                            ${escapeHTML(
                                awayTeam || "Away Team"
                            )}

                        </div>


                        <p>
                            <strong>League:</strong>
                            ${escapeHTML(league || "—")}
                        </p>


                        <p>
                            <strong>Date:</strong>
                            ${escapeHTML(date || "—")}
                        </p>

                    </div>


                    <div class="prediction-box">

                        <h3>
                            🤖 AI Prediction
                        </h3>

                        <div class="prediction-value">
                            ${escapeHTML(
                                prediction || "—"
                            )}
                        </div>

                    </div>


                    <h3 class="analysis-section-title">
                        📊 Match Analysis
                    </h3>


                    <div class="analysis-grid">

                        ${createField(
                            "Confidence",
                            confidence
                        )}

                        ${createField(
                            "Risk Level",
                            risk
                        )}

                        ${createField(
                            "Recommended Market",
                            recommendedMarket
                        )}

                        ${createField(
                            "Home Advantage Score",
                            homeAdvantage
                        )}

                        ${createField(
                            "Head to Head",
                            headToHead
                        )}

                        ${createField(
                            "Head to Head Score",
                            headToHeadScore
                        )}

                        ${createField(
                            "Bookmaker Odds",
                            bookmakerOdds
                        )}

                        ${createField(
                            "Odds Value Score",
                            oddsValueScore
                        )}

                        ${createField(
                            "Form Score",
                            formScore
                        )}

                        ${createField(
                            "Goals Score",
                            goalsScore
                        )}

                        ${createField(
                            "Defensive Score",
                            defensiveScore
                        )}

                    </div>

                </div>

            `;

        });


        container.innerHTML =
            html;


    }catch(error){

        console.error(
            "APEX Analysis Error:",
            error
        );


        status.textContent =
            "❌ APEX Analysis Connection Failed";


        container.innerHTML = `

            <div class="empty-message">

                <h2>
                    ❌ Unable to Load Analysis
                </h2>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function goTo(page){

    window.location.href =
        page;

}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadAnalysis
);

</script>

</body>
    </html>
