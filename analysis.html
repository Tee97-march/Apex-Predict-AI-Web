<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Match Analysis</title>

<link rel="stylesheet" href="styles.css">

<style>

.analysis-header{
    text-align:center;
    margin-bottom:25px;
}

.analysis-header h1{
    font-size:32px;
    margin-bottom:10px;
}

.analysis-header p{
    color:#cfd8e3;
    line-height:1.5;
}

.analysis-status{
    text-align:center;
    margin:15px 0 20px;
    padding:13px;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    font-weight:bold;
}

.analysis-card{
    background:#ffffff;
    color:#111;
    border-radius:20px;
    padding:22px;
    margin-bottom:25px;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.match-title{
    font-size:25px;
    font-weight:bold;
    color:#061326;
    margin-bottom:18px;
}

.match-teams{
    background:#f4f6fa;
    padding:18px;
    border-radius:15px;
    margin-bottom:18px;
}

.match-teams h2{
    margin:0 0 10px;
    color:#061326;
}

.data-row{
    background:#f7f7f7;
    border-radius:12px;
    padding:15px;
    margin:10px 0;
}

.data-label{
    font-weight:bold;
    color:#555;
    display:block;
    margin-bottom:5px;
}

.data-value{
    color:#111;
    font-size:17px;
}

.prediction-box{
    background:#e8f7ec;
    border-left:7px solid #00c853;
    padding:18px;
    border-radius:12px;
    margin-top:20px;
}

.prediction-box h3{
    margin:0 0 8px;
    color:#061326;
}

.prediction-value{
    font-size:22px;
    font-weight:bold;
    color:#00a844;
}

.analysis-section{
    margin-top:22px;
}

.analysis-section h3{
    color:#061326;
    margin-bottom:12px;
}

.navigation{
    margin-top:25px;
}

.navigation button{
    margin-top:10px;
}

.error-box{
    background:#fff3f3;
    color:#b00020;
    border:1px solid #ffcdd2;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

@media(max-width:600px){

    .analysis-header h1{
        font-size:27px;
    }

    .analysis-card{
        padding:16px;
    }

    .match-title{
        font-size:22px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="analysis-header">

        <h1>🤖 AI Match Analysis</h1>

        <p>
            Analysis generated from APEX Predict AI Match Database
        </p>

    </div>


    <div
        id="analysisStatus"
        class="analysis-status"
    >
        🔄 Connecting to Google Sheets...
    </div>


    <div id="analysisContainer">

        <div class="analysis-card">

            <h2>
                🔄 Loading Match Analysis...
            </h2>

            <p>
                Please wait while APEX Predict AI loads the match data.
            </p>

        </div>

    </div>


    <div class="navigation">

        <button onclick="window.location.href='dashboard.html'">
            🏠 Dashboard
        </button>

        <button onclick="window.location.href='predictions.html'">
            🤖 Predictions
        </button>

        <button onclick="window.location.href='statistics.html'">
            📈 Statistics
        </button>

        <button onclick="window.location.href='livescores.html'">
            ⚽ Live Scores
        </button>

        <button onclick="window.location.href='leagues.html'">
            🏆 Leagues
        </button>

        <button onclick="window.location.href='headtohead.html'">
            ⚔ Head To Head
        </button>

        <button onclick="window.location.href='settings.html'">
            ⚙ Settings
        </button>

    </div>

</div>


<script>

"use strict";


const GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


async function loadAnalysis(){

    const status =
        document.getElementById("analysisStatus");

    const container =
        document.getElementById("analysisContainer");


    try{

        status.textContent =
            "🔄 Connecting to Google Sheets...";


        const response =
            await fetch(
                GOOGLE_SHEETS_API,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "APEX Analysis Google Sheets Data:",
            data
        );


        if(data.status === "CONNECTED"){

            status.textContent =
                "✅ Google Sheets Connected";

            status.style.color =
                "#b9f6ca";

        }


        const database =
            data.matchDatabase;


        if(
            !database ||
            !database.exists ||
            !Array.isArray(database.objects) ||
            database.objects.length === 0
        ){

            container.innerHTML = `

                <div class="error-box">

                    <h2>⚠️ No Match Data Found</h2>

                    <p>
                        Google Sheets is connected,
                        but there are currently no matches
                        available in the Match Database.
                    </p>

                </div>

            `;

            return;

        }


        const matches =
            database.objects;


        container.innerHTML = `

            <div class="analysis-card">

                <div class="match-title">
                    🤖 APEX AI MATCH ANALYSIS
                </div>

                <p>
                    ${matches.length}
                    match(es) loaded from Google Sheets.
                </p>

            </div>

        `;


        matches.forEach(
            function(match,index){

                const home =
                    match["Home Team"] || "Unknown Home Team";

                const away =
                    match["Away Team"] || "Unknown Away Team";

                const league =
                    match["League"] || "Unknown League";

                const date =
                    match["Date"] || "Not available";

                const prediction =
                    match["Prediction"] || "Not available";

                const confidence =
                    match["Confidence %"] || "Not available";

                const risk =
                    match["Risk Level"] || "Not available";

                const market =
                    match["recommended market"] ||
                    match["Recommended Market"] ||
                    "Not available";

                const expectedGoals =
                    match["Expected Goals"] ||
                    "Not available";

                const homeForm =
                    match["Home Form"] ||
                    "Not available";

                const awayForm =
                    match["Away Form"] ||
                    "Not available";

                const homeAdvantage =
                    match["Home Advantage Score"] ||
                    "Not available";

                const headToHead =
                    match["Head to Head"] ||
                    "Not available";

                const headToHeadScore =
                    match["Head to Head Score"] ||
                    "Not available";

                const bookmakerOdds =
                    match["Bookmaker Odds"] ||
                    "Not available";

                const oddsValue =
                    match["Odds Value Score"] ||
                    "Not available";


                const card =
                    document.createElement("div");

                card.className =
                    "analysis-card";


                card.innerHTML = `

                    <div class="match-title">
                        ⚽ Match ${index + 1}
                    </div>


                    <div class="match-teams">

                        <h2>
                            ${home}
                            <span style="color:#777;">
                                vs
                            </span>
                            ${away}
                        </h2>

                        <p>
                            <strong>League:</strong>
                            ${league}
                        </p>

                        <p>
                            <strong>Date:</strong>
                            ${date}
                        </p>

                    </div>


                    <div class="prediction-box">

                        <h3>
                            🤖 AI Prediction
                        </h3>

                        <div class="prediction-value">
                            ${prediction}
                        </div>

                    </div>


                    <div class="analysis-section">

                        <h3>
                            📊 Match Analysis
                        </h3>


                        <div class="data-row">

                            <span class="data-label">
                                Confidence
                            </span>

                            <span class="data-value">
                                ${confidence}%
                            </span>

                        </div>


                        <div class="data-row">

                            <span class="data-label">
                                Risk Level
                            </span>

                            <span class="data-value">
                                ${risk}
                            </span>

                        </div>


                        <div class="data-row">

                            <span class="data-label">
                                Recommended Market
                            </span>

                            <span class="data-value">
                                ${market}
                            </span>

                        </div>


                        <div class="data-row">

                            <span class="data-label">
                                Expected Goals
                            </span>

                            <span class="data-value">
                                ${expectedGoals}
                            </span>

                        </div>


                        <div class="data-row">

                            <span class="data-label">
                                Home Form
                            </span>

                            <span class="data-value">
                                ${homeForm}
                            </span>

                        </div>


                        <div class="data-row">

                            <span class="data-label">
                                Away Form
                            </span>

                            <span class="data-value">
                                ${awayForm}
                            </span>

                        </div>


                        <div class="data-row">

                            <span class="data-label">
                                Home Advantage Score
                            </span>

                            <span class="data-value">
                                ${homeAdvantage}
                            </span>

                        </div>


                        <div class="data-row">

                            <span class="data-label">
                                Head to Head
                            </span>

                            <span class="data-value">
                                ${headToHead}
                            </span>

                        </div>


                        <div class="data-row">

                            <span class="data-label">
                                Head to Head Score
                            </span>

                            <span class="data-value">
                                ${headToHeadScore}
                            </span>

                        </div>


                        <div class="data-row">

                            <span class="data-label">
                                Bookmaker Odds
                            </span>

                            <span class="data-value">
                                ${bookmakerOdds}
                            </span>

                        </div>


                        <div class="data-row">

                            <span class="data-label">
                                Odds Value Score
                            </span>

                            <span class="data-value">
                                ${oddsValue}
                            </span>

                        </div>

                    </div>

                `;


                container.appendChild(card);

            }
        );


        status.textContent =
            "✅ Match Analysis Loaded";


    }catch(error){

        console.error(
            "APEX Match Analysis Error:",
            error
        );


        status.textContent =
            "❌ Analysis Connection Failed";


        status.style.color =
            "#ff8a80";


        container.innerHTML = `

            <div class="error-box">

                <h2>
                    ❌ Unable to Load Analysis
                </h2>

                <p>
                    The Google Sheets connection
                    could not be completed.
                </p>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>

        `;

    }

}


document.addEventListener(
    "DOMContentLoaded",
    loadAnalysis
);

</script>

</body>
    </html>
