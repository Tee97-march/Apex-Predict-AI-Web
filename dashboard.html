<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI Dashboard</title>

<link rel="stylesheet" href="styles.css">
<script src="script.js"></script>

</head>

<body>

<div class="container">

    <h1>⚽ APEX Predict AI</h1>

    <p>Professional Football Prediction Platform</p>

    <div id="connectionStatus">
        Connecting to APEX Predict AI...
    </div>

    <div class="dashboard-grid">

        <button onclick="openPredictions()">
            🤖 Predictions
        </button>

        <button onclick="openAnalysis()">
            📊 Analysis
        </button>

        <button onclick="openStatistics()">
            📈 Statistics
        </button>

        <button onclick="openLiveScores()">
            ⚽ Live Scores
        </button>

        <button onclick="openLeagues()">
            🏆 Leagues
        </button>

        <button onclick="openHeadToHead()">
            ⚔ Head to Head
        </button>

        <button onclick="openSettings()">
            ⚙ Settings
        </button>

        <button onclick="logout()">
            🚪 Logout
        </button>

    </div>

</div>

</body>
</html>
