<script>

"use strict";

const APEX_DASHBOARD_CONFIG = Object.freeze({

    API_URL:
        "https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec",

    TIMEOUT:
        45000,

    RETRIES:
        2,

    MAX_MATCHES:
        30

});


function go(page) {

    const allowedPages = [
        "dashboard.html",
        "predictions.html",
        "analysis.html",
        "statistics.html",
        "livescores.html",
        "leagues.html",
        "headtohead.html",
        "settings.html"
    ];

    const target =
        allowedPages.includes(page)
            ? page
            : "dashboard.html";

    window.location.href =
        "./" + target;
}


function logout() {

    if (
        confirm(
            "Logout from APEX Predict AI?"
        )
    ) {
        window.location.href =
            "./index.html";
    }
}


function normaliseKey(value) {

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/s+/g, " ");
}


function safe(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getValue(
    object,
    names
) {

    if (
        !object ||
        typeof object !== "object"
    ) {
        return "";
    }

    const keys =
        Object.keys(object);

    for (
        const name of names
    ) {

        const wanted =
            normaliseKey(name);

        const key =
            keys.find(
                function(existingKey) {

                    return (
                        normaliseKey(existingKey) ===
                        wanted
                    );
                }
            );

        if (
            key !== undefined &&
            object[key] !== null &&
            object[key] !== undefined &&
            String(object[key]).trim() !== ""
        ) {
            return object[key];
        }
    }

    return "";
}


function numberValue(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }

    const parsed =
        parseFloat(
            String(value)
                .replace("%", "")
                .replace(",", ".")
                .trim()
        );

    return Number.isFinite(parsed)
        ? parsed
        : null;
}


function percentage(value) {

    const number =
        numberValue(value);

    return number === null
        ? "—"
        : number + "%";
}


function getHomeTeam(match) {

    return getValue(
        match,
        [
            "Home Team",
            "Home",
            "HomeTeam",
            "Team Home"
        ]
    );
}


function getAwayTeam(match) {

    return getValue(
        match,
        [
            "Away Team",
            "Away",
            "AwayTeam",
            "Team Away"
        ]
    );
}


function getLeague(match) {

    return getValue(
        match,
        [
            "League",
            "Competition",
            "League Name"
        ]
    );
}


function getPrediction(match) {

    return getValue(
        match,
        [
            "Prediction",
            "AI Prediction",
            "Prediction Advice",
            "Advice"
        ]
    );
}


function getConfidence(match) {

    return numberValue(
        getValue(
            match,
            [
                "Final Confidence",
                "Final Confidence %",
                "Confidence %",
                "Confidence",
                "AI Confidence"
            ]
        )
    );
}


function getRisk(match) {

    const risk =
        getValue(
            match,
            [
                "Risk Level",
                "Risk",
                "Risk Category",
                "Risk Rating",
                "AI Risk",
                "Confidence Risk"
            ]
        );

    if (
        risk !== ""
    ) {
        return String(risk);
    }

    const confidence =
        getConfidence(match);

    if (
        confidence === null
    ) {
        return "";
    }

    if (
        confidence >= 60
    ) {
        return "Low";
    }

    if (
        confidence >= 45
    ) {
        return "Medium";
    }

    return "High";
}


function getMarket(match) {

    const market =
        getValue(
            match,
            [
                "Recommended Market",
                "recommended market",
                "Recommended market",
                "Market",
                "Betting Market",
                "Selection Market",
                "Prediction Market"
            ]
        );

    if (
        market !== ""
    ) {
        return String(market);
    }

    const prediction =
        String(
            getPrediction(match)
        ).toLowerCase();

    if (
        prediction.includes(
            "double chance"
        )
    ) {
        return "Double Chance";
    }

    if (
        prediction.includes(
            "+1.5"
        ) ||
        prediction.includes(
            "over 1.5"
        )
    ) {
        return "Over 1.5 Goals";
    }

    if (
        prediction.includes(
            "+2.5"
        ) ||
        prediction.includes(
            "over 2.5"
        )
    ) {
        return "Over 2.5 Goals";
    }

    if (
        prediction.includes(
            "-2.5"
        ) ||
        prediction.includes(
            "under 2.5"
        )
    ) {
        return "Under 2.5 Goals";
    }

    if (
        prediction.includes(
            "-3.5"
        ) ||
        prediction.includes(
            "under 3.5"
        )
    ) {
        return "Under 3.5 Goals";
    }

    if (
        prediction.includes(
            "both teams to score"
        )
    ) {
        return "Both Teams To Score";
    }

    if (
        prediction.includes(
            "draw"
        )
    ) {
        return "Draw";
    }

    return "";
}


function getRiskClass(risk) {

    const value =
        String(
            risk || ""
        ).toLowerCase();

    if (
        value.includes(
            "low"
        )
    ) {
        return "low";
    }

    if (
        value.includes(
            "medium"
        ) ||
        value.includes(
            "moderate"
        )
    ) {
        return "medium";
    }

    if (
        value.includes(
            "high"
        )
    ) {
        return "high";
    }

    return "unknown";
}


function extractMatches(data) {

    if (
        data &&
        data.matchDatabase &&
        Array.isArray(
            data.matchDatabase.objects
        )
    ) {
        return data.matchDatabase.objects;
    }

    if (
        data &&
        data.smartGate &&
        Array.isArray(
            data.smartGate.objects
        )
    ) {
        return data.smartGate.objects;
    }

    if (
        data &&
        Array.isArray(
            data.smartGate
        )
    ) {
        return data.smartGate;
    }

    if (
        data &&
        Array.isArray(
            data.matches
        )
    ) {
        return data.matches;
    }

    if (
        data &&
        Array.isArray(
            data.data
        )
    ) {
        return data.data;
    }

    return [];
}


function isUsableMatch(match) {

    const prediction =
        String(
            getPrediction(match)
        ).trim();

    return (
        prediction !== "" &&
        prediction.toLowerCase() !==
        "no predictions available"
    );
}


function selectMatches(matches) {

    const unique =
        [];

    const seen =
        new Set();

    matches.forEach(
        function(match, index) {

            if (
                !isUsableMatch(match)
            ) {
                return;
            }

            const identity =
                [
                    getValue(
                        match,
                        [
                            "Fixture ID",
                            "API Fixture ID",
                            "fixture_id"
                        ]
                    ),
                    getHomeTeam(match),
                    getAwayTeam(match),
                    getLeague(match)
                ]
                .map(
                    normaliseKey
                )
                .join("|");

            const key =
                identity === "|||"
                    ? "row-" + index
                    : identity;

            if (
                !seen.has(key)
            ) {

                seen.add(key);
                unique.push(match);
            }
        }
    );

    return unique
        .sort(
            function(a, b) {

                return (
                    (
                        getConfidence(b) || 0
                    ) -
                    (
                        getConfidence(a) || 0
                    )
                );
            }
        )
        .slice(
            0,
            APEX_DASHBOARD_CONFIG.MAX_MATCHES
        );
}


function setStatus(
    message,
    type
) {

    const element =
        document.getElementById(
            "connectionStatus"
        );

    if (
        !element
    ) {
        return;
    }

    element.textContent =
        message;

    element.dataset.status =
        type;
}


function setText(
    id,
    value
) {

    const element =
        document.getElementById(id);

    if (
        element
    ) {
        element.textContent =
            value;
    }
}


function renderKpis(matches) {

    setText(
        "matchesCount",
        matches.length
    );

    const confidences =
        matches
            .map(
                getConfidence
            )
            .filter(
                function(value) {

                    return value !== null;
                }
            );

    const best =
        confidences.length
            ? Math.max.apply(
                null,
                confidences
            )
            : null;

    setText(
        "bestConfidence",
        best === null
            ? "—"
            : best + "%"
    );

    setText(
        "bestConfidenceNote",
        best === null
            ? "No confidence data"
            : "Highest final confidence"
    );

    setText(
        "predictionCount",
        matches.filter(
            isUsableMatch
        ).length
    );

    setText(
        "lowRiskCount",
        matches.filter(
            function(match) {

                return (
                    getRiskClass(
                        getRisk(match)
                    ) === "low"
                );
            }
        ).length
    );
}


function renderFeatured(match) {

    const container =
        document.getElementById(
            "featuredMatch"
        );

    if (
        !container
    ) {
        return;
    }

    if (
        !match
    ) {

        container.innerHTML = `
            <div class="empty-state">
                No featured prediction is available.
            </div>
        `;

        return;
    }

    const home =
        getHomeTeam(match);

    const away =
        getAwayTeam(match);

    const league =
        getLeague(match);

    const prediction =
        getPrediction(match);

    const confidence =
        getConfidence(match);

    const risk =
        getRisk(match);

    const market =
        getMarket(match);

    container.innerHTML = `

        <div class="featured-league">
            ${safe(league || "Football")}
        </div>

        <div class="featured-teams">

            <div class="team-name">
                ${safe(home || "Home Team")}
            </div>

            <div class="vs">
                VS
            </div>

            <div class="team-name">
                ${safe(away || "Away Team")}
            </div>

        </div>

        <div class="featured-meta">
            ${safe(prediction || "Prediction available")}
        </div>

        <div class="featured-metrics">

            <div class="featured-metric">
                <div class="featured-metric-title">
                    Confidence
                </div>
                <div class="featured-metric-value">
                    ${safe(percentage(confidence))}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">
                    Risk
                </div>
                <div class="featured-metric-value">
                    ${safe(risk || "—")}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">
                    Market
                </div>
                <div class="featured-metric-value">
                    ${safe(market || "—")}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">
                    League
                </div>
                <div class="featured-metric-value">
                    ${safe(league || "—")}
                </div>
            </div>

        </div>
    `;
}


function renderAnalysis(matches) {

    const container =
        document.getElementById(
            "analysisSummary"
        );

    if (
        !container
    ) {
        return;
    }

    if (
        matches.length === 0
    ) {

        container.innerHTML = `
            <div class="empty-state">
                No completed predictions available.
            </div>
        `;

        return;
    }

    const confidenceValues =
        matches
            .map(
                getConfidence
            )
            .filter(
                function(value) {

                    return value !== null;
                }
            );

    const average =
        confidenceValues.length
            ? Math.round(
                confidenceValues.reduce(
                    function(total, value) {

                        return total + value;
                    },
                    0
                ) /
                confidenceValues.length
            )
            : null;

    const marketCounts =
        {};

    const riskCounts =
        {};

    matches.forEach(
        function(match) {

            const market =
                getMarket(match) ||
                "Unknown";

            const risk =
                getRisk(match) ||
                "Unknown";

            marketCounts[market] =
                (
                    marketCounts[market] ||
                    0
                ) + 1;

            riskCounts[risk] =
                (
                    riskCounts[risk] ||
                    0
                ) + 1;
        }
    );

    const mostCommon =
        function(values) {

            const result =
                Object.entries(values)
                    .sort(
                        function(a, b) {

                            return b[1] - a[1];
                        }
                    )[0];

            return result
                ? result[0]
                : "—";
        };

    container.innerHTML = `

        <table class="analysis-table">

            <tbody>

                <tr>
                    <th>Selected matches</th>
                    <td class="score-value">
                        ${matches.length}
                    </td>
                </tr>

                <tr>
                    <th>Average confidence</th>
                    <td class="score-value">
                        ${safe(percentage(average))}
                    </td>
                </tr>

                <tr>
                    <th>Most common market</th>
                    <td>
                        ${safe(
                            mostCommon(
                                marketCounts
                            )
                        )}
                    </td>
                </tr>

                <tr>
                    <th>Most common risk</th>
                    <td>
                        ${safe(
                            mostCommon(
                                riskCounts
                            )
                        )}
                    </td>
                </tr>

            </tbody>

        </table>
    `;
}


function renderConfidence(match) {

    const summary =
        document.getElementById(
            "confidenceSummary"
        );

    const factors =
        document.getElementById(
            "factorSummary"
        );

    if (
        !summary ||
        !factors
    ) {
        return;
    }

    if (
        !match
    ) {

        summary.innerHTML = `
            <div class="confidence-number">
                —
            </div>
            <div class="confidence-label">
                Final Confidence
            </div>
        `;

        factors.innerHTML =
            "";

        return;
    }

    const confidence =
        getConfidence(match);

    const market =
        getMarket(match);

    const risk =
        getRisk(match);

    const prediction =
        getPrediction(match);

    const progress =
        confidence === null
            ? 0
            : Math.max(
                0,
                Math.min(
                    100,
                    confidence
                )
            );

    summary.innerHTML = `

        <div class="confidence-number">
            ${safe(percentage(confidence))}
        </div>

        <div class="confidence-label">
            Final Confidence
        </div>

        <div class="progress">
            <div
                class="progress-bar"
                style="width:${progress}%"
            ></div>
        </div>
    `;

    factors.innerHTML = `

        <div class="factor-row">
            <span class="factor-name">
                Prediction
            </span>
            <span class="factor-score">
                ${safe(prediction || "—")}
            </span>
        </div>

        <div class="factor-row">
            <span class="factor-name">
                Market
            </span>
            <span class="factor-score">
                ${safe(market || "—")}
            </span>
        </div>

        <div class="factor-row">
            <span class="factor-name">
                Risk
            </span>
            <span class="factor-score">
                ${safe(risk || "—")}
            </span>
        </div>
    `;
}


function renderMatches(matches) {

    const container =
        document.getElementById(
            "matchList"
        );

    if (
        !container
    ) {
        return;
    }

    if (
        matches.length === 0
    ) {

        container.innerHTML = `
            <div class="empty-state">
                No selected matches are available.
            </div>
        `;

        return;
    }

    container.innerHTML =
        matches
            .map(
                function(match, index) {

                    const home =
                        getHomeTeam(match);

                    const away =
                        getAwayTeam(match);

                    const league =
                        getLeague(match);

                    const prediction =
                        getPrediction(match);

                    const confidence =
                        getConfidence(match);

                    const risk =
                        getRisk(match);

                    const market =
                        getMarket(match);

                    const riskClass =
                        getRiskClass(risk);

                    return `

                        <article class="match-row">

                            <div class="match-main">

                                <div class="match-teams-small">
                                    ${index + 1}.
                                    ${safe(home || "Home")}
                                    vs
                                    ${safe(away || "Away")}
                                </div>

                                <div class="match-league">
                                    ${safe(league || "Football")}
                                </div>

                            </div>

                            <div class="match-prediction">
                                ${safe(
                                    prediction ||
                                    "No prediction available"
                                )}
                            </div>

                            <div class="match-market">
                                <strong>Market:</strong>
                                ${safe(market || "—")}
                                <br>
                                <span class="match-risk">
                                    <strong>Risk:</strong>
                                    ${safe(risk || "—")}
                                </span>
                            </div>

                            <div>

                                <div class="match-confidence">
                                    ${safe(
                                        percentage(
                                            confidence
                                        )
                                    )}
                                </div>

                                <span
                                    class="badge ${riskClass}"
                                >
                                    ${safe(
                                        risk ||
                                        "Unknown risk"
                                    )}
                                </span>

                            </div>

                        </article>
                    `;
                }
            )
            .join("");
}


function updateTodayLabel() {

    const element =
        document.getElementById(
            "todayLabel"
        );

    if (
        !element
    ) {
        return;
    }

    element.textContent =
        new Date().toLocaleDateString(
            undefined,
            {
                weekday: "long",
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );
}


async function requestWithTimeout() {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            function() {

                controller.abort();

            },
            APEX_DASHBOARD_CONFIG.TIMEOUT
        );

    try {

        const response =
            await fetch(
                APEX_DASHBOARD_CONFIG.API_URL +
                "?request=dashboard&ts=" +
                Date.now(),
                {
                    method: "GET",
                    cache: "no-store",
                    credentials: "omit",
                    redirect: "follow",
                    signal: controller.signal
                }
            );

        if (
            !response.ok
        ) {

            throw new Error(
                "Backend returned HTTP " +
                response.status
            );
        }

        const body =
            await response.text();

        if (
            !body ||
            body.trim() === ""
        ) {

            throw new Error(
                "Backend returned an empty response."
            );
        }

        try {

            return JSON.parse(body);

        } catch (
            error
        ) {

            throw new Error(
                "Backend returned non-JSON data."
            );
        }

    } catch (
        error
    ) {

        if (
            error.name ===
            "AbortError"
        ) {

            throw new Error(
                "The Apps Script request exceeded 45 seconds."
            );
        }

        throw error;

    } finally {

        clearTimeout(timer);
    }
}


async function fetchDashboardData() {

    let lastError;

    for (
        let attempt = 0;
        attempt <=
        APEX_DASHBOARD_CONFIG.RETRIES;
        attempt++
    ) {

        try {

            setStatus(
                attempt === 0
                    ? "🔄 Connecting to APEX AI..."
                    : "🔄 Retrying APEX backend connection (" +
                      attempt +
                      "/" +
                      APEX_DASHBOARD_CONFIG.RETRIES +
                      ")...",
                "loading"
            );

            return await requestWithTimeout();

        } catch (
            error
        ) {

            lastError =
                error;

            if (
                attempt <
                APEX_DASHBOARD_CONFIG.RETRIES
            ) {

                await new Promise(
                    function(resolve) {

                        setTimeout(
                            resolve,
                            1200
                        );
                    }
                );
            }
        }
    }

    throw lastError;
}


async function loadDashboard() {

    try {

        updateTodayLabel();

        const data =
            await fetchDashboardData();

        const allMatches =
            extractMatches(data);

        const selectedMatches =
            selectMatches(allMatches);

        renderKpis(
            selectedMatches
        );

        renderFeatured(
            selectedMatches[0]
        );

        renderAnalysis(
            selectedMatches
        );

        renderConfidence(
            selectedMatches[0]
        );

        renderMatches(
            selectedMatches
        );

        setStatus(
            "✅ APEX backend connected · " +
            selectedMatches.length +
            " selected matches loaded",
            "success"
        );

    } catch (
        error
    ) {

        console.error(
            "APEX dashboard loading error:",
            error
        );

        setStatus(
            "❌ " + error.message,
            "error"
        );

        document.getElementById(
            "featuredMatch"
        ).innerHTML = `
            <div class="error">
                Unable to load APEX data.
                <br>
                <small>
                    ${safe(error.message)}
                </small>
            </div>
        `;

        document.getElementById(
            "analysisSummary"
        ).innerHTML = `
            <div class="error">
                Backend data unavailable.
            </div>
        `;

        document.getElementById(
            "confidenceSummary"
        ).innerHTML = `
            <div class="error">
                Confidence data unavailable.
            </div>
        `;

        document.getElementById(
            "factorSummary"
        ).innerHTML =
            "";

        document.getElementById(
            "matchList"
        ).innerHTML = `
            <div class="error">
                Match data unavailable.
            </div>
        `;
    }
}


window.go =
    go;

window.logout =
    logout;

window.loadDashboard =
    loadDashboard;

window.addEventListener(
    "DOMContentLoaded",
    loadDashboard
);

</script>
