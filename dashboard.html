<script>
"use strict";

const APEX_DASHBOARD_CONFIG = {
    API_URL: "https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec",
    MAX_MATCHES: 30,
    TIMEOUT: 45000
};

function go(page) {
    const pages = [
        "dashboard.html",
        "predictions.html",
        "analysis.html",
        "statistics.html",
        "livescores.html",
        "leagues.html",
        "headtohead.html",
        "settings.html"
    ];

    location.href =
        "./" +
        (pages.includes(page)
            ? page
            : "dashboard.html");
}

function logout() {
    if (confirm("Logout from APEX Predict AI?")) {
        location.href = "./index.html";
    }
}

function normaliseKey(value) {
    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/s+/g, " ");
}

function safe(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getValue(object, names) {
    if (!object || typeof object !== "object") {
        return "";
    }

    const keys = Object.keys(object);

    for (const name of names) {
        const found = keys.find(
            key =>
                normaliseKey(key) ===
                normaliseKey(name)
        );

        if (
            found !== undefined &&
            object[found] !== null &&
            object[found] !== undefined &&
            String(object[found]).trim() !== ""
        ) {
            return object[found];
        }
    }

    return "";
}

function numberValue(value) {
    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }

    const number = parseFloat(
        String(value)
            .replace("%", "")
            .replace(",", ".")
            .trim()
    );

    return Number.isFinite(number)
        ? number
        : null;
}

function getHomeTeam(match) {
    return getValue(match, [
        "Home Team",
        "Home",
        "HomeTeam"
    ]);
}

function getAwayTeam(match) {
    return getValue(match, [
        "Away Team",
        "Away",
        "AwayTeam"
    ]);
}

function getLeague(match) {
    return getValue(match, [
        "League",
        "Competition",
        "League Name"
    ]);
}

function getPrediction(match) {
    return getValue(match, [
        "Prediction",
        "AI Prediction",
        "Prediction Advice",
        "Advice"
    ]);
}

function getConfidence(match) {
    return numberValue(
        getValue(match, [
            "Final confidence",
            "Final Confidence",
            "Final confidence %",
            "Final Confidence %",
            "Confidence %",
            "Confidence",
            "AI Confidence"
        ])
    );
}

function getRisk(match) {
    const direct = getValue(match, [
        "Risk Level",
        "Risk",
        "Risk Category",
        "Risk Rating"
    ]);

    if (direct !== "") {
        return String(direct);
    }

    const score = getConfidence(match);

    if (score === null) {
        return "UNKNOWN";
    }

    if (score >= 60) {
        return "LOW";
    }

    if (score >= 45) {
        return "MEDIUM";
    }

    return "HIGH";
}

function getMarket(match) {
    const direct = getValue(match, [
        "recommended market",
        "Recommended market",
        "Recommended Market",
        "Market",
        "Betting Market"
    ]);

    if (direct !== "") {
        return String(direct);
    }

    const prediction =
        String(getPrediction(match))
            .toLowerCase();

    if (prediction.includes("double chance")) {
        return "Double Chance";
    }

    if (
        prediction.includes("over 1.5") ||
        prediction.includes("+1.5")
    ) {
        return "Over 1.5 Goals";
    }

    if (
        prediction.includes("over 2.5") ||
        prediction.includes("+2.5")
    ) {
        return "Over 2.5 Goals";
    }

    if (
        prediction.includes("under 2.5") ||
        prediction.includes("-2.5")
    ) {
        return "Under 2.5 Goals";
    }

    if (prediction.includes("both teams to score")) {
        return "Both Teams To Score";
    }

    if (prediction.includes("draw")) {
        return "Draw";
    }

    return "—";
}

function getRiskClass(risk) {
    const value =
        String(risk || "")
            .toLowerCase();

    if (value.includes("low")) {
        return "low";
    }

    if (
        value.includes("medium") ||
        value.includes("moderate")
    ) {
        return "medium";
    }

    if (value.includes("high")) {
        return "high";
    }

    return "unknown";
}

function extractMatches(data) {
    if (
        data &&
        Array.isArray(data.matches)
    ) {
        return data.matches;
    }

    if (
        data &&
        data.matchDatabase &&
        Array.isArray(data.matchDatabase.objects)
    ) {
        return data.matchDatabase.objects;
    }

    if (
        data &&
        data.smartGate &&
        Array.isArray(data.smartGate.objects)
    ) {
        return data.smartGate.objects;
    }

    if (
        data &&
        Array.isArray(data.smartGate)
    ) {
        return data.smartGate;
    }

    if (
        data &&
        Array.isArray(data.data)
    ) {
        return data.data;
    }

    return [];
}

function renderKpis(matches) {
    const scores = matches
        .map(getConfidence)
        .filter(value => value !== null);

    const best =
        scores.length
            ? Math.max(...scores)
            : null;

    const lowRisk =
        matches.filter(
            match =>
                getRiskClass(getRisk(match)) === "low"
        ).length;

    const matchesCount =
        document.getElementById("matchesCount");

    const bestConfidence =
        document.getElementById("bestConfidence");

    const bestNote =
        document.getElementById("bestConfidenceNote");

    const predictionCount =
        document.getElementById("predictionCount");

    const lowRiskCount =
        document.getElementById("lowRiskCount");

    if (matchesCount) {
        matchesCount.textContent =
            matches.length;
    }

    if (bestConfidence) {
        bestConfidence.textContent =
            best === null ? "—" : best + "%";
    }

    if (bestNote) {
        bestNote.textContent =
            best === null
                ? "Waiting for AI data"
                : "Highest final confidence";
    }

    if (predictionCount) {
        predictionCount.textContent =
            matches.length;
    }

    if (lowRiskCount) {
        lowRiskCount.textContent =
            lowRisk;
    }
}

function renderFeatured(match) {
    const container =
        document.getElementById("featuredMatch");

    if (!container) {
        return;
    }

    if (!match) {
        container.innerHTML =
            '<div class="state">No featured prediction available.</div>';
        return;
    }

    const score =
        getConfidence(match);

    container.innerHTML = `
        <div class="featured-league">
            ${safe(getLeague(match) || "Football")}
        </div>

        <div class="featured-teams">
            <div class="team">
                ${safe(getHomeTeam(match) || "Home Team")}
            </div>

            <div class="vs">VS</div>

            <div class="team">
                ${safe(getAwayTeam(match) || "Away Team")}
            </div>
        </div>

        <div class="featured-prediction">
            <span class="featured-prediction-label">
                TOP AI PREDICTION
            </span>

            <span class="featured-prediction-value">
                ${safe(getPrediction(match) || "—")}
            </span>
        </div>

        <div class="featured-metrics">
            <div class="featured-metric">
                <div class="featured-metric-title">
                    CONFIDENCE
                </div>

                <div class="featured-metric-value green">
                    ${score === null ? "—" : score + "%"}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">
                    RISK
                </div>

                <div class="featured-metric-value">
                    ${safe(getRisk(match))}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">
                    MARKET
                </div>

                <div class="featured-metric-value">
                    ${safe(getMarket(match))}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">
                    LEAGUE
                </div>

                <div class="featured-metric-value">
                    ${safe(getLeague(match) || "Football")}
                </div>
            </div>
        </div>
    `;
}

function renderAnalysis(matches) {
    const container =
        document.getElementById("analysisSummary");

    if (!container) {
        return;
    }

    if (!matches.length) {
        container.innerHTML =
            '<div class="state">No prediction data available.</div>';
        return;
    }

    const scores = matches
        .map(getConfidence)
        .filter(value => value !== null);

    const average =
        scores.length
            ? Math.round(
                scores.reduce(
                    (a, b) => a + b,
                    0
                ) / scores.length
            )
            : null;

    const markets = {};
    const risks = {};

    matches.forEach(match => {
        const m = getMarket(match);
        const r = getRisk(match);

        markets[m] =
            (markets[m] || 0) + 1;

        risks[r] =
            (risks[r] || 0) + 1;
    });

    function common(object) {
        const values =
            Object.entries(object)
                .sort(
                    (a, b) => b[1] - a[1]
                );

        return values.length
            ? values[0][0]
            : "—";
    }

    container.innerHTML = `
        <div class="summary-grid">
            <div class="summary-box">
                <span>Selected matches</span>
                <strong>${matches.length}</strong>
            </div>

            <div class="summary-box">
                <span>Average confidence</span>
                <strong>
                    ${average === null ? "—" : average + "%"}
                </strong>
            </div>

            <div class="summary-box">
                <span>Most common market</span>
                <strong>${safe(common(markets))}</strong>
            </div>

            <div class="summary-box">
                <span>Most common risk</span>
                <strong>${safe(common(risks))}</strong>
            </div>
        </div>
    `;
}

function renderConfidence(match) {
    const summary =
        document.getElementById("confidenceSummary");

    const factors =
        document.getElementById("factorSummary");

    if (!summary || !factors) {
        return;
    }

    if (!match) {
        summary.innerHTML = `
            <div class="confidence-center">
                <div class="confidence-number">—</div>
                <div class="confidence-label">
                    Final Confidence
                </div>
            </div>
        `;

        factors.innerHTML = "";
        return;
    }

    const score =
        getConfidence(match);

    const width =
        score === null
            ? 0
            : Math.max(
                0,
                Math.min(100, score)
            );

    summary.innerHTML = `
        <div class="confidence-center">
            <div class="confidence-number">
                ${score === null ? "—" : score + "%"}
            </div>

            <div class="confidence-label">
                Final Confidence
            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    style="width:${width}%"
                ></div>
            </div>
        </div>
    `;

    factors.innerHTML = `
        <div class="factor-row">
            <span class="factor-name">Prediction</span>
            <span class="factor-value">
                ${safe(getPrediction(match) || "—")}
            </span>
        </div>

        <div class="factor-row">
            <span class="factor-name">Market</span>
            <span class="factor-value">
                ${safe(getMarket(match))}
            </span>
        </div>

        <div class="factor-row">
            <span class="factor-name">Risk</span>
            <span class="factor-value">
                ${safe(getRisk(match))}
            </span>
        </div>
    `;
}

function renderMatches(matches) {
    const container =
        document.getElementById("matchList");

    if (!container) {
        return;
    }

    if (!matches.length) {
        container.innerHTML =
            '<div class="state">No selected matches available.</div>';
        return;
    }

    container.innerHTML =
        matches
            .map(
                (match, index) => `
                    <div class="match-row">
                        <div class="match-number">
                            ${index + 1}
                        </div>

                        <div>
                            <div class="match-teams-small">
                                ${safe(getHomeTeam(match) || "Home")}
                                <span>VS</span>
                                ${safe(getAwayTeam(match) || "Away")}
                            </div>

                            <div class="match-league">
                                ${safe(getLeague(match) || "Football")}
                            </div>
                        </div>

                        <div class="match-prediction">
                            ${safe(getPrediction(match) || "—")}

                            <span class="market-small">
                                ${safe(getMarket(match))}
                            </span>
                        </div>

                        <div class="match-confidence">
                            ${
                                getConfidence(match) === null
                                    ? "—"
                                    : getConfidence(match) + "%"
                            }
                        </div>

                        <div class="match-info">
                            ${safe(getMarket(match))}
                        </div>

                        <div>
                            <span class="decision ${getRiskClass(getRisk(match))}">
                                ${safe(getRisk(match))}
                            </span>
                        </div>
                    </div>
                `
            )
            .join("");
}

async function requestApi() {
    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            APEX_DASHBOARD_CONFIG.TIMEOUT
        );

    try {
        const response =
            await fetch(
                APEX_DASHBOARD_CONFIG.API_URL +
                "?request=dashboard&ts=" +
                Date.now(),
                {
                    method: "GET",
                    cache: "no-store",
                    redirect: "follow",
                    signal: controller.signal
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        if (
            String(data.status || "")
                .toUpperCase() === "ERROR"
        ) {
            throw new Error(
                data.message ||
                "APEX backend error"
            );
        }

        return data;

    } finally {
        clearTimeout(timer);
    }
}

async function loadDashboard() {
    try {
        setStatus(
            "🔄 Connecting to APEX AI...",
            "loading"
        );

        const data =
            await requestApi();

        const matches =
            selectMatches(
                extractMatches(data)
            );

        renderKpis(matches);
        renderFeatured(matches[0]);
        renderAnalysis(matches);
        renderConfidence(matches[0]);
        renderMatches(matches);

        setStatus(
            "✅ APEX connected · " +
            matches.length +
            " matches loaded",
            "success"
        );

    } catch (error) {
        console.error(error);

        setStatus(
            "❌ APEX connection failed: " +
            error.message,
            "error"
        );

        [
            "featuredMatch",
            "analysisSummary",
            "confidenceSummary",
            "matchList"
        ].forEach(id => {
            const element =
                document.getElementById(id);

            if (element) {
                element.innerHTML =
                    '<div class="state error">' +
                    safe(error.message) +
                    "</div>";
            }
        });
    }
}

window.go = go;
window.logout = logout;
window.loadDashboard = loadDashboard;
window.renderKpis = renderKpis;
window.renderFeatured = renderFeatured;
window.renderAnalysis = renderAnalysis;
window.renderConfidence = renderConfidence;
window.renderMatches = renderMatches;

if (
    document.readyState ===
    "loading"
) {
    document.addEventListener(
        "DOMContentLoaded",
        loadDashboard
    );
} else {
    loadDashboard();
}
</script>
