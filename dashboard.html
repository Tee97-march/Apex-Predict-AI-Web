<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX Predict AI Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#081b33;
color:white;
font-family:Arial,sans-serif;
}

.dashboard{
padding:20px;
max-width:1200px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.header h1{
font-size:28px;
}

.card{
background:#102847;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.status{
color:#00ff88;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.button{
display:block;
text-align:center;
padding:15px;
margin-top:20px;
background:#00c853;
border-radius:12px;
text-decoration:none;
color:white;
font-weight:bold;
}

</style>

</head>

<body>

<div class="dashboard">

<div class="header">
<h1>⚽ APEX Predict AI</h1>
<span class="status">AI ONLINE</span>
</div>

<div class="grid">

<div class="card">
<h3>Today's Matches</h3>
<p>Loading fixtures...</p>
</div>

<div class="card">
<h3>Prediction Accuracy</h3>
<h2>92%</h2>
</div>

<div class="card">
<h3>AI Confidence</h3>
<h2>94%</h2>
</div>

<div class="card">
<h3>Leagues</h3>
<p>150+ Supported</p>
</div>

</div>

<div class="card">
<h3>System Status</h3>

<p>✔ AI Engine Running</p>
<p>✔ Database Connected</p>
<p>✔ Prediction Module Active</p>

</div>

<a class="button" href="predictions.html">
Open Predictions
</a>

</div>

</body>
</html>
