<script>

"use strict";

const APEX_DASHBOARD_CONFIG = Object.freeze({
    API_URL: "https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec",
    TIMEOUT: 45000,
    RETRIES: 2,
    MAX_MATCHES: 30
});

function go(page) {
    const pages = [
        "dashboard.html",
        "predictions.html",
        "analysis.html",
        "statistics.html",
        "livescores.html",
        "leagues.html",
        "headtohead.html",
        "settings.html"
    ];

    window.location.href = pages.includes(page)
        ? "./" + page
        : "./dashboard.html";
}

function logout() {
    if (confirm("Logout from APEX Predict AI?")) {
        window.location.href = "./index.html";
    }
}

function safe(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function key(value) {
    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/s+/g, " ");
}

function valueOf(object, names) {
    if (!object || typeof object !== "object") {
        return "";
    }

    const keys = Object.keys(object);

    for (const name of names) {
        const found = keys.find(
            existing => key(existing) === key(name)
        );

        if (
            found !== undefined &&
            object[found] !== null &&
            object[found] !== undefined &&
            String(object[found]).trim() !== ""
        ) {
            return object[found];
        }
    }

    return "";
}

function numberOf(value) {
    if (value === null || value === undefined || value === "") {
        return null;
    }

    const result = parseFloat(
        String(value)
            .replace("%", "")
            .replace(",", ".")
            .trim()
    );

    return Number.isFinite(result) ? result : null;
}

function percent(value) {
    const result = numberOf(value);
    return result === null ? "—" : result + "%";
}

function home(match) {
    return valueOf(match, [
        "Home Team",
        "Home",
        "HomeTeam",
        "Team Home"
    ]);
}

function away(match) {
    return valueOf(match, [
        "Away Team",
        "Away",
        "AwayTeam",
        "Team Away"
    ]);
}

function league(match) {
    return valueOf(match, [
        "League",
        "Competition",
        "League Name"
    ]);
}

function prediction(match) {
    return valueOf(match, [
        "Prediction",
        "AI Prediction",
        "Prediction Advice",
        "Advice"
    ]);
}

function confidence(match) {
    return numberOf(
        valueOf(match, [
            "Final Confidence",
            "Final Confidence %",
            "Confidence %",
            "Confidence",
            "AI Confidence"
        ])
    );
}

function risk(match) {
    const direct = valueOf(match, [
        "Risk Level",
        "Risk",
        "Risk Category",
        "Risk Rating",
        "AI Risk",
        "Confidence Risk"
    ]);

    if (direct !== "") {
        return String(direct);
    }

    const score = confidence(match);

    if (score === null) {
        return "";
    }

    if (score >= 60) {
        return "Low";
    }

    if (score >= 45) {
        return "Medium";
    }

    return "High";
}

function market(match) {
    const direct = valueOf(match, [
        "Recommended Market",
        "recommended market",
        "Market",
        "Betting Market",
        "Selection Market",
        "Prediction Market"
    ]);

    if (direct !== "") {
        return String(direct);
    }

    const text = String(prediction(match)).toLowerCase();

    if (text.includes("double chance")) {
        return "Double Chance";
    }

    if (text.includes("over 1.5") || text.includes("+1.5")) {
        return "Over 1.5 Goals";
    }

    if (text.includes("over 2.5") || text.includes("+2.5")) {
        return "Over 2.5 Goals";
    }

    if (text.includes("under 2.5") || text.includes("-2.5")) {
        return "Under 2.5 Goals";
    }

    if (text.includes("under 3.5") || text.includes("-3.5")) {
        return "Under 3.5 Goals";
    }

    if (text.includes("both teams to score")) {
        return "Both Teams To Score";
    }

    if (text.includes("draw")) {
        return "Draw";
    }

    return "";
}

function riskClass(value) {
    const text = String(value || "").toLowerCase();

    if (text.includes("low")) {
        return "low";
    }

    if (text.includes("medium") || text.includes("moderate")) {
        return "medium";
    }

    if (text.includes("high")) {
        return "high";
    }

    return "unknown";
}

function extractMatches(data) {
    if (
        data &&
        data.matchDatabase &&
        Array.isArray(data.matchDatabase.objects)
    ) {
        return data.matchDatabase.objects;
    }

    if (
        data &&
        data.smartGate &&
        Array.isArray(data.smartGate.objects)
    ) {
        return data.smartGate.objects;
    }

    if (data && Array.isArray(data.matches)) {
        return data.matches;
    }

    if (data && Array.isArray(data.data)) {
        return data.data;
    }

    return [];
}

function usable(match) {
    const result = String(prediction(match)).trim().toLowerCase();

    return (
        result !== "" &&
        result !== "no predictions available"
    );
}

function selectMatches(matches) {
    const seen = new Set();

    return matches
        .filter(usable)
        .filter((match, index) => {
            const identity = [
                valueOf(match, [
                    "Fixture ID",
                    "API Fixture ID",
                    "fixture_id"
                ]),
                home(match),
                away(match),
                league(match)
            ]
                .map(key)
                .join("|");

            const identifier =
                identity === "|||"
                    ? "row-" + index
                    : identity;

            if (seen.has(identifier)) {
                return false;
            }

            seen.add(identifier);
            return true;
        })
        .sort(
            (a, b) =>
                (confidence(b) || 0) -
                (confidence(a) || 0)
        )
        .slice(
            0,
            APEX_DASHBOARD_CONFIG.MAX_MATCHES
        );
}

function text(id, value) {
    const element = document.getElementById(id);

    if (element) {
        element.textContent = value;
    }
}

function status(message, type) {
    const element =
        document.getElementById("connectionStatus");

    if (element) {
        element.textContent = message;
        element.dataset.status = type;
    }
}

function renderKpis(matches) {
    text("matchesCount", matches.length);

    const scores = matches
        .map(confidence)
        .filter(value => value !== null);

    const best = scores.length
        ? Math.max(...scores)
        : null;

    text(
        "bestConfidence",
        best === null ? "—" : best + "%"
    );

    text(
        "bestConfidenceNote",
        best === null
            ? "No confidence data"
            : "Highest final confidence"
    );

    text(
        "predictionCount",
        matches.filter(usable).length
    );

    text(
        "lowRiskCount",
        matches.filter(
            match => riskClass(risk(match)) === "low"
        ).length
    );
}

function renderFeatured(match) {
    const container =
        document.getElementById("featuredMatch");

    if (!container) {
        return;
    }

    if (!match) {
        container.innerHTML =
            '<div class="empty-state">No featured prediction is available.</div>';
        return;
    }

    container.innerHTML = `
        <div class="featured-league">
            ${safe(league(match) || "Football")}
        </div>

        <div class="featured-teams">
            <div class="team-name">
                ${safe(home(match) || "Home Team")}
            </div>

            <div class="vs">VS</div>

            <div class="team-name">
                ${safe(away(match) || "Away Team")}
            </div>
        </div>

        <div class="featured-meta">
            ${safe(prediction(match) || "Prediction available")}
        </div>

        <div class="featured-metrics">
            <div class="featured-metric">
                <div class="featured-metric-title">Confidence</div>
                <div class="featured-metric-value">
                    ${safe(percent(confidence(match)))}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">Risk</div>
                <div class="featured-metric-value">
                    ${safe(risk(match) || "—")}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">Market</div>
                <div class="featured-metric-value">
                    ${safe(market(match) || "—")}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">League</div>
                <div class="featured-metric-value">
                    ${safe(league(match) || "—")}
                </div>
            </div>
        </div>
    `;
}

function renderAnalysis(matches) {
    const container =
        document.getElementById("analysisSummary");

    if (!container) {
        return;
    }

    if (!matches.length) {
        container.innerHTML =
            '<div class="empty-state">No completed predictions available.</div>';
        return;
    }

    const scores = matches
        .map(confidence)
        .filter(value => value !== null);

    const average = scores.length
        ? Math.round(
            scores.reduce(
                (total, value) => total + value,
                0
            ) / scores.length
        )
        : null;

    const markets = {};
    const risks = {};

    matches.forEach(match => {
        const m = market(match) || "Unknown";
        const r = risk(match) || "Unknown";

        markets[m] = (markets[m] || 0) + 1;
        risks[r] = (risks[r] || 0) + 1;
    });

    function mostCommon(object) {
        const entries = Object.entries(object);

        if (!entries.length) {
            return "—";
        }

        entries.sort(
            (a, b) => b[1] - a[1]
        );

        return entries[0][0];
    }

    container.innerHTML = `
        <table class="analysis-table">
            <tbody>
                <tr>
                    <th>Selected matches</th>
                    <td class="score-value">${matches.length}</td>
                </tr>

                <tr>
                    <th>Average confidence</th>
                    <td class="score-value">
                        ${safe(percent(average))}
                    </td>
                </tr>

                <tr>
                    <th>Most common market</th>
                    <td>${safe(mostCommon(markets))}</td>
                </tr>

                <tr>
                    <th>Most common risk</th>
                    <td>${safe(mostCommon(risks))}</td>
                </tr>
            </tbody>
        </table>
    `;
}

function renderConfidence(match) {
    const summary =
        document.getElementById("confidenceSummary");

    const factors =
        document.getElementById("factorSummary");

    if (!summary || !factors) {
        return;
    }

    if (!match) {
        summary.innerHTML = `
            <div class="confidence-number">—</div>
            <div class="confidence-label">Final Confidence</div>
        `;

        factors.innerHTML = "";
        return;
    }

    const score = confidence(match);
    const progress = score === null
        ? 0
        : Math.max(
            0,
            Math.min(100, score)
        );

    summary.innerHTML = `
        <div class="confidence-number">
            ${safe(percent(score))}
        </div>

        <div class="confidence-label">
            Final Confidence
        </div>

        <div class="progress">
            <div
                class="progress-bar"
                style="width:${progress}%"
            ></div>
        </div>
    `;

    factors.innerHTML = `
        <div class="factor-row">
            <span class="factor-name">Prediction</span>
            <span class="factor-score">
                ${safe(prediction(match) || "—")}
            </span>
        </div>

        <div class="factor-row">
            <span class="factor-name">Market</span>
            <span class="factor-score">
                ${safe(market(match) || "—")}
            </span>
        </div>

        <div class="factor-row">
            <span class="factor-name">Risk</span>
            <span class="factor-score">
                ${safe(risk(match) || "—")}
            </span>
        </div>
    `;
}

function renderMatches(matches) {
    const container =
        document.getElementById("matchList");

    if (!container) {
        return;
    }

    if (!matches.length) {
        container.innerHTML =
            '<div class="empty-state">No selected matches are available.</div>';
        return;
    }

    container.innerHTML = matches
        .map(
            (match, index) => `
                <article class="match-row">
                    <div class="match-main">
                        <div class="match-teams-small">
                            ${index + 1}.
                            ${safe(home(match) || "Home")}
                            vs
                            ${safe(away(match) || "Away")}
                        </div>

                        <div class="match-league">
                            ${safe(league(match) || "Football")}
                        </div>
                    </div>

                    <div class="match-prediction">
                        ${safe(prediction(match) || "—")}
                    </div>

                    <div class="match-market">
                        <strong>Market:</strong>
                        ${safe(market(match) || "—")}
                        <br>
                        <span class="match-risk">
                            <strong>Risk:</strong>
                            ${safe(risk(match) || "—")}
                        </span>
                    </div>

                    <div>
                        <div class="match-confidence">
                            ${safe(percent(confidence(match)))}
                        </div>

                        <span class="badge ${riskClass(risk(match))}">
                            ${safe(risk(match) || "Unknown risk")}
                        </span>
                    </div>
                </article>
            `
        )
        .join("");
}

async function fetchWithTimeout(url) {
    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            APEX_DASHBOARD_CONFIG.TIMEOUT
        );

    try {
        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    cache: "no-store",
                    redirect: "follow",
                    signal: controller.signal
                }
            );

        if (!response.ok) {
            throw new Error(
                "APEX backend returned HTTP " +
                response.status
            );
        }

        const raw =
            await response.text();

        if (!raw.trim()) {
            throw new Error(
                "APEX backend returned an empty response"
            );
        }

        try {
            return JSON.parse(raw);
        } catch (error) {
            throw new Error(
                "APEX backend returned invalid JSON"
            );
        }

    } catch (error) {
        if (error.name === "AbortError") {
            throw new Error(
                "APEX backend request timed out"
            );
        }

        throw error;

    } finally {
        clearTimeout(timer);
    }
}

async function loadDashboard() {
    try {
        status(
            "🔄 Connecting to APEX AI...",
            "loading"
        );

        const url =
            APEX_DASHBOARD_CONFIG.API_URL +
            "?request=dashboard&ts=" +
            Date.now();

        let data;
        let lastError;

        for (
            let attempt = 0;
            attempt <= APEX_DASHBOARD_CONFIG.RETRIES;
            attempt++
        ) {
            try {
                data =
                    await fetchWithTimeout(url);
                break;
            } catch (error) {
                lastError = error;

                if (
                    attempt <
                    APEX_DASHBOARD_CONFIG.RETRIES
                ) {
                    await new Promise(
                        resolve => setTimeout(resolve, 1200)
                    );
                }
            }
        }

        if (!data) {
            throw lastError ||
                new Error(
                    "APEX backend did not respond"
                );
        }

        if (
            data.status === "ERROR"
        ) {
            throw new Error(
                data.message ||
                "APEX backend returned an error"
            );
        }

        const matches =
            selectMatches(
                extractMatches(data)
            );

        renderKpis(matches);
        renderFeatured(matches[0]);
        renderAnalysis(matches);
        renderConfidence(matches[0]);
        renderMatches(matches);

        status(
            "✅ APEX backend connected · " +
            matches.length +
            " selected matches loaded",
            "success"
        );

    } catch (error) {
        console.error(
            "APEX dashboard error:",
            error
        );

        status(
            "❌ APEX backend connection failed: " +
            error.message,
            "error"
        );

        document.getElementById(
            "featuredMatch"
        ).innerHTML =
            '<div class="error">Unable to load APEX data.</div>';

        document.getElementById(
            "analysisSummary"
        ).innerHTML =
            '<div class="error">Unable to load APEX data.</div>';

        document.getElementById(
            "confidenceSummary"
        ).innerHTML =
            '<div class="error">Unable to load APEX data.</div>';

        document.getElementById(
            "factorSummary"
        ).innerHTML = "";

        document.getElementById(
            "matchList"
        ).innerHTML =
            '<div class="error">Unable to load APEX data.</div>';
    }
}

window.go = go;
window.logout = logout;
window.loadDashboard = loadDashboard;

document.addEventListener(
    "DOMContentLoaded",
    loadDashboard
);

</script>
