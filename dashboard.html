<script>
"use strict";

const APEX_DASHBOARD_CONFIG = Object.freeze({
    API_URL: API_URL: "https://script.google.com/macros/s/AKfycbxygAHM7CTxHK5SXXCoc7AyfhivumaYJDKSYv5OFdI_woZdSnpVgBM400W8Gkny1Y8I/exec",
    TIMEOUT: 45000,
    RETRIES: 2,
    MAX_MATCHES: 30
});

function go(page) {
    const allowedPages = [
        "dashboard.html",
        "predictions.html",
        "analysis.html",
        "statistics.html",
        "livescores.html",
        "leagues.html",
        "headtohead.html",
        "settings.html"
    ];

    window.location.href =
        "./" +
        (
            allowedPages.includes(page)
                ? page
                : "dashboard.html"
        );
}

function logout() {
    if (confirm("Logout from APEX Predict AI?")) {
        window.location.href = "./index.html";
    }
}

function normaliseKey(value) {
    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/s+/g, " ");
}

function safe(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getValue(object, names) {
    if (!object || typeof object !== "object") {
        return "";
    }

    const keys = Object.keys(object);

    for (const name of names) {
        const wanted = normaliseKey(name);

        const found = keys.find(
            existing =>
                normaliseKey(existing) === wanted
        );

        if (
            found !== undefined &&
            object[found] !== null &&
            object[found] !== undefined &&
            String(object[found]).trim() !== ""
        ) {
            return object[found];
        }
    }

    return "";
}

function numberValue(value) {
    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }

    const parsed = parseFloat(
        String(value)
            .replace("%", "")
            .replace(",", ".")
            .trim()
    );

    return Number.isFinite(parsed)
        ? parsed
        : null;
}

function percentage(value) {
    const number = numberValue(value);

    return number === null
        ? "—"
        : number + "%";
}

function getHomeTeam(match) {
    return getValue(match, [
        "Home Team",
        "Home",
        "HomeTeam",
        "Team Home"
    ]);
}

function getAwayTeam(match) {
    return getValue(match, [
        "Away Team",
        "Away",
        "AwayTeam",
        "Team Away"
    ]);
}

function getLeague(match) {
    return getValue(match, [
        "League",
        "Competition",
        "League Name"
    ]);
}

function getPrediction(match) {
    return getValue(match, [
        "Prediction",
        "AI Prediction",
        "Prediction Advice",
        "Advice"
    ]);
}

function getConfidence(match) {
    return numberValue(
        getValue(match, [
            "Final confidence",
            "Final Confidence",
            "Final confidence %",
            "Final Confidence %",
            "Confidence %",
            "Confidence",
            "AI Confidence"
        ])
    );
}

function getRisk(match) {
    const direct = getValue(match, [
        "Risk Level",
        "Risk",
        "Risk Category",
        "Risk Rating",
        "AI Risk",
        "Confidence Risk"
    ]);

    if (direct !== "") {
        return String(direct);
    }

    const score = getConfidence(match);

    if (score === null) {
        return "";
    }

    if (score >= 60) {
        return "LOW";
    }

    if (score >= 45) {
        return "MEDIUM";
    }

    return "HIGH";
}

function getMarket(match) {
    const direct = getValue(match, [
        "recommended market",
        "Recommended Market",
        "Recommended market",
        "Market",
        "Betting Market",
        "Selection Market",
        "Prediction Market"
    ]);

    if (direct !== "") {
        return String(direct);
    }

    const text =
        String(getPrediction(match)).toLowerCase();

    if (text.includes("double chance")) {
        return "Double Chance";
    }

    if (
        text.includes("over 1.5") ||
        text.includes("+1.5")
    ) {
        return "Over 1.5 Goals";
    }

    if (
        text.includes("over 2.5") ||
        text.includes("+2.5")
    ) {
        return "Over 2.5 Goals";
    }

    if (
        text.includes("under 2.5") ||
        text.includes("-2.5")
    ) {
        return "Under 2.5 Goals";
    }

    if (
        text.includes("under 3.5") ||
        text.includes("-3.5")
    ) {
        return "Under 3.5 Goals";
    }

    if (text.includes("both teams to score")) {
        return "Both Teams To Score";
    }

    if (text.includes("draw")) {
        return "Draw";
    }

    return "";
}

function getRiskClass(risk) {
    const text =
        String(risk || "").toLowerCase();

    if (text.includes("low")) {
        return "low";
    }

    if (
        text.includes("medium") ||
        text.includes("moderate")
    ) {
        return "medium";
    }

    if (text.includes("high")) {
        return "high";
    }

    return "unknown";
}

function extractMatches(data) {
    if (
        data &&
        Array.isArray(data.matches)
    ) {
        return data.matches;
    }

    if (
        data &&
        data.matchDatabase &&
        Array.isArray(data.matchDatabase.objects)
    ) {
        return data.matchDatabase.objects;
    }

    if (
        data &&
        data.smartGate &&
        Array.isArray(data.smartGate.objects)
    ) {
        return data.smartGate.objects;
    }

    if (
        data &&
        Array.isArray(data.smartGate)
    ) {
        return data.smartGate;
    }

    if (
        data &&
        Array.isArray(data.data)
    ) {
        return data.data;
    }

    return [];
}

function isUsableMatch(match) {
    const result =
        String(getPrediction(match))
            .trim()
            .toLowerCase();

    return (
        result !== "" &&
        result !== "no predictions available"
    );
}

function selectMatches(matches) {
    const seen = new Set();

    return matches
        .filter(isUsableMatch)
        .filter((match, index) => {
            const identity = [
                getValue(match, [
                    "Fixture ID",
                    "API Fixture ID",
                    "fixture_id"
                ]),
                getHomeTeam(match),
                getAwayTeam(match),
                getLeague(match)
            ]
                .map(normaliseKey)
                .join("|");

            const uniqueKey =
                identity === "|||"
                    ? "row-" + index
                    : identity;

            if (seen.has(uniqueKey)) {
                return false;
            }

            seen.add(uniqueKey);
            return true;
        })
        .sort(
            (a, b) =>
                (getConfidence(b) || 0) -
                (getConfidence(a) || 0)
        )
        .slice(
            0,
            APEX_DASHBOARD_CONFIG.MAX_MATCHES
        );
}

function setText(id, value) {
    const element =
        document.getElementById(id);

    if (element) {
        element.textContent = value;
    }
}

function setStatus(message, type) {
    const element =
        document.getElementById("connectionStatus");

    if (element) {
        element.textContent = message;
        element.dataset.status = type;
    }
}

function renderKpis(matches) {
    setText("matchesCount", matches.length);

    const confidenceValues = matches
        .map(getConfidence)
        .filter(value => value !== null);

    const best = confidenceValues.length
        ? Math.max(...confidenceValues)
        : null;

    setText(
        "bestConfidence",
        best === null
            ? "—"
            : best + "%"
    );

    setText(
        "bestConfidenceNote",
        best === null
            ? "No confidence data"
            : "Highest final confidence"
    );

    setText(
        "predictionCount",
        matches.filter(isUsableMatch).length
    );

    setText(
        "lowRiskCount",
        matches.filter(
            match =>
                getRiskClass(getRisk(match)) === "low"
        ).length
    );
}

function renderFeatured(match) {
    const container =
        document.getElementById("featuredMatch");

    if (!container) {
        return;
    }

    if (!match) {
        container.innerHTML =
            '<div class="empty-state">No featured prediction is available.</div>';
        return;
    }

    container.innerHTML = `
        <div class="featured-league">
            ${safe(getLeague(match) || "Football")}
        </div>

        <div class="featured-teams">
            <div class="team-name">
                ${safe(getHomeTeam(match) || "Home Team")}
            </div>

            <div class="vs">VS</div>

            <div class="team-name">
                ${safe(getAwayTeam(match) || "Away Team")}
            </div>
        </div>

        <div class="featured-meta">
            ${safe(getPrediction(match) || "Prediction available")}
        </div>

        <div class="featured-metrics">
            <div class="featured-metric">
                <div class="featured-metric-title">
                    Confidence
                </div>

                <div class="featured-metric-value">
                    ${safe(percentage(getConfidence(match)))}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">
                    Risk
                </div>

                <div class="featured-metric-value">
                    ${safe(getRisk(match) || "—")}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">
                    Market
                </div>

                <div class="featured-metric-value">
                    ${safe(getMarket(match) || "—")}
                </div>
            </div>

            <div class="featured-metric">
                <div class="featured-metric-title">
                    League
                </div>

                <div class="featured-metric-value">
                    ${safe(getLeague(match) || "—")}
                </div>
            </div>
        </div>
    `;
}

function renderAnalysis(matches) {
    const container =
        document.getElementById("analysisSummary");

    if (!container) {
        return;
    }

    if (!matches.length) {
        container.innerHTML =
            '<div class="empty-state">No completed predictions available.</div>';
        return;
    }

    const values = matches
        .map(getConfidence)
        .filter(value => value !== null);

    const average = values.length
        ? Math.round(
            values.reduce(
                (total, value) => total + value,
                0
            ) / values.length
        )
        : null;

    const marketCounts = {};
    const riskCounts = {};

    matches.forEach(match => {
        const currentMarket =
            getMarket(match) || "Unknown";

        const currentRisk =
            getRisk(match) || "Unknown";

        marketCounts[currentMarket] =
            (marketCounts[currentMarket] || 0) + 1;

        riskCounts[currentRisk] =
            (riskCounts[currentRisk] || 0) + 1;
    });

    function mostCommon(object) {
        const entries =
            Object.entries(object);

        if (!entries.length) {
            return "—";
        }

        entries.sort(
            (a, b) => b[1] - a[1]
        );

        return entries[0][0];
    }

    container.innerHTML = `
        <table class="analysis-table">
            <tbody>
                <tr>
                    <th>Selected matches</th>
                    <td class="score-value">
                        ${matches.length}
                    </td>
                </tr>

                <tr>
                    <th>Average confidence</th>
                    <td class="score-value">
                        ${safe(percentage(average))}
                    </td>
                </tr>

                <tr>
                    <th>Most common market</th>
                    <td>
                        ${safe(mostCommon(marketCounts))}
                    </td>
                </tr>

                <tr>
                    <th>Most common risk</th>
                    <td>
                        ${safe(mostCommon(riskCounts))}
                    </td>
                </tr>
            </tbody>
        </table>
    `;
}

function renderConfidence(match) {
    const summary =
        document.getElementById("confidenceSummary");

    const factors =
        document.getElementById("factorSummary");

    if (!summary || !factors) {
        return;
    }

    if (!match) {
        summary.innerHTML = `
            <div class="confidence-number">—</div>
            <div class="confidence-label">
                Final Confidence
            </div>
        `;

        factors.innerHTML = "";
        return;
    }

    const score =
        getConfidence(match);

    const progress =
        score === null
            ? 0
            : Math.max(
                0,
                Math.min(100, score)
            );

    summary.innerHTML = `
        <div class="confidence-number">
            ${safe(percentage(score))}
        </div>

        <div class="confidence-label">
            Final Confidence
        </div>

        <div class="progress">
            <div
                class="progress-bar"
                style="width:${progress}%"
            ></div>
        </div>
    `;

    factors.innerHTML = `
        <div class="factor-row">
            <span class="factor-name">
                Prediction
            </span>

            <span class="factor-score">
                ${safe(getPrediction(match) || "—")}
            </span>
        </div>

        <div class="factor-row">
            <span class="factor-name">
                Market
            </span>

            <span class="factor-score">
                ${safe(getMarket(match) || "—")}
            </span>
        </div>

        <div class="factor-row">
            <span class="factor-name">
                Risk
            </span>

            <span class="factor-score">
                ${safe(getRisk(match) || "—")}
            </span>
        </div>
    `;
}

function renderMatches(matches) {
    const container =
        document.getElementById("matchList");

    if (!container) {
        return;
    }

    if (!matches.length) {
        container.innerHTML =
            '<div class="empty-state">No selected matches are available.</div>';
        return;
    }

    container.innerHTML = matches
        .map(
            (match, index) => `
                <article class="match-row">
                    <div class="match-main">
                        <div class="match-teams-small">
                            ${index + 1}.
                            ${safe(getHomeTeam(match) || "Home")}
                            vs
                            ${safe(getAwayTeam(match) || "Away")}
                        </div>

                        <div class="match-league">
                            ${safe(getLeague(match) || "Football")}
                        </div>
                    </div>

                    <div class="match-prediction">
                        ${safe(getPrediction(match) || "—")}
                    </div>

                    <div class="match-market">
                        <strong>Market:</strong>
                        ${safe(getMarket(match) || "—")}
                        <br>
                        <strong>Risk:</strong>
                        ${safe(getRisk(match) || "—")}
                    </div>

                    <div class="match-result">
                        <div class="match-confidence">
                            ${safe(percentage(getConfidence(match)))}
                        </div>

                        <span class="badge ${getRiskClass(getRisk(match))}">
                            ${safe(getRisk(match) || "Unknown")}
                        </span>
                    </div>
                </article>
            `
        )
        .join("");
}

async function fetchJson(url) {
    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            APEX_DASHBOARD_CONFIG.TIMEOUT
        );

    try {
        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store",
                redirect: "follow",
                signal: controller.signal
            });

        const raw =
            await response.text();

        if (!response.ok) {
            throw new Error(
                "API returned HTTP " +
                response.status
            );
        }

        if (!raw.trim()) {
            throw new Error(
                "API returned an empty response"
            );
        }

        try {
            return JSON.parse(raw);
        } catch (error) {
            throw new Error(
                "API returned invalid JSON"
            );
        }

    } catch (error) {
        if (error.name === "AbortError") {
            throw new Error(
                "API request timed out"
            );
        }

        throw error;

    } finally {
        clearTimeout(timer);
    }
}

async function loadDashboard() {
    try {
        setStatus(
            "Connecting to APEX AI...",
            "loading"
        );

        const url =
            APEX_DASHBOARD_CONFIG.API_URL +
            "?request=dashboard&ts=" +
            Date.now();

        let data;
        let lastError;

        for (
            let attempt = 0;
            attempt <= APEX_DASHBOARD_CONFIG.RETRIES;
            attempt++
        ) {
            try {
                data =
                    await fetchJson(url);
                break;
            } catch (error) {
                lastError = error;

                if (
                    attempt <
                    APEX_DASHBOARD_CONFIG.RETRIES
                ) {
                    await new Promise(
                        resolve =>
                            setTimeout(resolve, 1200)
                    );
                }
            }
        }

        if (!data) {
            throw lastError ||
                new Error(
                    "No API response"
                );
        }

        if (
            data.status &&
            String(data.status).toUpperCase() ===
            "ERROR"
        ) {
            throw new Error(
                data.message ||
                "Backend returned an error"
            );
        }

        const matches =
            selectMatches(
                extractMatches(data)
            );

        renderKpis(matches);
        renderFeatured(matches[0]);
        renderAnalysis(matches);
        renderConfidence(matches[0]);
        renderMatches(matches);

        setStatus(
            "APEX connected · " +
            matches.length +
            " matches loaded",
            "success"
        );

    } catch (error) {
        console.error(
            "APEX dashboard error:",
            error
        );

        setStatus(
            "APEX connection failed: " +
            error.message,
            "error"
        );

        [
            "featuredMatch",
            "analysisSummary",
            "confidenceSummary",
            "matchList"
        ].forEach(id => {
            const element =
                document.getElementById(id);

            if (element) {
                element.innerHTML =
                    '<div class="error">' +
                    safe(error.message) +
                    "</div>";
            }
        });
    }
}

window.go = go;
window.logout = logout;
window.loadDashboard = loadDashboard;

document.addEventListener(
    "DOMContentLoaded",
    loadDashboard
);
</script>
<script>
window.APEX_BACKEND_URL =
"https://script.google.com/macros/s/AKfycbxygAHM7CTxHK5SXXCoc7AyfhivumaYJDKSYv5OFdI_woZdSnpVgBM400W8Gkny1Y8I/exec";

const originalFetch = window.fetch;

window.fetch = function(url, options) {
    if (
        String(url).includes("request=dashboard") ||
        String(url).includes("PASTE_YOUR_NEW_BACKEND_EXEC_URL_HERE")
    ) {
        url =
            window.APEX_BACKEND_URL +
            "?request=dashboard&ts=" +
            Date.now();
    }

    return originalFetch.call(this, url, options);
};
</script>
