<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Head to Head - APEX Predict AI</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#081b33;
color:white;
font-family:Arial,sans-serif;
margin:0;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:#102847;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.35);
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#00c853;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:20px;
padding:15px;
background:#0d3b66;
border-radius:10px;
}

.back{
display:inline-block;
margin-top:20px;
padding:12px 20px;
background:#00c853;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>⚔ Head to Head Analysis</h1>

<div class="card">

<input
type="text"
placeholder="Home Team">

<input
type="text"
placeholder="Away Team">

<button>
Analyze Match
</button>

<div class="result">

<h3>Sample Analysis</h3>

<p>Previous Meetings: 10</p>

<p>Home Wins: 5</p>

<p>Away Wins: 3</p>

<p>Draws: 2</p>

<p>AI Confidence: 92%</p>

</div>

</div>

<a href="dashboard.html" class="back">
⬅ Back to Dashboard
</a>

</div>

</body>
</html>
