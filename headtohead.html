<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Head To Head</title>

<link rel="stylesheet" href="styles.css">

<style>

.h2h-header{
    text-align:center;
    margin-bottom:25px;
}

.h2h-header h1{
    margin-bottom:8px;
}

.h2h-header p{
    color:#cfd8e3;
}

.h2h-card{
    background:#102847;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.h2h-controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.h2h-controls label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.h2h-controls select{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    background:white;
    color:#111;
}

.h2h-button{
    margin-top:18px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.h2h-status{
    text-align:center;
    padding:12px;
    margin-bottom:18px;
    border-radius:10px;
    background:rgba(255,255,255,.08);
    color:#ffd54f;
}

.h2h-teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:15px;
    text-align:center;
    margin:20px 0;
}

.h2h-team{
    background:#0b2344;
    padding:18px;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
}

.h2h-vs{
    font-size:22px;
    font-weight:bold;
}

.h2h-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
}

.h2h-stat{
    background:white;
    color:#111;
    padding:15px;
    border-radius:10px;
    border:1px solid #ddd;
}

.h2h-stat-title{
    font-size:13px;
    font-weight:bold;
    color:#555;
    margin-bottom:7px;
}

.h2h-stat-value{
    font-size:18px;
    font-weight:bold;
    word-break:break-word;
}

.h2h-empty{
    text-align:center;
    padding:25px;
    color:#cfd8e3;
}

.h2h-error{
    background:#3a1515;
    color:#ffb4ab;
    text-align:center;
    padding:20px;
    border-radius:12px;
}

.h2h-navigation{
    margin-top:25px;
}

.h2h-navigation button{
    margin-top:8px;
}

@media(max-width:700px){

    .h2h-controls{
        grid-template-columns:1fr;
    }

    .h2h-teams{
        grid-template-columns:1fr;
    }

    .h2h-vs{
        margin:-5px 0;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="h2h-header">

        <h1>⚔ Head To Head</h1>

        <p>
            Compare teams from the final APEX selections
        </p>

    </div>

    <div class="h2h-card">

        <div id="h2hStatus" class="h2h-status">
            🔄 Connecting to APEX AI...
        </div>

        <div class="h2h-controls">

            <div>

                <label for="homeTeamSelect">
                    Team 1
                </label>

                <select id="homeTeamSelect">
                    <option value="">
                        Loading selected teams...
                    </option>
                </select>

            </div>

            <div>

                <label for="awayTeamSelect">
                    Team 2
                </label>

                <select id="awayTeamSelect">
                    <option value="">
                        Loading selected teams...
                    </option>
                </select>

            </div>

        </div>

        <button
            type="button"
            class="h2h-button"
            id="compareButton"
        >
            ⚔ COMPARE TEAMS
        </button>

    </div>

    <div id="headToHeadContainer" class="h2h-card">

        <div class="h2h-empty">
            Select two teams and press COMPARE TEAMS.
        </div>

    </div>

    <div class="h2h-navigation">

        <button onclick="go('dashboard.html')">
            🏠 Dashboard
        </button>

        <button onclick="go('predictions.html')">
            🤖 Predictions
        </button>

        <button onclick="go('analysis.html')">
            📊 Analysis
        </button>

        <button onclick="go('statistics.html')">
            📈 Statistics
        </button>

        <button onclick="go('livescores.html')">
            ⚽ Live Scores
        </button>

        <button onclick="go('leagues.html')">
            🏆 Leagues
        </button>

        <button onclick="go('settings.html')">
            ⚙ Settings
        </button>

    </div>

</div>

<script>

"use strict";

const APEX_GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";

let apexMatches = [];


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function h2hEscape(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   FLEXIBLE VALUE READER
   ===================================================== */

function h2hValue(match,names){

    if(!match){
        return "";
    }

    const keys = Object.keys(match);

    for(const wanted of names){

        const wantedName =
            wanted.trim().toLowerCase();

        const key = keys.find(function(existingKey){

            return existingKey
                .trim()
                .toLowerCase()
                === wantedName;

        });

        if(key !== undefined){

            const value = match[key];

            if(
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            ){

                return value;

            }

        }

    }

    return "";
}


/* =====================================================
   STATUS
   ===================================================== */

function setH2HStatus(message,type){

    const element =
        document.getElementById("h2hStatus");

    if(!element){
        return;
    }

    element.textContent = message;

    if(type === "success"){
        element.style.color = "#b9f6ca";
    }
    else if(type === "error"){
        element.style.color = "#ffb4ab";
    }
    else{
        element.style.color = "#ffd54f";
    }
}


/* =====================================================
   LOAD FINAL 10
   ===================================================== */

async function loadH2HData(){

    try{

        setH2HStatus(
            "🔄 Loading final 10 APEX matches...",
            "loading"
        );

        const response =
            await fetch(
                APEX_GOOGLE_SHEETS_API,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();

        if(
            !data ||
            !data.matchDatabase ||
            !Array.isArray(data.matchDatabase.objects)
        ){

            throw new Error(
                "APEX Match Database was not returned."
            );

        }

        const allMatches =
            data.matchDatabase.objects;


        /*
         * Same completed-record rule used
         * by Predictions and Analysis.
         */

        const completedMatches =
            allMatches.filter(function(match){

                const prediction =
                    h2hValue(
                        match,
                        [
                            "Prediction",
                            "prediction",
                            "AI Prediction"
                        ]
                    );

                const confidence =
                    h2hValue(
                        match,
                        [
                            "Confidence %",
                            "Confidence",
                            "confidence %",
                            "Final Confidence"
                        ]
                    );

                const market =
                    h2hValue(
                        match,
                        [
                            "Recommended Market",
                            "recommended market",
                            "Market"
                        ]
                    );

                return (
                    prediction !== "" ||
                    confidence !== "" ||
                    market !== ""
                );

            });


        /*
         * Keep exactly the same lightweight
         * selection behaviour used by the
         * working web pages.
         */

        apexMatches =
            completedMatches
                .slice()
                .reverse()
                .slice(0,10);


        if(apexMatches.length === 0){

            setH2HStatus(
                "⚠️ No selected matches available.",
                "loading"
            );

            showEmptyMessage(
                "No completed APEX matches are currently available."
            );

            return;
        }


        populateTeamSelectors();

        setH2HStatus(
            "✅ APEX AI Connected — " +
            apexMatches.length +
            " selected matches",
            "success"
        );

    }
    catch(error){

        console.error(
            "APEX Head To Head error:",
            error
        );

        setH2HStatus(
            "❌ APEX Head To Head failed",
            "error"
        );

        showEmptyMessage(
            error.message
        );

    }

}


/* =====================================================
   TEAM LIST
   ===================================================== */

function getTeams(){

    const teams = new Set();

    apexMatches.forEach(function(match){

        const home =
            String(
                h2hValue(
                    match,
                    [
                        "Home Team",
                        "HomeTeam",
                        "Home"
                    ]
                )
            ).trim();

        const away =
            String(
                h2hValue(
                    match,
                    [
                        "Away Team",
                        "AwayTeam",
                        "Away"
                    ]
                )
            ).trim();

        if(home){
            teams.add(home);
        }

        if(away){
            teams.add(away);
        }

    });

    return Array.from(teams)
        .sort(function(a,b){
            return a.localeCompare(b);
        });
}


/* =====================================================
   TEAM SELECTORS
   ===================================================== */

function populateTeamSelectors(){

    const homeSelect =
        document.getElementById("homeTeamSelect");

    const awaySelect =
        document.getElementById("awayTeamSelect");

    const teams =
        getTeams();

    if(!teams.length){

        homeSelect.innerHTML =
            '<option value="">No teams available</option>';

        awaySelect.innerHTML =
            '<option value="">No teams available</option>';

        return;
    }

    let options =
        '<option value="">Select team</option>';

    teams.forEach(function(team){

        options +=
            '<option value="' +
            h2hEscape(team) +
            '">' +
            h2hEscape(team) +
            '</option>';

    });

    homeSelect.innerHTML = options;
    awaySelect.innerHTML = options;
}


/* =====================================================
   FIND EXACT MATCH
   ===================================================== */

function findMatch(homeTeam,awayTeam){

    return apexMatches.find(function(match){

        const home =
            String(
                h2hValue(
                    match,
                    [
                        "Home Team",
                        "HomeTeam",
                        "Home"
                    ]
                )
            ).trim()
            .toLowerCase();

        const away =
            String(
                h2hValue(
                    match,
                    [
                        "Away Team",
                        "AwayTeam",
                        "Away"
                    ]
                )
            ).trim()
            .toLowerCase();

        return (
            home === homeTeam.trim().toLowerCase()
            &&
            away === awayTeam.trim().toLowerCase()
        );

    });
}


/* =====================================================
   COMPARE
   ===================================================== */

function compareTeams(){

    const homeSelect =
        document.getElementById("homeTeamSelect");

    const awaySelect =
        document.getElementById("awayTeamSelect");

    const homeTeam =
        homeSelect.value.trim();

    const awayTeam =
        awaySelect.value.trim();

    if(!homeTeam || !awayTeam){

        showEmptyMessage(
            "⚠️ Please select both teams."
        );

        return;
    }

    if(
        homeTeam.toLowerCase()
        ===
        awayTeam.toLowerCase()
    ){

        showEmptyMessage(
            "⚠️ Please select two different teams."
        );

        return;
    }

    const match =
        findMatch(
            homeTeam,
            awayTeam
        );

    if(!match){

        showEmptyMessage(
            "No exact match between these two teams was found among the final 10 APEX selections."
        );

        return;
    }

    renderComparison(
        match,
        homeTeam,
        awayTeam
    );
}


/* =====================================================
   DISPLAY COMPARISON
   ===================================================== */

function renderComparison(
    match,
    homeTeam,
    awayTeam
){

    const container =
        document.getElementById(
            "headToHeadContainer"
        );

    const league =
        h2hValue(
            match,
            [
                "League",
                "league"
            ]
        );

    const date =
        h2hValue(
            match,
            [
                "Date",
                "Match Date",
                "date"
            ]
        );

    const prediction =
        h2hValue(
            match,
            [
                "Prediction",
                "AI Prediction"
            ]
        );

    const confidence =
        h2hValue(
            match,
            [
                "Confidence %",
                "Confidence",
                "Final Confidence"
            ]
        );

    const risk =
        h2hValue(
            match,
            [
                "Risk Level",
                "Risk"
            ]
        );

    const market =
        h2hValue(
            match,
            [
                "Recommended Market",
                "recommended market",
                "Market"
            ]
        );

    const h2h =
        h2hValue(
            match,
            [
                "Head to Head",
                "Head To Head",
                "H2H"
            ]
        );

    const h2hScore =
        h2hValue(
            match,
            [
                "Head to Head Score",
                "Head To Head Score",
                "H2H Score"
            ]
        );

    const homeAdvantage =
        h2hValue(
            match,
            [
                "Home Advantage Score",
                "Home Advantage"
            ]
        );

    const odds =
        h2hValue(
            match,
            [
                "Bookmaker Odds",
                "Bookmaker odds",
                "Odds"
            ]
        );

    container.innerHTML = `

        <h2 style="text-align:center;">
            ⚔ Head To Head Analysis
        </h2>

        <div class="h2h-teams">

            <div class="h2h-team">
                🏠 ${h2hEscape(homeTeam)}
            </div>

            <div class="h2h-vs">
                VS
            </div>

            <div class="h2h-team">
                🛡 ${h2hEscape(awayTeam)}
            </div>

        </div>

        <div class="h2h-grid">

            <div class="h2h-stat">
                <div class="h2h-stat-title">
                    League
                </div>
                <div class="h2h-stat-value">
                    ${h2hEscape(league || "—")}
                </div>
            </div>

            <div class="h2h-stat">
                <div class="h2h-stat-title">
                    Date
                </div>
                <div class="h2h-stat-value">
                    ${h2hEscape(date || "—")}
                </div>
            </div>

            <div class="h2h-stat">
                <div class="h2h-stat-title">
                    Head To Head
                </div>
                <div class="h2h-stat-value">
                    ${h2hEscape(h2h || "—")}
                </div>
            </div>

            <div class="h2h-stat">
                <div class="h2h-stat-title">
                    Head To Head Score
                </div>
                <div class="h2h-stat-value">
                    ${h2hEscape(h2hScore || "—")}
                </div>
            </div>

            <div class="h2h-stat">
                <div class="h2h-stat-title">
                    Home Advantage
                </div>
                <div class="h2h-stat-value">
                    ${h2hEscape(homeAdvantage || "—")}
                </div>
            </div>

            <div class="h2h-stat">
                <div class="h2h-stat-title">
                    AI Prediction
                </div>
                <div class="h2h-stat-value">
                    ${h2hEscape(prediction || "—")}
                </div>
            </div>

            <div class="h2h-stat">
                <div class="h2h-stat-title">
                    Confidence
                </div>
                <div class="h2h-stat-value">
                    ${h2hEscape(confidence || "—")}
                </div>
            </div>

            <div class="h2h-stat">
                <div class="h2h-stat-title">
                    Risk
                </div>
                <div class="h2h-stat-value">
                    ${h2hEscape(risk || "—")}
                </div>
            </div>

            <div class="h2h-stat">
                <div class="h2h-stat-title">
                    Recommended Market
                </div>
                <div class="h2h-stat-value">
                    ${h2hEscape(market || "—")}
                </div>
            </div>

            <div class="h2h-stat">
                <div class="h2h-stat-title">
                    Bookmaker Odds
                </div>
                <div class="h2h-stat-value">
                    ${h2hEscape(odds || "—")}
                </div>
            </div>

        </div>

    `;
}


/* =====================================================
   EMPTY STATE
   ===================================================== */

function showEmptyMessage(message){

    const container =
        document.getElementById(
            "headToHeadContainer"
        );

    container.innerHTML = `

        <div class="h2h-empty">

            ${h2hEscape(message)}

        </div>

    `;
}


/* =====================================================
   NAVIGATION
   ===================================================== */

function go(page){

    window.location.href = page;

}


/* =====================================================
   START
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const button =
            document.getElementById(
                "compareButton"
            );

        if(button){

            button.addEventListener(
                "click",
                compareTeams
            );

        }

        loadH2HData();

    }
);

</script>

</body>

</html>
