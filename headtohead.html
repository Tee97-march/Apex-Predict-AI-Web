<script>

"use strict";


/* =========================================================
   CURRENT APEX BACKEND
   ========================================================= */

const APEX_API_URL =
"https://script.google.com/macros/s/AKfycbxygAHM7CTxHK5SXXCoc7AyfhivumaYJDKSYv5OFdI_woZdSnpVgBM400W8Gkny1Y8I/exec";


const MAX_MATCHES = 30;

const REQUEST_TIMEOUT = 45000;

const RETRIES = 2;


let apexMatches = [];


/* =========================================================
   HELPERS
   ========================================================= */

function safe(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function normaliseKey(value){

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");
}


function getValue(
    object,
    names
){

    if(
        !object ||
        typeof object !== "object"
    ){

        return "";
    }


    const keys =
        Object.keys(
            object
        );


    for(
        const wantedName of names
    ){

        const wanted =
            normaliseKey(
                wantedName
            );


        const found =
            keys.find(
                key =>
                    normaliseKey(
                        key
                    ) === wanted
            );


        if(
            found !== undefined
        ){

            const value =
                object[found];


            if(
                value !== null &&
                value !== undefined &&
                String(
                    value
                ).trim() !== ""
            ){

                return value;
            }
        }
    }


    return "";
}


/* =========================================================
   MATCH FIELDS
   ========================================================= */

function getFixtureId(match){

    return getValue(
        match,
        [
            "Fixture ID",
            "API Fixture ID",
            "fixture_id",
            "fixtureId",
            "Fixture"
        ]
    );
}


function getDate(match){

    return getValue(
        match,
        [
            "Date",
            "Match Date",
            "Fixture Date",
            "date"
        ]
    );
}


function getTime(match){

    return getValue(
        match,
        [
            "Time",
            "Match Time",
            "Kickoff",
            "Kick-off",
            "Kick Off",
            "Start Time"
        ]
    );
}


function getHome(match){

    return getValue(
        match,
        [
            "Home Team",
            "HomeTeam",
            "Home",
            "Team Home"
        ]
    );
}


function getAway(match){

    return getValue(
        match,
        [
            "Away Team",
            "AwayTeam",
            "Away",
            "Team Away"
        ]
    );
}


function getLeague(match){

    return getValue(
        match,
        [
            "League",
            "Competition",
            "League Name",
            "Tournament"
        ]
    );
}


function getPrediction(match){

    return getValue(
        match,
        [
            "Prediction",
            "AI Prediction",
            "Prediction Advice",
            "Advice"
        ]
    );
}


function getConfidence(match){

    const value =
        getValue(
            match,
            [
                "Final Confidence",
                "Final confidence",
                "Final Confidence %",
                "Final confidence %",
                "Confidence %",
                "Confidence",
                "AI Confidence"
            ]
        );


    if(
        value === "" ||
        value === null ||
        value === undefined
    ){

        return null;
    }


    const parsed =
        parseFloat(
            String(value)
                .replace("%","")
                .replace(",",".")
                .trim()
        );


    return Number.isFinite(
        parsed
    )
        ? parsed
        : null;
}


/* =========================================================
   ANALYSIS FIELDS
   ========================================================= */

function getH2H(match){

    return getValue(
        match,
        [
            "Head to Head",
            "Head To Head",
            "head to head",
            "H2H"
        ]
    );
}


function getH2HScore(match){

    return getValue(
        match,
        [
            "Head to Head Score",
            "Head To Head Score",
            "head - to - head-score",
            "H2H Score"
        ]
    );
}


function getHomeAdvantage(match){

    return getValue(
        match,
        [
            "Home Advantage",
            "Home Advantage Score",
            "Home advantage score"
        ]
    );
}


function getHomeGoals(match){

    return getValue(
        match,
        [
            "Home Goals Scored Avg",
            "Home Goals Scored",
            "Home Avg Goals"
        ]
    );
}


function getAwayGoals(match){

    return getValue(
        match,
        [
            "Away Goals Scored Avg",
            "Away Goals Scored",
            "Away Avg Goals"
        ]
    );
}


function getHomeConceded(match){

    return getValue(
        match,
        [
            "Home Goals Conceded Avg",
            "Home Goals Conceded"
        ]
    );
}


function getAwayConceded(match){

    return getValue(
        match,
        [
            "Away Goals Conceded Avg",
            "Away Goals Conceded"
        ]
    );
}


function getHomeWin(match){

    return getValue(
        match,
        [
            "Home Win %",
            "Home Win"
        ]
    );
}


function getAwayWin(match){

    return getValue(
        match,
        [
            "Away Win %",
            "Away Win"
        ]
    );
}


function getBTTS(match){

    return getValue(
        match,
        [
            "BTTS %",
            "BTTS"
        ]
    );
}


function getOver15(match){

    return getValue(
        match,
        [
            "Over 1.5 %",
            "Over 1.5"
        ]
    );
}


function getMarket(match){

    return getValue(
        match,
        [
            "Recommended Market",
            "recommended market",
            "Recommended market",
            "Market",
            "Betting Market",
            "Selection Market",
            "Prediction Market"
        ]
    );
}


function getRisk(match){

    const direct =
        getValue(
            match,
            [
                "Risk Level",
                "Risk",
                "Risk Category",
                "Risk Rating",
                "AI Risk"
            ]
        );


    if(
        direct !== ""
    ){

        return String(
            direct
        );
    }


    const confidence =
        getConfidence(
            match
        );


    if(
        confidence === null
    ){

        return "";
    }


    if(
        confidence >= 70
    ){

        return "LOW";
    }


    if(
        confidence >= 55
    ){

        return "MEDIUM";
    }


    return "HIGH";
}


/* =========================================================
   BACKEND RESPONSE
   ========================================================= */

function extractMatches(data){

    if(
        data &&
        Array.isArray(
            data.matches
        )
    ){

        return data.matches;
    }


    if(
        data &&
        data.smartGate &&
        Array.isArray(
            data.smartGate.objects
        )
    ){

        return data.smartGate.objects;
    }


    if(
        data &&
        Array.isArray(
            data.smartGate
        )
    ){

        return data.smartGate;
    }


    if(
        data &&
        data.matchDatabase &&
        Array.isArray(
            data.matchDatabase.objects
        )
    ){

        return data.matchDatabase.objects;
    }


    if(
        data &&
        Array.isArray(
            data.data
        )
    ){

        return data.data;
    }


    return [];
}


/* =========================================================
   DEDUPLICATION
   ========================================================= */

function prepareMatches(
    source
){

    const matches =
        Array.isArray(source)
            ? source
            : [];


    const seen =
        new Set();


    const result =
        [];


    matches.forEach(
        function(
            match,
            index
        ){

            const home =
                String(
                    getHome(match)
                ).trim();


            const away =
                String(
                    getAway(match)
                ).trim();


            if(
                !home ||
                !away
            ){

                return;
            }


            const fixture =
                String(
                    getFixtureId(match)
                ).trim();


            const identity =
                fixture
                    ? "fixture:" +
                      normaliseKey(
                          fixture
                      )
                    :
                      [
                          getDate(match),
                          home,
                          away,
                          getLeague(match)
                      ]
                      .map(
                          normaliseKey
                      )
                      .join("|");


            const finalIdentity =
                identity ||
                "row:" + index;


            if(
                seen.has(
                    finalIdentity
                )
            ){

                return;
            }


            seen.add(
                finalIdentity
            );


            result.push(
                match
            );

        }
    );


    result.sort(
        function(
            a,
            b
        ){

            return(
                (
                    getConfidence(b)
                    ?? -1
                )
                -
                (
                    getConfidence(a)
                    ?? -1
                )
            );
        }
    );


    return result.slice(
        0,
        MAX_MATCHES
    );
}


/* =========================================================
   API REQUEST
   ========================================================= */

async function fetchAPEXData(){

    const controller =
        new AbortController();


    const timer =
        setTimeout(
            function(){

                controller.abort();

            },
            REQUEST_TIMEOUT
        );


    try{

        const response =
            await fetch(
                APEX_API_URL +
                "?request=dashboard&limit=" +
                MAX_MATCHES +
                "&ts=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store",
                    redirect:"follow",
                    signal:
                        controller.signal
                }
            );


        const raw =
            await response.text();


        if(
            !response.ok
        ){

            throw new Error(
                "APEX backend HTTP " +
                response.status
            );
        }


        if(
            !raw.trim()
        ){

            throw new Error(
                "APEX backend returned an empty response."
            );
        }


        let data;


        try{

            data =
                JSON.parse(
                    raw
                );

        }catch(error){

            console.error(
                "APEX H2H raw response:",
                raw
            );


            throw new Error(
                "APEX backend returned invalid JSON."
            );
        }


        if(
            data &&
            String(
                data.status
            ).toUpperCase()
            ===
            "ERROR"
        ){

            throw new Error(
                data.message ||
                "APEX backend returned an error."
            );
        }


        return data;


    }catch(error){

        if(
            error.name ===
            "AbortError"
        ){

            throw new Error(
                "APEX backend request timed out."
            );
        }


        throw error;

    }finally{

        clearTimeout(
            timer
        );
    }
}


/* =========================================================
   RETRY
   ========================================================= */

async function loadAPEXData(){

    let lastError =
        null;


    for(
        let attempt = 0;

        attempt <= RETRIES;

        attempt++
    ){

        try{

            return await fetchAPEXData();

        }catch(error){

            lastError =
                error;


            if(
                attempt <
                RETRIES
            ){

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            1000
                        )
                );
            }
        }
    }


    throw(
        lastError ||
        new Error(
            "Unable to connect to APEX backend."
        )
    );
}


/* =========================================================
   TEAM LIST
   ========================================================= */

function getTeams(){

    const teams =
        new Set();


    apexMatches.forEach(
        function(match){

            const home =
                String(
                    getHome(match)
                ).trim();


            const away =
                String(
                    getAway(match)
                ).trim();


            if(home){
                teams.add(home);
            }


            if(away){
                teams.add(away);
            }

        }
    );


    return Array.from(
        teams
    )
    .sort(
        function(
            a,
            b
        ){

            return a.localeCompare(b);

        }
    );
}


/* =========================================================
   POPULATE SELECTORS
   ========================================================= */

function populateTeamSelectors(){

    const homeSelect =
        document.getElementById(
            "homeTeamSelect"
        );


    const awaySelect =
        document.getElementById(
            "awayTeamSelect"
        );


    const teams =
        getTeams();


    if(
        !teams.length
    ){

        homeSelect.innerHTML =
            `
            <option value="">
                No teams available
            </option>
            `;


        awaySelect.innerHTML =
            `
            <option value="">
                No teams available
            </option>
            `;


        return;
    }


    const options =
        `
        <option value="">
            Select team
        </option>
        `
        +
        teams.map(
            function(team){

                return(
                    '<option value="' +
                    safe(team) +
                    '">' +
                    safe(team) +
                    '</option>'
                );

            }
        )
        .join("");


    homeSelect.innerHTML =
        options;


    awaySelect.innerHTML =
        options;
}


/* =========================================================
   FIND MATCH
   ========================================================= */

function findMatch(
    team1,
    team2
){

    const first =
        team1
            .trim()
            .toLowerCase();


    const second =
        team2
            .trim()
            .toLowerCase();


    /*
     * First look for the exact fixture direction.
     */

    const exact =
        apexMatches.find(
            function(match){

                const home =
                    String(
                        getHome(match)
                    )
                    .trim()
                    .toLowerCase();


                const away =
                    String(
                        getAway(match)
                    )
                    .trim()
                    .toLowerCase();


                return(
                    home === first &&
                    away === second
                );
            }
        );


    if(exact){
        return exact;
    }


    /*
     * Then allow the reverse direction.
     */

    const reverse =
        apexMatches.find(
            function(match){

                const home =
                    String(
                        getHome(match)
                    )
                    .trim()
                    .toLowerCase();


                const away =
                    String(
                        getAway(match)
                    )
                    .trim()
                    .toLowerCase();


                return(
                    home === second &&
                    away === first
                );
            }
        );


    return reverse || null;
}


/* =========================================================
   COMPARE
   ========================================================= */

function compareTeams(){

    const homeSelect =
        document.getElementById(
            "homeTeamSelect"
        );


    const awaySelect =
        document.getElementById(
            "awayTeamSelect"
        );


    const team1 =
        homeSelect.value.trim();


    const team2 =
        awaySelect.value.trim();


    if(
        !team1 ||
        !team2
    ){

        showEmptyMessage(
            "⚠️ Please select both teams."
        );


        return;
    }


    if(
        team1.toLowerCase()
        ===
        team2.toLowerCase()
    ){

        showEmptyMessage(
            "⚠️ Please select two different teams."
        );


        return;
    }


    const match =
        findMatch(
            team1,
            team2
        );


    if(
        !match
    ){

        showEmptyMessage(
            "No direct fixture between these teams was found in the current 30-match APEX selection."
        );


        return;
    }


    renderComparison(
        match,
        team1,
        team2
    );
}

/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadH2HData(){

    const status =
        document.getElementById(
            "h2hStatus"
        );


    try{

        status.textContent =
            "🔄 Connecting to current APEX backend...";


        const data =
            await loadAPEXData();


        const source =
            extractMatches(
                data
            );


        apexMatches =
            prepareMatches(
                source
            );


        if(
            !apexMatches.length
        ){

            setH2HStatus(
                "⚠️ No APEX match selections available.",
                "loading"
            );


            showEmptyMessage(
                "No current Smart Gate matches were returned by the backend."
            );


            return;
        }


        populateTeamSelectors();


        setH2HStatus(
            "✅ APEX AI Connected · " +
            apexMatches.length +
            " selected matches · " +
            getTeams().length +
            " teams",
            "success"
        );


        console.log(
            "APEX H2H SUCCESS",
            {
                backendMatches:
                    source.length,

                selectedMatches:
                    apexMatches.length,

                teams:
                    getTeams().length,

                backendStatus:
                    data.status
            }
        );


    }catch(error){

        console.error(
            "APEX H2H Error:",
            error
        );


        status.className =
            "status error";


        status.textContent =
            "❌ APEX Head To Head failed to load";


        showEmptyMessage(
            error.message
        );
    }
}


/* =========================================================
   STATUS HELPER
   ========================================================= */

function setH2HStatus(
    message,
    type
){

    const element =
        document.getElementById(
            "h2hStatus"
        );


    if(
        !element
    ){

        return;
    }


    element.className =
        "status " +
        (
            type === "error"
                ? "error"
                : ""
        );


    element.textContent =
        message;
}
