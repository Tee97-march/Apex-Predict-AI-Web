<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>APEX Predict AI</title>

    <link
        rel="stylesheet"
        href="./styles.css"
    >

</head>


<body>

<div id="app">

    <div class="login-container">

        <div class="logo">
            ⚽
        </div>


        <h1>
            APEX Predict AI
        </h1>


        <p class="subtitle">
            Professional Football Prediction Platform
        </p>


        <div class="version">
            Version 2.1 XL
        </div>


        <div
            id="status"
            style="
                color:#ffd54f;
                margin-bottom:20px;
                font-size:14px;
            "
        >
            APEX AI Engine Ready
        </div>


        <!--
        =========================================
        LOGIN FORM
        =========================================
        The form itself points directly to the
        dashboard. This provides a browser-level
        fallback even if JavaScript has a problem.
        =========================================
        -->

        <form
            id="loginForm"
            action="./dashboard.html"
            method="get"
        >


            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="loginBtn"
            >
                LOGIN
            </button>


        </form>


        <p
            class="forgot"
            id="forgotPassword"
        >
            Forgot Password?
        </p>


        <div class="footer">
            © 2026 APEX Predict AI
        </div>

    </div>

</div>



<script>

"use strict";


/*
=================================================
APEX PREDICT AI
LOGIN ENGINE
=================================================
*/


const loginForm =
    document.getElementById("loginForm");


const username =
    document.getElementById("username");


const password =
    document.getElementById("password");


const loginButton =
    document.getElementById("loginBtn");


const status =
    document.getElementById("status");



/*
=================================================
LOGIN SUBMISSION
=================================================
*/

loginForm.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        const usernameValue =
            username.value.trim();


        const passwordValue =
            password.value.trim();



        /*
        =========================================
        EMPTY LOGIN
        =========================================
        */

        if (
            usernameValue === "" ||
            passwordValue === ""
        ) {

            status.textContent =
                "⚠️ Please enter your username and password.";

            status.style.color =
                "#ffd54f";

            return;
        }



        /*
        =========================================
        LOGIN ACCEPTED
        =========================================
        */

        status.textContent =
            "✅ Welcome to APEX Predict AI";

        status.style.color =
            "#00c853";


        loginButton.textContent =
            "OPENING APEX...";


        loginButton.disabled =
            true;



        /*
        =========================================
        DIRECT DASHBOARD NAVIGATION
        =========================================

        We deliberately do NOT use a long
        setTimeout here.

        The dashboard opens immediately.
        =========================================
        */

        window.location.assign(
            "./dashboard.html"
        );

    }
);



/*
=================================================
ENTER KEY SUPPORT
=================================================
*/

username.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            event.preventDefault();

            loginForm.requestSubmit();

        }

    }
);


password.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            event.preventDefault();

            loginForm.requestSubmit();

        }

    }
);



/*
=================================================
FORGOT PASSWORD
=================================================
*/

document
    .getElementById("forgotPassword")
    .addEventListener(
        "click",
        function () {

            alert(
                "Password recovery will be available in a future APEX Predict AI update."
            );

        }
    );



/*
=================================================
READY
=================================================
*/

console.log(
    "APEX Predict AI Login Engine Ready."
);

</script>


</body>

    </html>
