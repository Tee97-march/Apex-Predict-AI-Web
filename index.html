<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APEX Predict AI</title>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

<div id="app">

    <div class="login-container">

        <div class="logo">
            ⚽
        </div>

        <h1>APEX Predict AI</h1>

        <p class="subtitle">
            Professional Football Prediction Platform
        </p>

        <div class="version">
            Version 2.1 XL
        </div>

        <div id="status">
            Initializing AI Engine...
        </div>

        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            type="button"
            id="loginBtn"
        >
            LOGIN
        </button>

        <p class="forgot">
            Forgot Password?
        </p>

        <div class="footer">
            © 2026 APEX Predict AI
        </div>

    </div>

</div>


<script>
(function () {

    "use strict";

    const loginButton =
        document.getElementById("loginBtn");

    const username =
        document.getElementById("username");

    const password =
        document.getElementById("password");

    const status =
        document.getElementById("status");


    if (!loginButton || !username || !password) {

        console.error(
            "APEX Predict AI: Login elements were not found."
        );

        return;
    }


    loginButton.addEventListener(
        "click",
        function () {

            const usernameValue =
                username.value.trim();

            const passwordValue =
                password.value.trim();


            if (
                usernameValue === "" ||
                passwordValue === ""
            ) {

                status.textContent =
                    "⚠️ Please enter your username and password.";

                status.style.color =
                    "#ffd54f";

                return;
            }


            status.textContent =
                "✅ Welcome to APEX Predict AI";

            status.style.color =
                "#00c853";


            loginButton.disabled = true;

            loginButton.textContent =
                "LOADING...";


            setTimeout(function () {

                window.location.href =
                    "./dashboard.html";

            }, 500);

        }
    );


    username.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                loginButton.click();

            }

        }
    );


    password.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                loginButton.click();

            }

        }
    );


    if (status) {

        status.textContent =
            "APEX AI Engine Ready";

    }


    console.log(
        "APEX Predict AI Login Interface Ready."
    );

})();
</script>

</body>
</html>
