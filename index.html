<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX Predict AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <div class="login-container">

    <div class="logo">
      ⚽
    </div>

    <h1>APEX Predict AI</h1>

    <p class="subtitle">
      Professional Football Prediction Platform
    </p>

    <div class="version">
      Version 2.1 XL
    </div>

    <div id="status">
      Initializing AI Engine...
    </div>

    <input
      type="text"
      id="username"
      placeholder="Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="loginBtn" onclick="login()">
      LOGIN
    </button>

    <p class="forgot">
      Forgot Password?
    </p>

    <div class="footer">
      © 2026 APEX Predict AI
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
