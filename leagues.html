<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Leagues</title>

<link rel="stylesheet" href="styles.css">

<style>

/* =========================================================
   APEX LEAGUES — FINAL UI
   ========================================================= */

.league-page-header{
    margin-bottom:20px;
}

.league-page-header h1{
    margin:0 0 6px;
    font-size:28px;
}

.league-page-header p{
    margin:0;
    color:#aebccc;
}


/* STATUS */

.league-status{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    border-radius:14px;
    padding:13px;
    text-align:center;
    color:#dce6f2;
    font-weight:bold;
    margin-bottom:20px;
}


/* SUMMARY */

.league-overview{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.overview-card{
    background:
        linear-gradient(
            145deg,
            rgba(20,36,55,.95),
            rgba(9,21,34,.95)
        );

    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:18px 12px;
    text-align:center;
    box-shadow:
        0 10px 25px rgba(0,0,0,.22);

    position:relative;
    overflow:hidden;
}

.overview-card::after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:3px;
    background:#00d26a;
}

.overview-number{
    color:#00d26a;
    font-size:27px;
    font-weight:800;
}

.overview-label{
    color:#aebccc;
    font-size:12px;
    margin-top:5px;
}


/* MAIN PANEL */

.league-panel{
    background:
        linear-gradient(
            145deg,
            rgba(17,32,49,.98),
            rgba(7,18,30,.98)
        );

    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:20px;

    box-shadow:
        0 14px 35px rgba(0,0,0,.28);
}

.league-panel-title{
    display:flex;
    align-items:center;
    gap:10px;

    margin-bottom:5px;
}

.league-panel-title h2{
    margin:0;
    font-size:20px;
    color:#ffffff;
}

.league-panel-subtitle{
    color:#93a4b7;
    font-size:13px;
    margin-bottom:20px;
}


/* LEAGUE GRID */

.league-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(230px,1fr));

    gap:14px;
}


/* LEAGUE CARD */

.league-card{
    background:
        linear-gradient(
            145deg,
            rgba(26,43,61,.98),
            rgba(12,26,41,.98)
        );

    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;

    padding:18px;

    transition:
        transform .2s ease,
        border-color .2s ease;

    position:relative;
    overflow:hidden;
}

.league-card:hover{
    transform:translateY(-2px);
    border-color:
        rgba(0,210,106,.45);
}

.league-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:#00d26a;
}

.league-number{
    color:#6f8194;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:10px;
}

.league-name{
    color:#ffffff;
    font-size:18px;
    font-weight:700;
    line-height:1.3;
    margin-bottom:15px;
}

.league-stat-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:9px 0;

    border-top:
        1px solid rgba(255,255,255,.07);

    color:#aebccc;
    font-size:13px;
}

.league-stat-value{
    color:#ffffff;
    font-weight:700;
}

.league-stat-value.green{
    color:#00d26a;
}


/* EMPTY / ERROR */

.empty-box{
    background:
        linear-gradient(
            145deg,
            rgba(17,32,49,.98),
            rgba(7,18,30,.98)
        );

    border:1px solid rgba(255,255,255,.08);
    color:#dce6f2;

    padding:30px 20px;
    border-radius:18px;
    text-align:center;
}

.empty-box h2{
    color:#ffffff;
}

.error-box{
    background:#32171b;
    border:1px solid #6d292f;
    color:#ffb4ab;
    padding:25px;
    border-radius:18px;
    text-align:center;
}


/* NAVIGATION */

.navigation{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

    margin-top:22px;
    padding-bottom:30px;
}

.navigation button{
    margin-top:0;
}


/* MOBILE */

@media(max-width:600px){

    .league-page-header h1{
        font-size:24px;
    }

    .league-overview{
        grid-template-columns:
            repeat(3,1fr);

        gap:8px;
    }

    .overview-card{
        padding:14px 6px;
    }

    .overview-number{
        font-size:23px;
    }

    .overview-label{
        font-size:10px;
    }

    .league-panel{
        padding:15px;
    }

    .league-grid{
        grid-template-columns:1fr;
    }

}


/* VERY SMALL PHONES */

@media(max-width:360px){

    .league-overview{
        grid-template-columns:1fr;
    }

    .overview-card{
        padding:15px;
    }

    .overview-number{
        font-size:25px;
    }

}

</style>

</head>


<body>

<div class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="league-page-header">

        <h1>🏆 Football Leagues</h1>

        <p>
            APEX AI — Final Selection Overview
        </p>

    </div>


    <!-- =====================================================
         CONNECTION STATUS
         ===================================================== -->

    <div
        id="leagueStatus"
        class="league-status"
    >

        🔄 Connecting to APEX AI...

    </div>


    <!-- =====================================================
         CONTENT
         ===================================================== -->

    <div id="leagueContainer">

        <div class="empty-box">

            🔄 Loading selected leagues...

        </div>

    </div>


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <div class="navigation">

        <button onclick="go('dashboard.html')">
            🏠 Dashboard
        </button>

        <button onclick="go('predictions.html')">
            🤖 Predictions
        </button>

        <button onclick="go('analysis.html')">
            📊 Analysis
        </button>

        <button onclick="go('statistics.html')">
            📈 Statistics
        </button>

        <button onclick="go('livescores.html')">
            ⚽ Live Scores
        </button>

        <button onclick="go('headtohead.html')">
            ⚔ Head To Head
        </button>

        <button onclick="go('settings.html')">
            ⚙ Settings
        </button>

    </div>


</div>


<script>

"use strict";


/* =========================================================
   APEX GOOGLE SHEETS API
   ========================================================= */

const APEX_GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   FLEXIBLE VALUE READER
   ========================================================= */

function getValue(match,names){

    for(const name of names){

        const key =
            Object.keys(match).find(
                function(existingKey){

                    return existingKey
                        .trim()
                        .toLowerCase()
                        ===
                        name
                            .trim()
                            .toLowerCase();

                }
            );


        if(key !== undefined){

            const value =
                match[key];


            if(
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            ){

                return value;

            }

        }

    }

    return "";

}


/* =========================================================
   LOAD LEAGUES
   ========================================================= */

async function loadLeagues(){

    const status =
        document.getElementById(
            "leagueStatus"
        );


    const container =
        document.getElementById(
            "leagueContainer"
        );


    try{

        status.textContent =
            "🔄 Connecting to APEX AI...";


        const response =
            await fetch(
                APEX_GOOGLE_SHEETS_API,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !data.matchDatabase ||
            !Array.isArray(
                data.matchDatabase.objects
            )
        ){

            throw new Error(
                "APEX Match Database was not returned."
            );

        }


        const allMatches =
            data.matchDatabase.objects;


        /* =================================================
           FIND COMPLETED PREDICTIONS
           ================================================= */

        const completedMatches =
            allMatches.filter(
                function(match){

                    const prediction =
                        getValue(
                            match,
                            [
                                "Prediction",
                                "prediction",
                                "AI Prediction"
                            ]
                        );


                    const confidence =
                        getValue(
                            match,
                            [
                                "Confidence %",
                                "Confidence",
                                "confidence %",
                                "Final Confidence"
                            ]
                        );


                    const market =
                        getValue(
                            match,
                            [
                                "Recommended Market",
                                "recommended market",
                                "Market"
                            ]
                        );


                    return(
                        prediction !== "" ||
                        confidence !== "" ||
                        market !== ""
                    );

                }
            );


        /* =================================================
           FINAL 10
           ================================================= */

        const final10 =
            completedMatches
                .slice()
                .reverse()
                .slice(0,10);


        /* =================================================
           BUILD LEAGUE MAP
           ================================================= */

        const leagueMap =
            new Map();


        final10.forEach(
            function(match){

                const league =
                    String(
                        getValue(
                            match,
                            [
                                "League",
                                "league"
                            ]
                        )
                    ).trim();


                if(!league){

                    return;

                }


                if(!leagueMap.has(league)){

                    leagueMap.set(
                        league,
                        {
                            name:league,
                            matches:0,
                            teams:new Set()
                        }
                    );

                }


                const leagueData =
                    leagueMap.get(league);


                leagueData.matches++;


                const home =
                    String(
                        getValue(
                            match,
                            [
                                "Home Team",
                                "HomeTeam",
                                "Home"
                            ]
                        )
                    ).trim();


                const away =
                    String(
                        getValue(
                            match,
                            [
                                "Away Team",
                                "AwayTeam",
                                "Away"
                            ]
                        )
                    ).trim();


                if(home){

                    leagueData.teams.add(home);

                }


                if(away){

                    leagueData.teams.add(away);

                }

            }
        );


        const leagues =
            Array.from(
                leagueMap.values()
            )
            .sort(
                function(a,b){

                    return a.name.localeCompare(
                        b.name
                    );

                }
            );


        /* =================================================
           SUMMARY VALUES
           ================================================= */

        const totalMatches =
            final10.length;


        const totalLeagues =
            leagues.length;


        const totalTeams =
            new Set(
                final10.flatMap(
                    function(match){

                        return [

                            String(
                                getValue(
                                    match,
                                    [
                                        "Home Team",
                                        "HomeTeam",
                                        "Home"
                                    ]
                                )
                            ).trim(),

                            String(
                                getValue(
                                    match,
                                    [
                                        "Away Team",
                                        "AwayTeam",
                                        "Away"
                                    ]
                                )
                            ).trim()

                        ];

                    }
                )
            );


        status.textContent =
            "✅ APEX AI Connected — " +
            totalMatches +
            " selected matches";


        if(!leagues.length){

            container.innerHTML = `

                <div class="empty-box">

                    <h2>
                        🏆 No Selected League Data
                    </h2>

                    <p>
                        The final APEX selections do not
                        currently contain league information.
                    </p>

                </div>

            `;

            return;

        }


        /* =================================================
           BUILD FINAL UI
           ================================================= */

        let html = `

            <div class="league-overview">

                <div class="overview-card">

                    <div class="overview-number">
                        ${totalMatches}
                    </div>

                    <div class="overview-label">
                        SELECTED MATCHES
                    </div>

                </div>


                <div class="overview-card">

                    <div class="overview-number">
                        ${totalLeagues}
                    </div>

                    <div class="overview-label">
                        LEAGUES
                    </div>

                </div>


                <div class="overview-card">

                    <div class="overview-number">
                        ${totalTeams.size}
                    </div>

                    <div class="overview-label">
                        TEAMS
                    </div>

                </div>

            </div>


            <div class="league-panel">

                <div class="league-panel-title">

                    <span>🏆</span>

                    <h2>
                        Selected Leagues
                    </h2>

                </div>


                <div class="league-panel-subtitle">

                    Leagues represented across the
                    final APEX AI selections.

                </div>


                <div class="league-grid">

        `;


        /* =================================================
           LEAGUE CARDS
           ================================================= */

        leagues.forEach(
            function(league,index){

                html += `

                    <div class="league-card">

                        <div class="league-number">

                            LEAGUE ${index + 1}

                        </div>


                        <div class="league-name">

                            🏆
                            ${escapeHTML(
                                league.name
                            )}

                        </div>


                        <div class="league-stat-row">

                            <span>
                                Selected matches
                            </span>

                            <span class="league-stat-value green">

                                ${league.matches}

                            </span>

                        </div>


                        <div class="league-stat-row">

                            <span>
                                Teams represented
                            </span>

                            <span class="league-stat-value">

                                ${league.teams.size}

                            </span>

                        </div>

                    </div>

                `;

            }
        );


        html += `

                </div>

            </div>

        `;


        container.innerHTML =
            html;


    }catch(error){

        console.error(
            "APEX Leagues Error:",
            error
        );


        status.textContent =
            "❌ APEX Leagues failed to load";


        container.innerHTML = `

            <div class="error-box">

                <h2>
                    ❌ Unable to Load Leagues
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function go(page){

    window.location.href =
        page;

}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadLeagues
);

</script>


</body>

</html>
