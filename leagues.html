:root{

*{

}

html,

body{

/* =========================================================

.league-card{

    overflow:hidden;

    border-radius:15px;

}

.league-card::before{

    bottom:0;

}

.league-number{

    color:#6f8194;

    font-weight:800;

}

.league-name{

    color:#ffffff;

    font-weight:800;

    margin-bottom:14px;
}

.league-stat-row{

    display:flex;

    justify-content:space-between;

}

.league-stat-value{

    color:#ffffff;

}

.league-stat-value.green{

}


/* =========================================================
   STATES

.empty-box{

        linear-gradient(

            rgba(13,28,45,.98),

    border-radius:18px;

}

}

.error-box{

    background:

    border:
        1px solid

    color:#ffb4ab;

/* =========================================================
   NAVIGATION
   ========================================================= */

.navigation{

    display:grid;

    gap:9px;

    margin-top:18px;

}

.navigation button{

    min-height:48px;

    border:
        1px solid

    border-radius:12px;

    background:
        #0d1c2d;

    color:#e8edf3;

    font-size:11px;

    font-weight:700;

    cursor:pointer;
}

.navigation button:hover{

/* =========================================================

    .app{

        display:none;

    .league-overview{

    }

    .overview-card{

    .overview-number{

    }

        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:380px){

    .league-overview{
        grid-template-columns:1fr;
    }
}

<script>

"use strict";


/* =========================================================
   CURRENT VERIFIED APEX BACKEND
   ========================================================= */

const APEX_GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxygAHM7CTxHK5SXXCoc7AyfhivumaYJDKSYv5OFdI_woZdSnpVgBM400W8Gkny1Y8I/exec";


const MAX_MATCHES = 30;

const TIMEOUT = 45000;

const RETRIES = 2;


/* =========================================================
   SAFE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   KEY NORMALISATION
   ========================================================= */

function normaliseKey(value){

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


/* =========================================================
   FLEXIBLE READER
   ========================================================= */

function getValue(
    object,
    names
){

    if(
        !object ||
        typeof object !== "object"
    ){

        return "";
    }

    const keys =
        Object.keys(
            object
        );


    for(
        const wantedName of names
    ){

        const wanted =
            normaliseKey(
                wantedName
            );


        const found =
            keys.find(
                function(existingKey){

                    return(
                        normaliseKey(
                            existingKey
                        )
                        ===
                        wanted
                    );

                }
            );


        if(
            found !== undefined
        ){

            const value =
                object[found];


            if(
                value !== null &&
                value !== undefined &&
                String(
                    value
                ).trim() !== ""
            ){

                return value;
            }
        }
    }


    return "";

}


/* =========================================================
   MATCH FIELDS
   ========================================================= */

function getFixtureId(match){

    return getValue(
        match,
        [
            "Fixture ID",
            "API Fixture ID",
            "fixture_id",
            "fixtureId",
            "Fixture"
        ]
    );

}


function getDate(match){

    return getValue(
        match,
        [
            "Date",
            "Match Date",
            "Fixture Date",
            "date"
        ]
    );

}


function getHome(match){

    return getValue(
        match,
        [
            "Home Team",
            "HomeTeam",
            "Home",
            "Team Home"
        ]
    );

}


function getAway(match){

    return getValue(
        match,
        [
            "Away Team",
            "AwayTeam",
            "Away",
            "Team Away"
        ]
    );

}


function getLeague(match){

    return getValue(
        match,
        [
            "League",
            "Competition",
            "League Name",
            "Tournament"
        ]
    );

}


function getPrediction(match){

    return getValue(
        match,
        [
            "Prediction",
            "AI Prediction",
            "Prediction Advice",
            "Advice"
        ]
    );

}


function getConfidence(match){

    const value =
        getValue(
            match,
            [
                "Final Confidence",
                "Final confidence",
                "Final Confidence %",
                "Final confidence %",
                "Confidence %",
                "Confidence",
                "AI Confidence"
            ]
        );


    if(
        value === "" ||
        value === null ||
        value === undefined
    ){

        return null;
    }


    const parsed =
        parseFloat(
            String(
                value
            )
            .replace("%","")
            .replace(",",".")
            .trim()
        );


    return Number.isFinite(
        parsed
    )
        ? parsed
        : null;

}


/* =========================================================
   RESPONSE EXTRACTION
   ========================================================= */

function extractMatches(data){

    /*
     * Current APEX backend response:
     *
     * {
     *   status:"SUCCESS",
     *   matches:[ ... ]
     * }
     *
     * Current matches[] is checked first.
     */

    if(
        data &&
        Array.isArray(
            data.matches
        )
    ){

        return data.matches;
    }


    /* Compatibility */

    if(
        data &&
        data.smartGate &&
        Array.isArray(
            data.smartGate.objects
        )
    ){

        return data.smartGate.objects;
    }


    if(
        data &&
        Array.isArray(
            data.smartGate
        )
    ){

        return data.smartGate;
    }


    if(
        data &&
        data.matchDatabase &&
        Array.isArray(
            data.matchDatabase.objects
        )
    ){

        return data.matchDatabase.objects;
    }


    if(
        data &&
        Array.isArray(
            data.data
        )
    ){

        return data.data;
    }


    return [];

}


/* =========================================================
   VALID MATCH
   ========================================================= */

function isValidMatch(match){

    return(
        String(
            getHome(match)
        ).trim() !== ""
        &&
        String(
            getAway(match)
        ).trim() !== ""
    );

}


/* =========================================================
   DEDUPLICATE + LIMIT
   ========================================================= */

function prepareMatches(
    source
){

    const matches =
        Array.isArray(source)
            ? source
            : [];


    const seen =
        new Set();


    const result =
        [];


    matches.forEach(
        function(
            match,
            index
        ){

            if(
                !isValidMatch(
                    match
                )
            ){

                return;
            }


            const fixture =
                String(
                    getFixtureId(
                        match
                    )
                ).trim();


            let identity;


            if(
                fixture !== ""
            ){

                identity =
                    "fixture:" +
                    normaliseKey(
                        fixture
                    );

            }else{

                identity =
                    [
                        getDate(match),
                        getHome(match),
                        getAway(match),
                        getLeague(match)
                    ]
                    .map(
                        normaliseKey
                    )
                    .join("|");

            }


            if(
                identity === "|||"
            ){

                identity =
                    "row:" +
                    index;
            }


            if(
                seen.has(
                    identity
                )
            ){

                return;
            }


            seen.add(
                identity
            );


            result.push(
                match
            );

        }
    );


    result.sort(
        function(
            a,
            b
        ){

            return(
                (
                    getConfidence(b)
                    ?? -1
                )
                -
                (
                    getConfidence(a)
                    ?? -1
                )
            );

        }
    );


    return result.slice(
        0,
        MAX_MATCHES
    );

}


/* =========================================================
   BACKEND REQUEST
   ========================================================= */

async function fetchAPEXData(){

    const controller =
        new AbortController();


    const timer =
        setTimeout(
            function(){

                controller.abort();

            },
            TIMEOUT
        );


    try{

        const url =
            APEX_GOOGLE_SHEETS_API +
            "?request=dashboard" +
            "&limit=" +
            MAX_MATCHES +
            "&ts=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store",
                    redirect:"follow",
                    signal:
                        controller.signal
                }
            );


        const raw =
            await response.text();


        if(
            !response.ok
        ){

            throw new Error(
                "APEX backend HTTP " +
                response.status
            );
        }


        if(
            !raw.trim()
        ){

            throw new Error(
                "APEX backend returned an empty response."
            );
        }


        let data;


        try{

            data =
                JSON.parse(
                    raw
                );

        }catch(error){

            console.error(
                "APEX Leagues raw response:",
                raw
            );


            throw new Error(
                "APEX backend returned invalid JSON."
            );

        }


        if(
            data &&
            String(
                data.status
            ).toUpperCase()
            ===
            "ERROR"
        ){

            throw new Error(
                data.message ||
                "APEX backend returned an error."
            );
        }


        return data;


    }catch(error){

        if(
            error.name ===
            "AbortError"
        ){

            throw new Error(
                "APEX backend request timed out."
            );
        }


        throw error;


    }finally{

        clearTimeout(
            timer
        );

    }

}


/* =========================================================
   RETRY
   ========================================================= */

async function loadAPEXData(){

    let lastError =
        null;


    for(
        let attempt = 0;

        attempt <= RETRIES;

        attempt++
    ){

        try{

            return await fetchAPEXData();

        }catch(error){

            lastError =
                error;


            if(
                attempt <
                RETRIES
            ){

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            1000
                        )
                );

            }

        }

    }


    throw(
        lastError ||
        new Error(
            "Unable to connect to APEX backend."
        )
    );

}


/* =========================================================
   LOAD LEAGUES
   ========================================================= */

async function loadLeagues(){

    const status =
        document.getElementById(
            "leagueStatus"
        );


    const container =
        document.getElementById(
            "leagueContainer"
        );


    try{

        status.textContent =
            "🔄 Connecting to current APEX backend...";


        const data =
            await loadAPEXData();


        const source =
            extractMatches(
                data
            );


        const matches =
            prepareMatches(
                source
            );


        /*
         * Build league map from exactly
         * the same 30-match frontend selection.
         */

        const leagueMap =
            new Map();


        const teamSet =
            new Set();


        matches.forEach(
            function(match){

                const league =
                    String(
                        getLeague(
                            match
                        )
                    ).trim();


                const home =
                    String(
                        getHome(
                            match
                        )
                    ).trim();


                const away =
                    String(
                        getAway(
                            match
                        )
                    ).trim();


                if(
                    home
                ){

                    teamSet.add(
                        home
                    );
                }


                if(
                    away
                ){

                    teamSet.add(
                        away
                    );
                }


                if(
                    !league
                ){

                    return;
                }


                if(
                    !leagueMap.has(
                        league
                    )
                ){

                    leagueMap.set(
                        league,
                        {
                            name:league,
                            matches:0,
                            teams:new Set(),
                            confidence:[]
                        }
                    );

                }


                const item =
                    leagueMap.get(
                        league
                    );


                item.matches++;


                if(
                    home
                ){

                    item.teams.add(
                        home
                    );
                }


                if(
                    away
                ){

                    item.teams.add(
                        away
                    );
                }


                const confidence =
                    getConfidence(
                        match
                    );


                if(
                    confidence !== null
                ){

                    item.confidence.push(
                        confidence
                    );
                }

            }
        );


        const leagues =
            Array.from(
                leagueMap.values()
            )
            .sort(
                function(
                    a,
                    b
                ){

                    return(
                        b.matches -
                        a.matches
                    );

                }
            );


        status.textContent =
            "✅ APEX AI Connected · " +
            matches.length +
            " selected matches";


        if(
            !leagues.length
        ){

            container.innerHTML = `

                <div class="empty-box">

                    <h2>
                        🏆 No League Data
                    </h2>

                    <p>
                        The current APEX selections
                        do not contain league information.
                    </p>

                </div>

            `;

            return;
        }


        let html = `

            <div class="league-overview">


                <div class="overview-card">

                    <div class="overview-number">
                        ${matches.length}
                    </div>

                    <div class="overview-label">
                        SELECTED MATCHES
                    </div>

                </div>


                <div class="overview-card">

                    <div class="overview-number">
                        ${leagues.length}
                    </div>

                    <div class="overview-label">
                        LEAGUES
                    </div>

                </div>


                <div class="overview-card">

                    <div class="overview-number">
                        ${teamSet.size}
                    </div>

                    <div class="overview-label">
                        TEAMS
                    </div>

                </div>


            </div>


            <div class="league-panel">


                <div class="league-panel-title">

                    <span>
                        🏆
                    </span>

                    <h2>
                        Selected Leagues
                    </h2>

                </div>


                <div class="league-panel-subtitle">

                    Leagues represented across the
                    current APEX Smart Gate selections.

                </div>


                <div class="league-grid">

        `;


        leagues.forEach(
            function(
                league,
                index
            ){

                const avgConfidence =
                    league.confidence.length
                        ? (
                            league.confidence.reduce(
                                function(
                                    total,
                                    value
                                ){

                                    return total + value;

                                },
                                0
                            )
                            /
                            league.confidence.length
                        ).toFixed(1)
                        : "—";


                html += `

                    <div class="league-card">


                        <div class="league-number">

                            LEAGUE ${index + 1}

                        </div>


                        <div class="league-name">

                            🏆 ${escapeHTML(
                                league.name
                            )}

                        </div>


                        <div class="league-stat-row">

                            <span>
                                Selected matches
                            </span>

                            <span
                                class="
                                    league-stat-value
                                    green
                                "
                            >

                                ${league.matches}

                            </span>

                        </div>


                        <div class="league-stat-row">

                            <span>
                                Teams represented
                            </span>

                            <span class="league-stat-value">

                                ${league.teams.size}

                            </span>

                        </div>


                        <div class="league-stat-row">

                            <span>
                                Average confidence
                            </span>

                            <span class="league-stat-value green">

                                ${
                                    avgConfidence === "—"
                                        ? "—"
                                        : escapeHTML(
                                            avgConfidence
                                        ) + "%"
                                }

                            </span>

                        </div>


                    </div>

                `;

            }
        );


        html += `

                </div>

            </div>

        `;


        container.innerHTML =
            html;


    }catch(error){

        console.error(
            "APEX Leagues Error:",
            error
        );


        status.className =
            "status error";


        status.textContent =
            "❌ APEX Leagues failed to load";


        container.innerHTML = `

            <div class="error-box">

                <h2>
                    ❌ Unable to Load Leagues
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


/* =========================================================
   GLOBAL
   ========================================================= */

window.go =
    go;

window.loadLeagues =
    loadLeagues;


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadLeagues
);

</script>

</body>
