<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supported Leagues - APEX Predict AI</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#081b33;
color:white;
font-family:Arial,sans-serif;
margin:0;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:#102847;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.card h3{
color:#00ff88;
margin-bottom:10px;
}

.back{
display:inline-block;
margin-top:25px;
padding:12px 20px;
background:#00c853;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🏆 Supported Football Leagues</h1>

<div class="grid">

<div class="card">
<h3>Premier League</h3>
<p>England</p>
</div>

<div class="card">
<h3>La Liga</h3>
<p>Spain</p>
</div>

<div class="card">
<h3>Serie A</h3>
<p>Italy</p>
</div>

<div class="card">
<h3>Bundesliga</h3>
<p>Germany</p>
</div>

<div class="card">
<h3>Ligue 1</h3>
<p>France</p>
</div>

<div class="card">
<h3>PSL</h3>
<p>South Africa</p>
</div>

<div class="card">
<h3>UEFA Champions League</h3>
<p>Europe</p>
</div>

<div class="card">
<h3>CAF Champions League</h3>
<p>Africa</p>
</div>

</div>

<a href="dashboard.html" class="back">
⬅ Back to Dashboard
</a>

</div>

</body>
</html>
