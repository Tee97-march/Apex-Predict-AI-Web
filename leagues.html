<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Football Leagues</title>

<link rel="stylesheet" href="styles.css">

<style>

.league-header {
    text-align: center;
    margin-bottom: 20px;
}

.league-header h1 {
    margin-bottom: 8px;
}

.league-header p {
    color: #cfd8e3;
}

.league-status {
    text-align: center;
    margin: 15px 0 20px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    font-weight: bold;
}

.league-summary {
    background: #ffffff;
    color: #111;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 12px 35px rgba(0,0,0,.25);
}

.league-summary h2 {
    color: #061326;
    margin-top: 0;
}

.league-summary p {
    color: #333;
}

.league-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.league-card {
    background: #f7f8fa;
    border: 1px solid #e5e5e5;
    border-radius: 15px;
    padding: 18px;
}

.league-card h3 {
    color: #061326;
    margin: 0 0 10px;
}

.league-number {
    font-size: 13px;
    color: #777;
    font-weight: bold;
    margin-bottom: 8px;
}

.league-count {
    color: #444;
    font-size: 15px;
}

.empty-box,
.error-box {
    background: #ffffff;
    color: #222;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
}

.error-box {
    background: #3a1515;
    color: #ffb4ab;
}

.navigation {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 25px;
    padding-bottom: 30px;
}

.navigation button {
    margin-top: 0;
}

@media(max-width: 500px) {

    .league-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="league-header">

        <h1>🏆 Football Leagues</h1>

        <p>
            Leagues represented by the final APEX selections
        </p>

    </div>


    <div id="leagueStatus"
         class="league-status">

        🔄 Connecting to APEX AI...

    </div>


    <div id="leagueContainer">

        <div class="empty-box">

            🔄 Loading selected leagues...

        </div>

    </div>


    <div class="navigation">

        <button onclick="go('dashboard.html')">
            🏠 Dashboard
        </button>

        <button onclick="go('predictions.html')">
            🤖 Predictions
        </button>

        <button onclick="go('analysis.html')">
            📊 Analysis
        </button>

        <button onclick="go('statistics.html')">
            📈 Statistics
        </button>

        <button onclick="go('livescores.html')">
            ⚽ Live Scores
        </button>

        <button onclick="go('headtohead.html')">
            ⚔ Head To Head
        </button>

        <button onclick="go('settings.html')">
            ⚙ Settings
        </button>

    </div>

</div>


<script>

"use strict";


const APEX_GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function getValue(match, names) {

    for (const name of names) {

        const key =
            Object.keys(match).find(function(existingKey) {

                return existingKey
                    .trim()
                    .toLowerCase()
                    ===
                    name
                        .trim()
                        .toLowerCase();

            });

        if (key !== undefined) {

            const value = match[key];

            if (
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            ) {

                return value;

            }

        }

    }

    return "";

}


async function loadLeagues() {

    const status =
        document.getElementById("leagueStatus");

    const container =
        document.getElementById("leagueContainer");


    try {

        status.textContent =
            "🔄 Connecting to APEX AI...";


        const response =
            await fetch(
                APEX_GOOGLE_SHEETS_API,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            !data.matchDatabase ||
            !Array.isArray(
                data.matchDatabase.objects
            )
        ) {

            throw new Error(
                "APEX Match Database was not returned."
            );

        }


        const allMatches =
            data.matchDatabase.objects;


        /*
         * Same completed-prediction rule used
         * by Predictions and Analysis.
         */

        const completedMatches =
            allMatches.filter(function(match) {

                const prediction =
                    getValue(
                        match,
                        [
                            "Prediction",
                            "prediction",
                            "AI Prediction"
                        ]
                    );

                const confidence =
                    getValue(
                        match,
                        [
                            "Confidence %",
                            "Confidence",
                            "confidence %",
                            "Final Confidence"
                        ]
                    );

                const market =
                    getValue(
                        match,
                        [
                            "Recommended Market",
                            "recommended market",
                            "Market"
                        ]
                    );

                return (
                    prediction !== "" ||
                    confidence !== "" ||
                    market !== ""
                );

            });


        /*
         * Same final-display approach as the
         * working Predictions page.
         */

        const final10 =
            completedMatches
                .slice()
                .reverse()
                .slice(0, 10);


        const leagueMap =
            new Map();


        final10.forEach(function(match) {

            const league =
                String(
                    getValue(
                        match,
                        ["League", "league"]
                    )
                ).trim();


            if (!league) {
                return;
            }


            if (!leagueMap.has(league)) {

                leagueMap.set(
                    league,
                    {
                        name: league,
                        matches: 0,
                        teams: new Set()
                    }
                );

            }


            const leagueData =
                leagueMap.get(league);


            leagueData.matches++;


            const home =
                String(
                    getValue(
                        match,
                        [
                            "Home Team",
                            "HomeTeam",
                            "Home"
                        ]
                    )
                ).trim();


            const away =
                String(
                    getValue(
                        match,
                        [
                            "Away Team",
                            "AwayTeam",
                            "Away"
                        ]
                    )
                ).trim();


            if (home) {

                leagueData.teams.add(home);

            }


            if (away) {

                leagueData.teams.add(away);

            }

        });


        const leagues =
            Array.from(
                leagueMap.values()
            ).sort(function(a, b) {

                return a.name.localeCompare(
                    b.name
                );

            });


        status.textContent =
            "✅ APEX AI Connected — " +
            final10.length +
            " selected matches";


        if (!leagues.length) {

            container.innerHTML = `

                <div class="empty-box">

                    <h2>
                        🏆 No Selected League Data
                    </h2>

                    <p>
                        The final APEX selections do not
                        currently contain league information.
                    </p>

                </div>

            `;

            return;

        }


        let html = `

            <div class="league-summary">

                <h2>
                    🏆 Selected Match Leagues
                </h2>

                <p>
                    Showing league information for the
                    <strong>
                        ${final10.length}
                    </strong>
                    final APEX matches.
                </p>

                <div class="league-grid">

        `;


        leagues.forEach(function(league, index) {

            html += `

                <div class="league-card">

                    <div class="league-number">
                        LEAGUE ${index + 1}
                    </div>

                    <h3>
                        🏆 ${escapeHTML(league.name)}
                    </h3>

                    <div class="league-count">
                        Matches selected:
                        <strong>
                            ${league.matches}
                        </strong>
                    </div>

                    <div class="league-count"
                         style="margin-top:6px;">

                        Teams represented:
                        <strong>
                            ${league.teams.size}
                        </strong>

                    </div>

                </div>

            `;

        });


        html += `

                </div>

            </div>

        `;


        container.innerHTML =
            html;


    } catch (error) {

        console.error(
            "APEX Leagues Error:",
            error
        );


        status.textContent =
            "❌ APEX Leagues failed to load";


        container.innerHTML = `

            <div class="error-box">

                <h2>
                    ❌ Unable to Load Leagues
                </h2>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}


function go(page) {

    window.location.href = page;

}


document.addEventListener(
    "DOMContentLoaded",
    loadLeagues
);

</script>

</body>

</html>
