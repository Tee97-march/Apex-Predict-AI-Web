<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Live Scores</title>

<link rel="stylesheet" href="styles.css">

<style>

.live-header{
    text-align:center;
    margin-bottom:20px;
}

.live-header h1{
    margin-bottom:8px;
}

.live-header p{
    color:#cfd8e3;
}

.live-status{
    text-align:center;
    margin:15px 0 20px;
    padding:14px;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    font-weight:bold;
}

.live-summary{
    background:#ffffff;
    color:#111;
    padding:22px;
    border-radius:18px;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.live-summary h2{
    color:#061326;
    margin-top:0;
}

.live-summary p{
    color:#333;
}

.live-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    margin-top:20px;
}

.live-card{
    background:#fafafa;
    border:1px solid #e5e5e5;
    border-radius:15px;
    padding:18px;
}

.live-league{
    color:#061326;
    font-weight:bold;
    margin-bottom:12px;
}

.live-status-badge{
    display:inline-block;
    background:#00a843;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.live-teams{
    background:#ffffff;
    border:1px solid #eeeeee;
    border-radius:10px;
    padding:18px;
    text-align:center;
}

.live-team{
    color:#061326;
    font-size:18px;
    font-weight:bold;
}

.live-vs{
    color:#777;
    margin:10px 0;
}

.live-score{
    margin-top:12px;
    color:#00a843;
    font-size:25px;
    font-weight:bold;
}

.live-details{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.live-detail{
    background:#ffffff;
    border:1px solid #dddddd;
    border-radius:8px;
    padding:10px;
}

.live-detail-label{
    font-size:12px;
    color:#777;
    margin-bottom:4px;
}

.empty-box,
.error-box{
    background:#ffffff;
    color:#222;
    padding:25px;
    border-radius:18px;
    text-align:center;
}

.error-box{
    background:#3a1515;
    color:#ffb4ab;
}

.navigation{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:25px;
    padding-bottom:30px;
}

.navigation button{
    margin-top:0;
}

@media(max-width:500px){

    .live-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="live-header">

        <h1>⚽ Live Scores</h1>

        <p>
            APEX Predict AI Match Centre
        </p>

    </div>


    <div id="liveScoreStatus"
         class="live-status">

        🔄 Connecting to APEX AI...

    </div>


    <div id="liveScoresContainer">

        <div class="empty-box">

            🔄 Loading selected matches...

        </div>

    </div>


    <div class="navigation">

        <button onclick="go('dashboard.html')">
            🏠 Dashboard
        </button>

        <button onclick="go('predictions.html')">
            🤖 Predictions
        </button>

        <button onclick="go('analysis.html')">
            📊 Analysis
        </button>

        <button onclick="go('statistics.html')">
            📈 Statistics
        </button>

        <button onclick="go('leagues.html')">
            🏆 Leagues
        </button>

        <button onclick="go('headtohead.html')">
            ⚔ Head To Head
        </button>

        <button onclick="go('settings.html')">
            ⚙ Settings
        </button>

    </div>


</div>


<script>

"use strict";


const APEX_GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


function safe(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getValue(match,names){

    for(const wanted of names){

        const key =
            Object.keys(match).find(function(existingKey){

                return existingKey
                    .trim()
                    .toLowerCase()
                    ===
                    wanted
                        .trim()
                        .toLowerCase();

            });

        if(key !== undefined){

            const value =
                match[key];

            if(
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            ){

                return value;

            }

        }

    }

    return "";

}


async function loadLiveScores(){

    const status =
        document.getElementById(
            "liveScoreStatus"
        );

    const container =
        document.getElementById(
            "liveScoresContainer"
        );


    try{

        status.textContent =
            "🔄 Connecting to APEX AI...";


        const response =
            await fetch(
                APEX_GOOGLE_SHEETS_API,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !data.matchDatabase ||
            !Array.isArray(
                data.matchDatabase.objects
            )
        ){

            throw new Error(
                "APEX Match Database was not returned."
            );

        }


        const allMatches =
            data.matchDatabase.objects;


        /*
         * Same lightweight selection approach
         * used by our working web pages.
         *
         * We do NOT modify Google Sheets.
         */

        const completedMatches =
            allMatches.filter(function(match){

                const prediction =
                    getValue(
                        match,
                        [
                            "Prediction",
                            "prediction",
                            "AI Prediction"
                        ]
                    );

                const confidence =
                    getValue(
                        match,
                        [
                            "Confidence %",
                            "Confidence",
                            "confidence %",
                            "Final Confidence"
                        ]
                    );

                const market =
                    getValue(
                        match,
                        [
                            "Recommended Market",
                            "recommended market",
                            "Market"
                        ]
                    );

                return (
                    prediction !== "" ||
                    confidence !== "" ||
                    market !== ""
                );

            });


        const matches =
            completedMatches
                .slice()
                .reverse()
                .slice(0,10);


        status.textContent =
            "✅ APEX AI Connected — " +
            matches.length +
            " selected matches";


        if(matches.length === 0){

            container.innerHTML = `

                <div class="empty-box">

                    <h2>
                        ⚽ No Selected Matches
                    </h2>

                    <p>
                        APEX has not produced completed
                        match records yet.
                    </p>

                </div>

            `;

            return;

        }


        let html = `

            <div class="live-summary">

                <h2>
                    ⚽ APEX MATCH CENTRE
                </h2>

                <p>
                    Showing the final
                    <strong>
                        ${matches.length}
                    </strong>
                    selected matches.
                </p>


                <div class="live-grid">

        `;


        matches.forEach(function(match,index){

            const league =
                getValue(
                    match,
                    [
                        "League",
                        "league"
                    ]
                );


            const home =
                getValue(
                    match,
                    [
                        "Home Team",
                        "HomeTeam",
                        "Home"
                    ]
                );


            const away =
                getValue(
                    match,
                    [
                        "Away Team",
                        "AwayTeam",
                        "Away"
                    ]
                );


            const date =
                getValue(
                    match,
                    [
                        "Date",
                        "Match Date",
                        "date"
                    ]
                );


            const time =
                getValue(
                    match,
                    [
                        "Time",
                        "Match Time",
                        "time"
                    ]
                );


            const homeScore =
                getValue(
                    match,
                    [
                        "Home Score",
                        "Home Goals",
                        "home score"
                    ]
                );


            const awayScore =
                getValue(
                    match,
                    [
                        "Away Score",
                        "Away Goals",
                        "away score"
                    ]
                );


            const matchStatus =
                getValue(
                    match,
                    [
                        "Status",
                        "Match Status",
                        "status"
                    ]
                ) || "Scheduled";


            html += `

                <div class="live-card">

                    <div class="live-league">

                        🏆 ${safe(
                            league || "League"
                        )}

                    </div>


                    <span class="live-status-badge">

                        ${safe(matchStatus)}

                    </span>


                    <div class="live-teams">

                        <div class="live-team">

                            ${safe(
                                home || "Home Team"
                            )}

                        </div>


                        <div class="live-vs">
                            VS
                        </div>


                        <div class="live-team">

                            ${safe(
                                away || "Away Team"
                            )}

                        </div>


                        ${
                            homeScore !== "" ||
                            awayScore !== ""
                            ?
                            `
                            <div class="live-score">

                                ${safe(homeScore || "0")}
                                -
                                ${safe(awayScore || "0")}

                            </div>
                            `
                            :
                            ""
                        }

                    </div>


                    <div class="live-details">


                        <div class="live-detail">

                            <div class="live-detail-label">
                                Date
                            </div>

                            <strong>
                                ${safe(date || "—")}
                            </strong>

                        </div>


                        <div class="live-detail">

                            <div class="live-detail-label">
                                Time
                            </div>

                            <strong>
                                ${safe(time || "—")}
                            </strong>

                        </div>


                    </div>

                </div>

            `;

        });


        html += `

                </div>

            </div>

        `;


        container.innerHTML =
            html;


    }catch(error){

        console.error(
            "APEX Live Scores Error:",
            error
        );


        status.textContent =
            "❌ APEX Live Scores failed to load";


        container.innerHTML = `

            <div class="error-box">

                <h2>
                    ❌ Unable to Load Live Scores
                </h2>

                <p>
                    ${safe(error.message)}
                </p>

            </div>

        `;

    }

}


function go(page){

    window.location.href =
        page;

}


document.addEventListener(
    "DOMContentLoaded",
    loadLiveScores
);

</script>


</body>

</html>
