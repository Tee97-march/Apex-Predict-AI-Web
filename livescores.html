<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Live Scores</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>

<div class="container">

    <h1>⚽ Live Scores</h1>

    <p>
        Football match centre powered by APEX Predict AI
    </p>


    <!-- CONNECTION STATUS -->

    <div
        id="liveScoreStatus"
        style="
            text-align:center;
            margin:15px 0 20px;
            padding:12px 15px;
            border-radius:12px;
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.12);
            color:#ffd54f;
            font-weight:bold;
        "
    >
        🔄 Connecting to Match Database...
    </div>


    <!-- LIVE SCORE CONTAINER -->

    <div
        id="liveScoresContainer"
        style="
            width:100%;
        "
    >

        <div
            style="
                background:#102847;
                padding:25px;
                border-radius:15px;
                text-align:center;
            "
        >

            ⚽ Loading football matches...

        </div>

    </div>


    <br>


    <!-- NAVIGATION -->

    <button onclick="openDashboard()">
        🏠 Dashboard
    </button>


    <button onclick="openPredictions()">
        🤖 Predictions
    </button>


    <button onclick="openAnalysis()">
        📊 Analysis
    </button>


    <button onclick="openStatistics()">
        📈 Statistics
    </button>


    <button onclick="openLeagues()">
        🏆 Leagues
    </button>


    <button onclick="openHeadToHead()">
        ⚔ Head To Head
    </button>


    <button onclick="openSettings()">
        ⚙ Settings
    </button>

</div>


<script>

"use strict";


// ========================================
// APEX PREDICT AI - LIVE SCORES
// ========================================

const APEX_GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


// ========================================
// HTML SECURITY
// ========================================

function liveEscape(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");

}


function liveValue(value){

    if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ){

        return "—";

    }

    return liveEscape(value);

}


// ========================================
// STATUS
// ========================================

function setLiveStatus(
    message,
    type
){

    const status =
        document.getElementById(
            "liveScoreStatus"
        );


    if(!status){
        return;
    }


    status.textContent =
        message;


    if(type === "success"){

        status.style.color =
            "#b9f6ca";

    }

    else if(type === "error"){

        status.style.color =
            "#ffb4ab";

    }

    else{

        status.style.color =
            "#ffd54f";

    }

}


// ========================================
// LOAD MATCH DATABASE
// ========================================

async function loadLiveScores(){

    const container =
        document.getElementById(
            "liveScoresContainer"
        );


    if(!container){
        return;
    }


    try{

        setLiveStatus(
            "🔄 Loading football matches from Google Sheets...",
            "loading"
        );


        const response =
            await fetch(
                APEX_GOOGLE_SHEETS_API,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Google Sheets HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "APEX Predict AI Live Scores data:",
            data
        );


        const matchDatabase =
            data.matchDatabase;


        if(
            !matchDatabase ||
            !matchDatabase.exists ||
            !Array.isArray(
                matchDatabase.objects
            )
        ){

            throw new Error(
                "MATCH DATABASE was not returned."
            );

        }


        const matches =
            matchDatabase.objects;


        if(matches.length === 0){

            setLiveStatus(
                "⚠️ Match Database is connected but contains no matches.",
                "loading"
            );


            container.innerHTML = `

                <div style="
                    background:#102847;
                    padding:25px;
                    border-radius:15px;
                    text-align:center;
                    color:white;
                ">

                    ⚽ No matches are currently available.

                </div>

            `;

            return;

        }


        // ========================================
        // RENDER MATCHES
        // ========================================

        container.innerHTML = `

            <div style="
                background:#ffffff;
                color:#111;
                padding:20px;
                border-radius:15px;
                box-shadow:0 12px 35px rgba(0,0,0,.25);
            ">

                <h2 style="
                    margin-top:0;
                    color:#061326;
                ">

                    ⚽ APEX MATCH CENTRE

                </h2>


                <p style="
                    color:#444;
                    margin-bottom:20px;
                ">

                    <strong>
                        ${matches.length}
                    </strong>

                    match(es) loaded from the APEX Match Database.

                </p>


                <div style="
                    display:grid;
                    grid-template-columns:
                        repeat(
                            auto-fit,
                            minmax(280px,1fr)
                        );
                    gap:15px;
                ">


                    ${matches.map(
                        function(match,index){

                            const league =
                                match["League"] || "";


                            const homeTeam =
                                match["Home Team"] || "";


                            const awayTeam =
                                match["Away Team"] || "";


                            const date =
                                match["Date"] ||
                                match["Match Date"] ||
                                match["date"] ||
                                "";


                            const time =
                                match["Time"] ||
                                match["Match Time"] ||
                                match["time"] ||
                                "";


                            const homeScore =
                                match["Home Score"] ||
                                match["Home Goals"] ||
                                "";


                            const awayScore =
                                match["Away Score"] ||
                                match["Away Goals"] ||
                                "";


                            const status =
                                match["Status"] ||
                                match["Match Status"] ||
                                "Scheduled";


                            return `

                                <div style="
                                    border:
                                        1px solid #e2e2e2;
                                    border-radius:14px;
                                    padding:18px;
                                    background:#fafafa;
                                ">


                                    <div style="
                                        display:flex;
                                        justify-content:
                                            space-between;
                                        align-items:center;
                                        gap:10px;
                                        margin-bottom:14px;
                                    ">


                                        <strong style="
                                            color:#061326;
                                        ">

                                            🏆
                                            ${liveValue(
                                                league
                                            )}

                                        </strong>


                                        <span style="
                                            background:#00c853;
                                            color:white;
                                            padding:
                                                5px 10px;
                                            border-radius:20px;
                                            font-size:12px;
                                            font-weight:bold;
                                        ">

                                            ${liveValue(
                                                status
                                            )}

                                        </span>


                                    </div>


                                    <div style="
                                        text-align:center;
                                        padding:15px 5px;
                                        background:#fff;
                                        border-radius:10px;
                                        border:
                                            1px solid #eee;
                                    ">


                                        <div style="
                                            font-size:17px;
                                            font-weight:bold;
                                            color:#061326;
                                        ">

                                            ${liveValue(
                                                homeTeam
                                            )}

                                        </div>


                                        <div style="
                                            margin:10px 0;
                                            font-size:14px;
                                            color:#777;
                                        ">

                                            VS

                                        </div>


                                        <div style="
                                            font-size:17px;
                                            font-weight:bold;
                                            color:#061326;
                                        ">

                                            ${liveValue(
                                                awayTeam
                                            )}

                                        </div>


                                        ${
                                            (
                                                homeScore !== "" ||
                                                awayScore !== ""
                                            )
                                            ?

                                            `

                                            <div style="
                                                margin-top:12px;
                                                font-size:25px;
                                                font-weight:bold;
                                                color:#00a843;
                                            ">

                                                ${liveValue(
                                                    homeScore
                                                )}

                                                -

                                                ${liveValue(
                                                    awayScore
                                                )}

                                            </div>

                                            `

                                            :

                                            ""

                                        }


                                    </div>


                                    <div style="
                                        margin-top:14px;
                                        display:grid;
                                        grid-template-columns:
                                            1fr 1fr;
                                        gap:8px;
                                    ">


                                        <div style="
                                            background:#fff;
                                            border:
                                                1px solid #ddd;
                                            border-radius:8px;
                                            padding:10px;
                                        ">

                                            <div style="
                                                font-size:12px;
                                                color:#777;
                                            ">

                                                Date

                                            </div>


                                            <strong>

                                                ${liveValue(
                                                    date
                                                )}

                                            </strong>

                                        </div>


                                        <div style="
                                            background:#fff;
                                            border:
                                                1px solid #ddd;
                                            border-radius:8px;
                                            padding:10px;
                                        ">

                                            <div style="
                                                font-size:12px;
                                                color:#777;
                                            ">

                                                Time

                                            </div>


                                            <strong>

                                                ${liveValue(
                                                    time
                                                )}

                                            </strong>

                                        </div>


                                    </div>


                                </div>

                            `;

                        }
                    ).join("")}


                </div>

            </div>

        `;


        setLiveStatus(
            "✅ Match Database Connected",
            "success"
        );


    }

    catch(error){

        console.error(
            "APEX Predict AI Live Scores error:",
            error
        );


        setLiveStatus(
            "❌ Unable to load Match Database: " +
            error.message,
            "error"
        );


        container.innerHTML = `

            <div style="
                background:#102847;
                padding:25px;
                border-radius:15px;
                text-align:center;
                color:white;
            ">

                ❌ Unable to load football matches.

                <br><br>

                Please try again later.

            </div>

        `;

    }

}


// ========================================
// START
// ========================================

document.addEventListener(
    "DOMContentLoaded",
    loadLiveScores
);

</script>


</body>

  </html>
