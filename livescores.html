<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Live Scores</title>

<link rel="stylesheet" href="styles.css">

<style>

:root{
    --bg:#071321;
    --panel:#0d1c2d;
    --panel2:#10243a;
    --border:rgba(255,255,255,.08);
    --text:#ffffff;
    --muted:#9eacba;
    --green:#00d66b;
    --green-dark:#00a950;
    --blue:#2f7cff;
    --red:#ff4d5f;
    --yellow:#ffbf22;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at top left,
            rgba(0,214,107,.10),
            transparent 32%
        ),
        radial-gradient(
            circle at top right,
            rgba(47,124,255,.10),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #050d17,
            #071321 50%,
            #0a1828
        );

    color:var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

.app{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:14px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-icon{
    width:46px;
    height:46px;
    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #19354e,
            #0a1828
        );

    border:1px solid rgba(0,214,107,.22);

    font-size:24px;
}

.brand-title{
    margin:0;
    font-size:21px;
    font-weight:800;
}

.brand-title span{
    color:var(--green);
}

.brand-subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.page-badge{
    padding:7px 10px;
    border-radius:999px;

    background:rgba(0,214,107,.08);
    border:1px solid rgba(0,214,107,.18);

    color:#9ff0c1;
    font-size:11px;
    font-weight:700;
}

.status{
    padding:12px 14px;
    margin-bottom:15px;

    border-radius:13px;

    background:rgba(255,255,255,.035);
    border:1px solid var(--border);

    color:#a9f0c2;

    text-align:center;
    font-size:12px;
    font-weight:700;
}

.summary{
    background:
        linear-gradient(
            145deg,
            rgba(13,28,45,.98),
            rgba(8,20,34,.98)
        );

    border:1px solid var(--border);
    border-radius:20px;

    padding:18px;

    box-shadow:
        0 15px 35px rgba(0,0,0,.24);
}

.summary-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
}

.summary-header h1{
    margin:0 0 7px;
    font-size:23px;
}

.summary-header p{
    margin:0;
    color:var(--muted);
    font-size:12px;
}

.count-box{
    text-align:right;
}

.count-number{
    color:var(--green);
    font-size:27px;
    font-weight:900;
}

.count-label{
    color:#788797;
    font-size:10px;
}

.match-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));

    gap:14px;
    margin-top:18px;
}

.match-card{
    background:
        linear-gradient(
            145deg,
            rgba(10,25,41,.96),
            rgba(7,18,30,.96)
        );

    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 12px 28px rgba(0,0,0,.22);
}

.match-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;

    padding:14px 15px 10px;
}

.match-number{
    color:#778595;
    font-size:10px;
    font-weight:800;
}

.league{
    color:#c8d2dc;
    font-size:10px;
    font-weight:700;
    text-align:right;
}

.match-body{
    padding:7px 15px 16px;
}

.status-badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:999px;

    background:rgba(0,214,107,.11);
    color:#7ef0ad;

    font-size:10px;
    font-weight:800;
}

.teams{
    margin-top:13px;

    display:grid;
    grid-template-columns:1fr auto 1fr;

    align-items:center;

    gap:9px;

    text-align:center;
}

.team{
    color:#ffffff;
    font-size:17px;
    font-weight:800;
    line-height:1.3;
}

.vs{
    color:#7f8d9d;
    font-size:11px;
    font-weight:900;
}

.score{
    text-align:center;
    margin-top:12px;

    color:var(--green);
    font-size:25px;
    font-weight:900;
}

.schedule{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:15px;
}

.schedule-item{
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.055);

    border-radius:11px;

    padding:11px;
}

.schedule-label{
    color:#758394;
    font-size:10px;
    font-weight:700;

    margin-bottom:5px;
}

.schedule-value{
    color:#e9eef4;
    font-size:12px;
    font-weight:700;
    word-break:break-word;
}

.match-footer{
    display:flex;
    justify-content:space-between;

    padding:11px 15px;

    border-top:1px solid rgba(255,255,255,.06);

    color:#697888;
    font-size:9px;
}

.empty,
.error{
    padding:25px;

    text-align:center;

    border-radius:17px;
}

.empty{
    background:#0d1c2d;
    border:1px solid var(--border);
    color:#b9c6d3;
}

.error{
    background:#3a1515;
    color:#ffb4ab;
}

.navigation{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:9px;

    margin-top:18px;
    padding-bottom:25px;
}

.navigation button{
    min-height:48px;

    border:1px solid var(--border);
    border-radius:12px;

    background:#0d1c2d;
    color:#e8edf3;

    font-size:11px;
    font-weight:700;
}

.navigation button:hover{
    border-color:rgba(0,214,107,.35);
}

@media(max-width:650px){

    .app{
        padding:10px;
    }

    .page-badge{
        display:none;
    }

    .summary-header{
        align-items:center;
    }

    .match-grid{
        grid-template-columns:1fr;
    }

    .teams{
        grid-template-columns:1fr;
    }

    .vs{
        margin:-3px 0;
    }

    .navigation{
        grid-template-columns:
            1fr 1fr;
    }

}

@media(max-width:390px){

    .summary-header{
        flex-direction:column;
    }

    .count-box{
        text-align:left;
    }

}

</style>

</head>


<body>

<div class="app">

    <div class="topbar">

        <div class="brand">

            <div class="brand-icon">
                ⚽
            </div>

            <div>

                <h2 class="brand-title">
                    APEX <span>PREDICT AI</span>
                </h2>

                <div class="brand-subtitle">
                    Professional Football Intelligence
                </div>

            </div>

        </div>


        <div class="page-badge">
            LIVE SCORES
        </div>

    </div>


    <div
        id="liveScoreStatus"
        class="status"
    >
        🔄 Connecting to APEX AI...
    </div>


    <div id="liveScoresContainer">

        <div class="empty">
            🔄 Loading today's selected matches...
        </div>

    </div>


    <div class="navigation">

        <button onclick="go('dashboard.html')">
            🏠 Dashboard
        </button>

        <button onclick="go('predictions.html')">
            🤖 Predictions
        </button>

        <button onclick="go('analysis.html')">
            📊 Analysis
        </button>

        <button onclick="go('statistics.html')">
            📈 Statistics
        </button>

        <button onclick="go('leagues.html')">
            🏆 Leagues
        </button>

        <button onclick="go('headtohead.html')">
            ⚔ Head To Head
        </button>

        <button onclick="go('settings.html')">
            ⚙ Settings
        </button>

        <button onclick="go('index.html')">
            🚪 Logout
        </button>

    </div>

</div>


<script>

"use strict";


const APEX_GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getValue(match,names){

    for(const wanted of names){

        const key =
            Object.keys(match).find(
                function(existingKey){

                    return existingKey
                        .trim()
                        .toLowerCase()
                        ===
                        wanted
                            .trim()
                            .toLowerCase();

                }
            );

        if(key !== undefined){

            const value =
                match[key];

            if(
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            ){

                return value;

            }

        }

    }

    return "";

}


async function loadLiveScores(){

    const status =
        document.getElementById(
            "liveScoreStatus"
        );

    const container =
        document.getElementById(
            "liveScoresContainer"
        );


    try{

        status.textContent =
            "🔄 Connecting to APEX Predict AI...";


        const response =
            await fetch(
                APEX_GOOGLE_SHEETS_API,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !data.matchDatabase ||
            !Array.isArray(
                data.matchDatabase.objects
            )
        ){

            throw new Error(
                "APEX Match Database was not returned."
            );

        }


        const allMatches =
            data.matchDatabase.objects;


        /*
         * Preserve the working selection logic.
         * The database remains untouched.
         */

        const completedMatches =
            allMatches.filter(
                function(match){

                    const prediction =
                        getValue(
                            match,
                            [
                                "Prediction",
                                "prediction",
                                "AI Prediction"
                            ]
                        );

                    const confidence =
                        getValue(
                            match,
                            [
                                "Confidence %",
                                "Confidence",
                                "confidence %",
                                "Final Confidence"
                            ]
                        );

                    const market =
                        getValue(
                            match,
                            [
                                "Recommended Market",
                                "recommended market",
                                "Market"
                            ]
                        );

                    return (
                        prediction !== "" ||
                        confidence !== "" ||
                        market !== ""
                    );

                }
            );


        const matches =
            completedMatches
                .slice()
                .reverse()
                .slice(0,10);


        status.textContent =
            "✅ APEX AI Connected — " +
            matches.length +
            " selected matches";


        if(!matches.length){

            container.innerHTML = `

                <div class="empty">

                    <h2>
                        ⚽ No Selected Matches
                    </h2>

                    <p>
                        APEX has not produced completed
                        match records yet.
                    </p>

                </div>

            `;

            return;

        }


        let html = `

            <div class="summary">

                <div class="summary-header">

                    <div>

                        <h1>
                            ⚽ APEX Match Centre
                        </h1>

                        <p>
                            Today's final selected matches
                            from the APEX AI engine.
                        </p>

                    </div>

                    <div class="count-box">

                        <div class="count-number">
                            ${matches.length}
                        </div>

                        <div class="count-label">
                            SELECTED
                        </div>

                    </div>

                </div>


                <div class="match-grid">

        `;


        matches.forEach(
            function(match,index){

                const league =
                    getValue(
                        match,
                        [
                            "League",
                            "league"
                        ]
                    );


                const home =
                    getValue(
                        match,
                        [
                            "Home Team",
                            "HomeTeam",
                            "Home"
                        ]
                    );


                const away =
                    getValue(
                        match,
                        [
                            "Away Team",
                            "AwayTeam",
                            "Away"
                        ]
                    );


                const date =
                    getValue(
                        match,
                        [
                            "Date",
                            "Match Date",
                            "date"
                        ]
                    );


                const time =
                    getValue(
                        match,
                        [
                            "Time",
                            "Match Time",
                            "time"
                        ]
                    );


                const homeScore =
                    getValue(
                        match,
                        [
                            "Home Score",
                            "Home Goals",
                            "home score"
                        ]
                    );


                const awayScore =
                    getValue(
                        match,
                        [
                            "Away Score",
                            "Away Goals",
                            "away score"
                        ]
                    );


                const matchStatus =
                    getValue(
                        match,
                        [
                            "Status",
                            "Match Status",
                            "status"
                        ]
                    )
                    ||
                    "Scheduled";


                const prediction =
                    getValue(
                        match,
                        [
                            "Prediction",
                            "AI Prediction"
                        ]
                    );


                const confidence =
                    getValue(
                        match,
                        [
                            "Confidence %",
                            "Confidence",
                            "Final Confidence"
                        ]
                    );


                html += `

                    <div class="match-card">


                        <div class="match-top">

                            <div class="match-number">

                                MATCH ${index + 1}

                            </div>

                            <div class="league">

                                🏆 ${safe(
                                    league || "League"
                                )}

                            </div>

                        </div>


                        <div class="match-body">

                            <span class="status-badge">

                                ${safe(matchStatus)}

                            </span>


                            <div class="teams">

                                <div class="team">

                                    ${safe(
                                        home || "Home Team"
                                    )}

                                </div>

                                <div class="vs">
                                    VS
                                </div>

                                <div class="team">

                                    ${safe(
                                        away || "Away Team"
                                    )}

                                </div>

                            </div>


                            ${
                                (
                                    homeScore !== "" ||
                                    awayScore !== ""
                                )
                                ?

                                `
                                    <div class="score">

                                        ${safe(
                                            homeScore || "0"
                                        )}

                                        -

                                        ${safe(
                                            awayScore || "0"
                                        )}

                                    </div>
                                `

                                :

                                ""
                            }


                            <div class="schedule">

                                <div class="schedule-item">

                                    <div class="schedule-label">
                                        DATE
                                    </div>

                                    <div class="schedule-value">

                                        ${safe(
                                            date || "—"
                                        )}

                                    </div>

                                </div>


                                <div class="schedule-item">

                                    <div class="schedule-label">
                                        TIME
                                    </div>

                                    <div class="schedule-value">

                                        ${safe(
                                            time || "—"
                                        )}

                                    </div>

                                </div>

                            </div>

                        </div>


                        <div class="match-footer">

                            <span>
                                APEX AI
                            </span>

                            <span>
                                ${
                                    confidence !== ""
                                        ? "Confidence " +
                                          safe(confidence) +
                                          "%"
                                        : safe(
                                            prediction || "Prediction"
                                          )
                                }
                            </span>

                        </div>


                    </div>

                `;

            }
        );


        html += `

                </div>

            </div>

        `;


        container.innerHTML =
            html;


    }
    catch(error){

        console.error(
            "APEX Live Scores Error:",
            error
        );


        status.textContent =
            "❌ APEX Live Scores failed to load";


        container.innerHTML = `

            <div class="error">

                <h2>
                    ❌ Unable to Load Live Scores
                </h2>

                <p>
                    ${safe(error.message)}
                </p>

            </div>

        `;

    }

}


function go(page){

    window.location.href =
        page;

}


document.addEventListener(
    "DOMContentLoaded",
    loadLiveScores
);

</script>


</body>

</html>
