<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Predictions</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container">

    <h1>🤖 Today's AI Predictions</h1>

    <p>
        APEX Predict AI — Final 10 Selected Matches
    </p>

    <div id="connectionStatus">
        🔄 Loading today's selected predictions...
    </div>

    <div id="predictionContainer">

        <p style="text-align:center;">
            🔄 Loading predictions...
        </p>

    </div>

    <br>

    <button onclick="openDashboard()">🏠 Dashboard</button>
    <button onclick="openAnalysis()">📊 Analysis</button>
    <button onclick="openStatistics()">📈 Statistics</button>
    <button onclick="openLiveScores()">⚽ Live Scores</button>
    <button onclick="openLeagues()">🏆 Leagues</button>
    <button onclick="openHeadToHead()">⚔ Head To Head</button>
    <button onclick="openSettings()">⚙ Settings</button>

</div>


<script>

/* =========================================================
   APEX PREDICT AI
   PREDICTIONS PAGE
   FINAL 10 DISPLAY
   ========================================================= */

const GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


/* =========================================================
   HELPER
   ========================================================= */

function getValue(match, names) {

    for (const name of names) {

        if (
            match[name] !== undefined &&
            match[name] !== null &&
            match[name] !== ""
        ) {
            return match[name];
        }

    }

    return "";

}


/* =========================================================
   LOAD ONLY FINAL 10
   ========================================================= */

async function loadPredictions() {

    const container =
        document.getElementById("predictionContainer");

    const status =
        document.getElementById("connectionStatus");

    try {

        status.textContent =
            "🔄 Connecting to APEX Predict AI...";

        const response =
            await fetch(GOOGLE_SHEETS_API);

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        console.log(
            "APEX DATA RECEIVED:",
            data
        );


        /* =================================================
           GET MATCH DATABASE
           ================================================= */

        let allMatches = [];

        if (
            data.matchDatabase &&
            Array.isArray(data.matchDatabase.objects)
        ) {

            allMatches =
                data.matchDatabase.objects;

        }


        if (allMatches.length === 0) {

            status.textContent =
                "⚠️ No matches available.";

            container.innerHTML = `
                <div style="
                    background:white;
                    color:#111;
                    padding:25px;
                    border-radius:16px;
                    text-align:center;
                ">
                    <h2>⚠️ No Matches Available</h2>
                    <p>
                        APEX Predict AI could not find
                        matches in the database.
                    </p>
                </div>
            `;

            return;

        }


        /* =================================================
           IMPORTANT
           
           The Match Database may contain 1,870+ records.
           We DO NOT display the whole database.

           We take the most recent completed prediction
           records and display ONLY 10.
           ================================================= */

        const completedMatches =
            allMatches.filter(function(match) {

                const prediction =
                    getValue(match, [
                        "Prediction",
                        "prediction",
                        "AI Prediction"
                    ]);

                const confidence =
                    getValue(match, [
                        "Confidence %",
                        "Confidence",
                        "confidence %",
                        "Final Confidence"
                    ]);

                const market =
                    getValue(match, [
                        "Recommended Market",
                        "recommended market",
                        "Market"
                    ]);

                return (
                    prediction !== "" ||
                    confidence !== "" ||
                    market !== ""
                );

            });


        /*
         * Use the most recent records first.
         * Then limit the WEB PAGE to 10.
         *
         * The Google Sheet remains untouched.
         */

        const matches =
            completedMatches
                .slice()
                .reverse()
                .slice(0, 10);


        console.log(
            "APEX database records:",
            allMatches.length
        );

        console.log(
            "APEX prediction records:",
            completedMatches.length
        );

        console.log(
            "APEX FINAL DISPLAY:",
            matches.length
        );


        status.textContent =
            "✅ APEX AI Connected — " +
            matches.length +
            " selected matches";


        if (matches.length === 0) {

            container.innerHTML = `
                <div style="
                    background:white;
                    color:#111;
                    padding:25px;
                    border-radius:16px;
                    text-align:center;
                ">
                    <h2>⚠️ Predictions Not Ready</h2>
                    <p>
                        The database is connected, but
                        completed predictions have not
                        been found yet.
                    </p>
                </div>
            `;

            return;

        }


        /* =================================================
           PAGE HEADER
           ================================================= */

        let html = `

        <div style="
            background:#ffffff;
            color:#111;
            padding:20px;
            border-radius:16px;
            margin-top:20px;
            box-shadow:0 12px 35px rgba(0,0,0,.25);
        ">

            <h2 style="
                color:#061326;
                margin-bottom:8px;
            ">
                🤖 APEX AI PREDICTIONS
            </h2>

            <p style="
                color:#444;
                margin:0;
            ">
                Showing the final ${matches.length}
                selected matches.
            </p>

        </div>

        `;


        /* =================================================
           BUILD THE 10 MATCH CARDS
           ================================================= */

        matches.forEach(function(match, index) {

            const date =
                getValue(match, [
                    "Date",
                    "date",
                    "Fixture Date"
                ]);

            const league =
                getValue(match, [
                    "League",
                    "league",
                    "League Name"
                ]);

            const homeTeam =
                getValue(match, [
                    "Home Team",
                    "home team",
                    "Home",
                    "home"
                ]);

            const awayTeam =
                getValue(match, [
                    "Away Team",
                    "away team",
                    "Away",
                    "away"
                ]);

            const prediction =
                getValue(match, [
                    "Prediction",
                    "prediction",
                    "AI Prediction"
                ]);

            const confidence =
                getValue(match, [
                    "Confidence %",
                    "Confidence",
                    "confidence %",
                    "Final Confidence"
                ]);

            const risk =
                getValue(match, [
                    "Risk Level",
                    "Risk",
                    "risk level"
                ]);

            const market =
                getValue(match, [
                    "Recommended Market",
                    "recommended market",
                    "Market"
                ]);


            html += `

            <div style="
                background:#ffffff;
                color:#111;
                margin-top:20px;
                padding:25px;
                border-radius:16px;
                box-shadow:0 12px 35px rgba(0,0,0,.25);
            ">

                <h2 style="
                    color:#061326;
                    margin-bottom:15px;
                ">
                    ⚽ Match ${index + 1}
                </h2>


                <div style="
                    background:#f5f7fa;
                    padding:18px;
                    border-radius:12px;
                    margin-bottom:18px;
                ">

                    <h3 style="
                        color:#061326;
                        font-size:22px;
                        margin-bottom:10px;
                    ">

                        ${homeTeam || "Home Team"}

                        <span style="
                            color:#777;
                            font-weight:normal;
                        ">
                            vs
                        </span>

                        ${awayTeam || "Away Team"}

                    </h3>

                    <p style="
                        color:#333;
                        margin:6px 0;
                    ">
                        <strong>League:</strong>
                        ${league || "—"}
                    </p>

                    <p style="
                        color:#333;
                        margin:6px 0;
                    ">
                        <strong>Date:</strong>
                        ${date || "—"}
                    </p>

                </div>


                <div style="
                    background:#e8f5e9;
                    border-left:5px solid #00c853;
                    padding:18px;
                    border-radius:10px;
                    margin-bottom:15px;
                ">

                    <h3 style="
                        color:#061326;
                        margin-bottom:8px;
                    ">
                        🤖 AI Prediction
                    </h3>

                    <p style="
                        color:#111;
                        font-size:20px;
                        font-weight:bold;
                    ">
                        ${prediction || "—"}
                    </p>

                </div>


                <div style="
                    display:grid;
                    grid-template-columns:
                    repeat(auto-fit,minmax(180px,1fr));
                    gap:12px;
                ">


                    <div style="
                        background:#f5f5f5;
                        padding:16px;
                        border-radius:12px;
                    ">

                        <strong>Confidence</strong>

                        <p style="
                            color:#111;
                            font-size:20px;
                            margin-top:8px;
                        ">
                            ${confidence || "—"}
                            ${confidence !== "" ? "%" : ""}
                        </p>

                    </div>


                    <div style="
                        background:#f5f5f5;
                        padding:16px;
                        border-radius:12px;
                    ">

                        <strong>Risk Level</strong>

                        <p style="
                            color:#111;
                            font-size:20px;
                            margin-top:8px;
                        ">
                            ${risk || "—"}
                        </p>

                    </div>


                    <div style="
                        background:#f5f5f5;
                        padding:16px;
                        border-radius:12px;
                    ">

                        <strong>Recommended Market</strong>

                        <p style="
                            color:#111;
                            font-size:18px;
                            margin-top:8px;
                        ">
                            ${market || "—"}
                        </p>

                    </div>

                </div>

            </div>

            `;

        });


        container.innerHTML =
            html;


    } catch (error) {

        console.error(
            "APEX Predictions Error:",
            error
        );

        status.textContent =
            "❌ APEX connection error";

        container.innerHTML = `
            <div style="
                background:white;
                color:#111;
                padding:25px;
                border-radius:16px;
                text-align:center;
            ">

                <h2>❌ Unable to Load Predictions</h2>

                <p>
                    APEX could not retrieve the
                    prediction data.
                </p>

            </div>
        `;

    }

}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadPredictions
);


/* =========================================================
   NAVIGATION
   ========================================================= */

function openDashboard() {
    window.location.href = "dashboard.html";
}

function openAnalysis() {
    window.location.href = "analysis.html";
}

function openStatistics() {
    window.location.href = "statistics.html";
}

function openLiveScores() {
    window.location.href = "livescores.html";
}

function openLeagues() {
    window.location.href = "leagues.html";
}

function openHeadToHead() {
    window.location.href = "headtohead.html";
}

function openSettings() {
    window.location.href = "settings.html";
}

</script>

</body>
    </html>
