<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Predictions</title>

<link rel="stylesheet" href="styles.css">

<style>

:root{
    --bg:#071321;
    --panel:#0d1c2d;
    --panel2:#10243a;
    --border:rgba(255,255,255,.08);
    --text:#ffffff;
    --muted:#9eacba;
    --green:#00d66b;
    --green-dark:#00a950;
    --blue:#2f7cff;
    --yellow:#ffbf22;
    --red:#ff4d5f;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at top left,
            rgba(0,214,107,.10),
            transparent 32%
        ),
        radial-gradient(
            circle at top right,
            rgba(47,124,255,.10),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #050d17,
            #071321 50%,
            #0a1828
        );

    color:var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

.app{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:14px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-icon{
    width:46px;
    height:46px;
    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #19354e,
            #0a1828
        );

    border:1px solid rgba(0,214,107,.22);

    font-size:24px;
}

.brand-title{
    margin:0;
    font-size:22px;
    font-weight:800;
}

.brand-title span{
    color:var(--green);
}

.brand-subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.page-badge{
    padding:7px 10px;
    border-radius:999px;

    background:rgba(0,214,107,.08);
    border:1px solid rgba(0,214,107,.18);

    color:#9ff0c1;
    font-size:11px;
    font-weight:700;
}

.status{
    padding:12px 14px;
    margin-bottom:15px;

    border-radius:13px;

    background:rgba(255,255,255,.035);
    border:1px solid var(--border);

    color:#a9f0c2;

    text-align:center;
    font-size:12px;
    font-weight:700;
}

.page-header{
    background:
        linear-gradient(
            145deg,
            rgba(13,28,45,.98),
            rgba(8,20,34,.98)
        );

    border:1px solid var(--border);
    border-radius:19px;

    padding:18px;

    margin-bottom:15px;

    box-shadow:
        0 15px 35px rgba(0,0,0,.24);
}

.page-header h1{
    margin:0 0 7px;
    font-size:23px;
}

.page-header p{
    margin:0;
    color:var(--muted);
    font-size:12px;
}

.selection-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    margin-top:15px;
    padding-top:14px;

    border-top:1px solid var(--border);
}

.selection-number{
    color:var(--green);
    font-size:21px;
    font-weight:900;
}

.selection-label{
    color:#8593a2;
    font-size:11px;
}

.match-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.match-card{
    background:
        linear-gradient(
            145deg,
            rgba(13,28,45,.98),
            rgba(8,20,34,.98)
        );

    border:1px solid var(--border);
    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 15px 38px rgba(0,0,0,.26);
}

.match-top{
    padding:16px 17px 12px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.match-number{
    color:#7f8d9d;
    font-size:11px;
    font-weight:800;
}

.league{
    color:#c5d1dd;
    font-size:11px;
    font-weight:700;
    text-align:right;
}

.match-main{
    padding:4px 17px 18px;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:10px;

    text-align:center;
}

.team{
    color:#ffffff;
    font-size:18px;
    font-weight:800;
    line-height:1.3;
}

.vs{
    color:#8390a0;
    font-size:12px;
    font-weight:900;
}

.match-date{
    text-align:center;
    color:#748394;
    font-size:10px;
    margin-top:10px;
}

.prediction-box{
    margin:0 15px 15px;

    background:
        linear-gradient(
            135deg,
            rgba(0,214,107,.10),
            rgba(0,214,107,.035)
        );

    border:1px solid rgba(0,214,107,.15);
    border-left:4px solid var(--green);

    border-radius:14px;

    padding:15px;
}

.prediction-label{
    color:#8fdbae;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;

    margin-bottom:6px;
}

.prediction-text{
    color:#ffffff;
    font-size:16px;
    font-weight:800;
    line-height:1.4;
}

.metrics{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

    padding:0 15px 15px;
}

.metric{
    min-height:76px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.055);

    border-radius:12px;

    padding:12px;
}

.metric-label{
    color:#7f8d9d;
    font-size:10px;
    font-weight:700;
    margin-bottom:7px;
}

.metric-value{
    color:#ffffff;
    font-size:14px;
    font-weight:800;
    line-height:1.3;
}

.metric-value.confidence{
    color:var(--green);
    font-size:20px;
}

.metric-value.market{
    color:#d9e7ff;
}

.risk-low{
    color:#7ef0ad;
}

.risk-medium{
    color:#ffd56d;
}

.risk-high{
    color:#ff8d99;
}

.match-footer{
    display:flex;
    justify-content:space-between;
    gap:10px;

    padding:12px 15px;

    border-top:1px solid var(--border);

    color:#768697;
    font-size:10px;
}

.empty,
.error{
    padding:25px;
    text-align:center;
    border-radius:17px;
}

.empty{
    background:#0d1c2d;
    border:1px solid var(--border);
    color:#b9c6d3;
}

.error{
    background:#3a1515;
    color:#ffb4ab;
}

.navigation{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:9px;

    margin-top:18px;
    padding-bottom:25px;
}

.navigation button{
    min-height:48px;

    border:1px solid var(--border);
    border-radius:12px;

    background:#0d1c2d;
    color:#e8edf3;

    font-size:11px;
    font-weight:700;
}

.navigation button:hover{
    border-color:rgba(0,214,107,.35);
}

@media(max-width:650px){

    .app{
        padding:10px;
    }

    .brand-title{
        font-size:19px;
    }

    .page-badge{
        display:none;
    }

    .teams{
        grid-template-columns:1fr;
    }

    .vs{
        margin:-3px 0;
    }

    .metrics{
        grid-template-columns:
            1fr 1fr;
    }

    .navigation{
        grid-template-columns:
            1fr 1fr;
    }

}

@media(max-width:390px){

    .metrics{
        grid-template-columns:
            1fr;
    }

}

</style>

</head>


<body>

<div class="app">


    <div class="topbar">

        <div class="brand">

            <div class="brand-icon">
                ⚽
            </div>

            <div>

                <h2 class="brand-title">
                    APEX <span>PREDICT AI</span>
                </h2>

                <div class="brand-subtitle">
                    Professional Football Intelligence
                </div>

            </div>

        </div>


        <div class="page-badge">
            AI PREDICTIONS
        </div>

    </div>


    <div
        id="connectionStatus"
        class="status"
    >
        🔄 Loading today's selected predictions...
    </div>


    <div class="page-header">

        <h1>
            🤖 Today's AI Predictions
        </h1>

        <p>
            Final APEX selections generated by the AI engine.
        </p>


        <div class="selection-bar">

            <div>

                <div class="selection-number"
                     id="selectionCount">
                    —
                </div>

                <div class="selection-label">
                    SELECTED MATCHES
                </div>

            </div>


            <div style="
                text-align:right;
            ">

                <div style="
                    color:#8b98a7;
                    font-size:11px;
                ">
                    APEX SMART GATE
                </div>

                <div style="
                    color:#9ff0c1;
                    font-size:12px;
                    font-weight:800;
                ">
                    ACTIVE
                </div>

            </div>

        </div>

    </div>


    <div
        id="predictionContainer"
        class="match-list"
    >

        <div class="empty">

            🔄 Loading APEX predictions...

        </div>

    </div>


    <div class="navigation">

        <button onclick="go('dashboard.html')">
            🏠 Dashboard
        </button>

        <button onclick="go('analysis.html')">
            📊 Analysis
        </button>

        <button onclick="go('statistics.html')">
            📈 Statistics
        </button>

        <button onclick="go('livescores.html')">
            ⚽ Live Scores
        </button>

        <button onclick="go('leagues.html')">
            🏆 Leagues
        </button>

        <button onclick="go('headtohead.html')">
            ⚔ Head To Head
        </button>

        <button onclick="go('settings.html')">
            ⚙ Settings
        </button>

        <button onclick="go('index.html')">
            🚪 Logout
        </button>

    </div>

</div>


<script>

"use strict";


const GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


function getValue(match,names){

    for(const wanted of names){

        const key =
            Object.keys(match).find(
                function(existingKey){

                    return existingKey
                        .trim()
                        .toLowerCase()
                        ===
                        wanted
                            .trim()
                            .toLowerCase();

                }
            );

        if(key !== undefined){

            const value =
                match[key];

            if(
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            ){

                return value;

            }

        }

    }

    return "";

}


function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


async function loadPredictions(){

    const container =
        document.getElementById(
            "predictionContainer"
        );

    const status =
        document.getElementById(
            "connectionStatus"
        );

    const count =
        document.getElementById(
            "selectionCount"
        );


    try{

        status.textContent =
            "🔄 Connecting to APEX Predict AI...";


        const response =
            await fetch(
                GOOGLE_SHEETS_API,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !data.matchDatabase ||
            !Array.isArray(
                data.matchDatabase.objects
            )
        ){

            throw new Error(
                "APEX Match Database was not returned."
            );

        }


        const allMatches =
            data.matchDatabase.objects;


        /*
         * Preserve the exact selection logic
         * that is already working in production.
         */

        const completedMatches =
            allMatches.filter(
                function(match){

                    const prediction =
                        getValue(
                            match,
                            [
                                "Prediction",
                                "prediction",
                                "AI Prediction"
                            ]
                        );

                    const confidence =
                        getValue(
                            match,
                            [
                                "Confidence %",
                                "Confidence",
                                "confidence %",
                                "Final Confidence"
                            ]
                        );

                    const market =
                        getValue(
                            match,
                            [
                                "Recommended Market",
                                "recommended market",
                                "Market"
                            ]
                        );

                    return (
                        prediction !== "" ||
                        confidence !== "" ||
                        market !== ""
                    );

                }
            );


        const matches =
            completedMatches
                .slice()
                .reverse()
                .slice(0,10);


        count.textContent =
            matches.length;


        status.textContent =
            "✅ APEX AI Connected — " +
            matches.length +
            " selected matches";


        if(!matches.length){

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        ⚠️ Predictions Not Ready
                    </h3>

                    <p>
                        No completed APEX predictions
                        are currently available.
                    </p>

                </div>

            `;

            return;

        }


        let html = "";


        matches.forEach(
            function(match,index){

                const date =
                    getValue(
                        match,
                        [
                            "Date",
                            "date",
                            "Fixture Date",
                            "Match Date"
                        ]
                    );


                const league =
                    getValue(
                        match,
                        [
                            "League",
                            "league",
                            "League Name"
                        ]
                    );


                const home =
                    getValue(
                        match,
                        [
                            "Home Team",
                            "home team",
                            "HomeTeam",
                            "Home"
                        ]
                    );


                const away =
                    getValue(
                        match,
                        [
                            "Away Team",
                            "away team",
                            "AwayTeam",
                            "Away"
                        ]
                    );


                const prediction =
                    getValue(
                        match,
                        [
                            "Prediction",
                            "prediction",
                            "AI Prediction"
                        ]
                    );


                const confidence =
                    getValue(
                        match,
                        [
                            "Confidence %",
                            "Confidence",
                            "confidence %",
                            "Final Confidence"
                        ]
                    );


                const risk =
                    getValue(
                        match,
                        [
                            "Risk Level",
                            "Risk",
                            "risk level"
                        ]
                    );


                const market =
                    getValue(
                        match,
                        [
                            "Recommended Market",
                            "recommended market",
                            "Market"
                        ]
                    );


                const riskText =
                    String(
                        risk || ""
                    ).toLowerCase();


                let riskClass =
                    "risk-high";


                if(
                    riskText === "low"
                ){

                    riskClass =
                        "risk-low";

                }
                else if(
                    riskText === "medium"
                ){

                    riskClass =
                        "risk-medium";

                }


                html += `

                    <div class="match-card">


                        <div class="match-top">

                            <div class="match-number">
                                MATCH ${index + 1}
                            </div>

                            <div class="league">
                                🏆 ${safe(
                                    league || "League"
                                )}
                            </div>

                        </div>


                        <div class="match-main">

                            <div class="teams">

                                <div class="team">

                                    ${safe(
                                        home || "Home Team"
                                    )}

                                </div>


                                <div class="vs">
                                    VS
                                </div>


                                <div class="team">

                                    ${safe(
                                        away || "Away Team"
                                    )}

                                </div>

                            </div>


                            <div class="match-date">

                                ${safe(
                                    date || "Date unavailable"
                                )}

                            </div>

                        </div>


                        <div class="prediction-box">

                            <div class="prediction-label">
                                🤖 AI Prediction
                            </div>

                            <div class="prediction-text">

                                ${safe(
                                    prediction || "—"
                                )}

                            </div>

                        </div>


                        <div class="metrics">


                            <div class="metric">

                                <div class="metric-label">
                                    CONFIDENCE
                                </div>

                                <div class="metric-value confidence">

                                    ${
                                        confidence !== ""
                                            ? safe(
                                                confidence
                                            ) + "%"
                                            : "—"
                                    }

                                </div>

                            </div>


                            <div class="metric">

                                <div class="metric-label">
                                    RISK
                                </div>

                                <div
                                    class="
                                        metric-value
                                        ${riskClass}
                                    "
                                >

                                    ${safe(
                                        risk || "—"
                                    )}

                                </div>

                            </div>


                            <div class="metric">

                                <div class="metric-label">
                                    MARKET
                                </div>

                                <div class="
                                    metric-value market
                                ">

                                    ${safe(
                                        market || "—"
                                    )}

                                </div>

                            </div>

                        </div>


                        <div class="match-footer">

                            <span>
                                APEX AI ENGINE
                            </span>

                            <span>
                                SMART GATE
                            </span>

                        </div>


                    </div>

                `;

            }
        );


        container.innerHTML =
            html;


    }
    catch(error){

        console.error(
            "APEX Predictions Error:",
            error
        );


        status.textContent =
            "❌ APEX Predictions failed to load";


        count.textContent =
            "—";


        container.innerHTML = `

            <div class="error">

                <h3>
                    ❌ Unable to Load Predictions
                </h3>

                <p>
                    ${safe(error.message)}
                </p>

            </div>

        `;

    }

}


function go(page){

    window.location.href =
        page;

}


document.addEventListener(
    "DOMContentLoaded",
    loadPredictions
);

</script>


</body>

</html>
