<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>APEX Predict AI - Statistics</title>

<link rel="stylesheet" href="styles.css">

<style>

body {
    margin: 0;
}

.statistics-header {
    text-align: center;
    margin-bottom: 20px;
}

.statistics-header h1 {
    margin-bottom: 8px;
}

.statistics-header p {
    color: #cfd8e3;
}

#connectionStatus {
    text-align: center;
    padding: 14px;
    margin: 15px 0;
    border-radius: 14px;
    font-weight: bold;
}

.loading-box {
    background: rgba(255,255,255,.08);
    color: #ffd54f;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
}

.error-box {
    background: #3a1515;
    color: #ffb4ab;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
}

.summary {
    background: #ffffff;
    color: #111;
    padding: 22px;
    border-radius: 18px;
    margin-top: 20px;
    box-shadow: 0 12px 35px rgba(0,0,0,.25);
}

.summary h2 {
    color: #061326;
    margin-top: 0;
}

.summary p {
    color: #333;
}

.stats-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-top: 18px;
}

.stat-card {
    background: #f5f7fa;
    border: 1px solid #e1e5ea;
    border-radius: 14px;
    padding: 16px;
}

.stat-title {
    color: #555;
    font-size: 14px;
    font-weight: bold;
}

.stat-value {
    color: #061326;
    font-size: 23px;
    font-weight: bold;
    margin-top: 8px;
}

.matches-box {
    background: #ffffff;
    color: #111;
    padding: 22px;
    border-radius: 18px;
    margin-top: 20px;
    box-shadow: 0 12px 35px rgba(0,0,0,.25);
}

.matches-box h2 {
    color: #061326;
    margin-top: 0;
}

.match-card {
    background: #f7f8fa;
    border: 1px solid #e1e5ea;
    border-radius: 15px;
    padding: 18px;
    margin-top: 15px;
}

.match-number {
    color: #777;
    font-size: 14px;
    font-weight: bold;
}

.teams {
    color: #061326;
    font-size: 20px;
    font-weight: bold;
    margin: 8px 0 12px;
}

.detail-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
}

.detail {
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 12px;
}

.detail strong {
    display: block;
    color: #555;
    font-size: 13px;
    margin-bottom: 5px;
}

.detail span {
    color: #111;
    font-size: 16px;
    word-break: break-word;
}

.prediction {
    background: #e8f7eb;
    border-left: 5px solid #00c853;
}

.confidence {
    background: #eef4ff;
}

.risk-low {
    background: #e8f7eb;
    border-left: 5px solid #00c853;
}

.risk-medium {
    background: #fff8e1;
    border-left: 5px solid #ffb300;
}

.risk-high {
    background: #ffebee;
    border-left: 5px solid #e53935;
}

.navigation {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 25px;
    padding-bottom: 30px;
}

.navigation button {
    margin-top: 0;
}

@media(max-width:600px) {

    .stats-grid {
        grid-template-columns: 1fr 1fr;
    }

    .teams {
        font-size: 18px;
    }

}

@media(max-width:380px) {

    .stats-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="statistics-header">

        <h1>📈 AI Statistics</h1>

        <p>
            Statistics generated from APEX Predict AI
        </p>

    </div>


    <!-- CONNECTION STATUS -->

    <div id="connectionStatus">

        🔄 Connecting to APEX AI...

    </div>


    <!-- MAIN OUTPUT -->

    <div id="statisticsContainer">

        <div class="loading-box">

            🔄 Loading the final 10 selected matches...

        </div>

    </div>


    <!-- NAVIGATION -->

    <div class="navigation">

        <button onclick="go('dashboard.html')">
            🏠 Dashboard
        </button>

        <button onclick="go('predictions.html')">
            🤖 Predictions
        </button>

        <button onclick="go('analysis.html')">
            📊 Analysis
        </button>

        <button onclick="go('livescores.html')">
            ⚽ Live Scores
        </button>

        <button onclick="go('leagues.html')">
            🏆 Leagues
        </button>

        <button onclick="go('head2head.html')">
            ⚔ Head To Head
        </button>

        <button onclick="go('settings.html')">
            ⚙ Settings
        </button>

    </div>


</div>


<script>

"use strict";


/* =====================================================
   APEX PREDICT AI
   STATISTICS ENGINE
   ===================================================== */


const GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


const statusElement =
document.getElementById("connectionStatus");


const container =
document.getElementById("statisticsContainer");


/* =====================================================
   NAVIGATION
   ===================================================== */

function go(page) {

    window.location.href = page;

}


/* =====================================================
   SAFE VALUE
   ===================================================== */

function value(match, names) {

    if (!match || typeof match !== "object") {

        return "";

    }


    for (const wanted of names) {

        const wantedLower =
            String(wanted)
                .trim()
                .toLowerCase();


        const key =
            Object.keys(match).find(function(k) {

                return String(k)
                    .trim()
                    .toLowerCase()
                    === wantedLower;

            });


        if (key !== undefined) {

            const v = match[key];


            if (
                v !== null &&
                v !== undefined &&
                String(v).trim() !== ""
            ) {

                return v;

            }

        }

    }


    return "";

}


/* =====================================================
   SAFE HTML
   ===================================================== */

function safe(input) {

    if (
        input === null ||
        input === undefined
    ) {

        return "";

    }


    return String(input)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   NUMBER
   ===================================================== */

function number(input) {

    if (
        input === null ||
        input === undefined ||
        input === ""
    ) {

        return null;

    }


    const cleaned =
        String(input)
            .replace("%", "")
            .replace(",", "")
            .trim();


    const n =
        parseFloat(cleaned);


    return Number.isFinite(n)
        ? n
        : null;

}


/* =====================================================
   AVERAGE
   ===================================================== */

function average(values) {

    const valid =
        values.filter(function(v) {

            return Number.isFinite(v);

        });


    if (!valid.length) {

        return "—";

    }


    const total =
        valid.reduce(function(a, b) {

            return a + b;

        }, 0);


    return (
        total / valid.length
    ).toFixed(1);

}


/* =====================================================
   RISK CLASS
   ===================================================== */

function riskClass(risk) {

    const r =
        String(risk)
            .toLowerCase()
            .trim();


    if (r === "low") {

        return "risk-low";

    }


    if (
        r === "medium" ||
        r === "moderate"
    ) {

        return "risk-medium";

    }


    if (r === "high") {

        return "risk-high";

    }


    return "";

}


/* =====================================================
   LOAD STATISTICS
   ===================================================== */

async function loadStatistics() {

    try {

        statusElement.textContent =
            "🔄 Connecting to APEX AI...";


        const response =
            await fetch(

                GOOGLE_SHEETS_API +
                "?page=statistics&final10=true",

                {
                    method: "GET",
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "Connection returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "APEX Statistics Data:",
            data
        );


        /* =================================================
           CHECK MATCH DATABASE
           ================================================= */

        if (
            !data.matchDatabase ||
            !Array.isArray(
                data.matchDatabase.objects
            )
        ) {

            throw new Error(
                "Match Database was not returned."
            );

        }


        const allMatches =
            data.matchDatabase.objects;


        if (!allMatches.length) {

            statusElement.textContent =
                "⚠️ No APEX matches available.";


            container.innerHTML = `

                <div class="error-box">

                    ⚽ No matches are currently
                    available.

                </div>

            `;


            return;

        }


        /* =================================================
           FINAL 10
           ================================================= */

        const matches =
            allMatches.slice(0, 10);


        /* =================================================
           METRICS
           ================================================= */

        const confidenceValues = [];

        const oddsValues = [];

        const homeAdvantageValues = [];

        const oddsValueValues = [];


        let lowRisk = 0;

        let over15 = 0;

        let over25 = 0;


        matches.forEach(function(match) {


            /* CONFIDENCE */

            const confidence =
                number(
                    value(
                        match,
                        [
                            "Confidence %",
                            "Confidence"
                        ]
                    )
                );


            if (confidence !== null) {

                confidenceValues.push(
                    confidence
                );

            }


            /* ODDS */

            const odds =
                number(
                    value(
                        match,
                        [
                            "Bookmaker Odds",
                            "Odds"
                        ]
                    )
                );


            if (odds !== null) {

                oddsValues.push(
                    odds
                );

            }


            /* HOME ADVANTAGE */

            const homeAdvantage =
                number(
                    value(
                        match,
                        [
                            "Home Advantage Score",
                            "Home Advantage",
                            "Home Advantage Rating"
                        ]
                    )
                );


            if (homeAdvantage !== null) {

                homeAdvantageValues.push(
                    homeAdvantage
                );

            }


            /* ODDS VALUE */

            const oddsValue =
                number(
                    value(
                        match,
                        [
                            "Odds Value Score",
                            "Odds Value",
                            "Value Score"
                        ]
                    )
                );


            if (oddsValue !== null) {

                oddsValueValues.push(
                    oddsValue
                );

            }


            /* RISK */

            const risk =
                String(
                    value(
                        match,
                        [
                            "Risk Level",
                            "Risk"
                        ]
                    )
                ).toLowerCase();


            if (risk === "low") {

                lowRisk++;

            }


            /* PREDICTION */

            const prediction =
                String(
                    value(
                        match,
                        [
                            "Prediction",
                            "AI Prediction"
                        ]
                    )
                ).toLowerCase();


            if (
                prediction.includes("over 1.5")
            ) {

                over15++;

            }


            if (
                prediction.includes("over 2.5")
            ) {

                over25++;

            }

        });


        /* =================================================
           HEADER
           ================================================= */

        statusElement.textContent =
            "✅ APEX AI Connected — " +
            matches.length +
            " selected matches";


        let html = `

            <div class="summary">

                <h2>
                    🤖 APEX AI STATISTICS
                </h2>

                <p>

                    Showing statistics for the

                    <strong>
                        final ${matches.length}
                        selected matches.
                    </strong>

                </p>


                <div class="stats-grid">


                    <div class="stat-card">

                        <div class="stat-title">
                            Selected Matches
                        </div>

                        <div class="stat-value">
                            ${matches.length}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-title">
                            Average Confidence
                        </div>

                        <div class="stat-value">
                            ${average(confidenceValues)}%
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-title">
                            Average Bookmaker Odds
                        </div>

                        <div class="stat-value">
                            ${average(oddsValues)}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-title">
                            Average Home Advantage
                        </div>

                        <div class="stat-value">
                            ${average(homeAdvantageValues)}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-title">
                            Average Odds Value
                        </div>

                        <div class="stat-value">
                            ${average(oddsValueValues)}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-title">
                            Low Risk Matches
                        </div>

                        <div class="stat-value">
                            ${lowRisk}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-title">
                            Over 1.5 Predictions
                        </div>

                        <div class="stat-value">
                            ${over15}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-title">
                            Over 2.5 Predictions
                        </div>

                        <div class="stat-value">
                            ${over25}
                        </div>

                    </div>


                </div>

            </div>


            <div class="matches-box">

                <h2>
                    ⚽ FINAL ${matches.length}
                    MATCH STATISTICS
                </h2>

        `;


        /* =================================================
           MATCH CARDS
           ================================================= */

        matches.forEach(function(match, index) {


            const home =
                value(
                    match,
                    [
                        "Home Team",
                        "HomeTeam",
                        "Home"
                    ]
                );


            const away =
                value(
                    match,
                    [
                        "Away Team",
                        "AwayTeam",
                        "Away"
                    ]
                );


            const league =
                value(
                    match,
                    [
                        "League"
                    ]
                );


            const date =
                value(
                    match,
                    [
                        "Date",
                        "Match Date"
                    ]
                );


            const prediction =
                value(
                    match,
                    [
                        "Prediction",
                        "AI Prediction"
                    ]
                );


            const confidence =
                value(
                    match,
                    [
                        "Confidence %",
                        "Confidence"
                    ]
                );


            const risk =
                value(
                    match,
                    [
                        "Risk Level",
                        "Risk"
                    ]
                );


            const market =
                value(
                    match,
                    [
                        "Recommended Market",
                        "recommended market",
                        "Market"
                    ]
                );


            const xg =
                value(
                    match,
                    [
                        "Expected Goals",
                        "Expected Goal",
                        "xG"
                    ]
                );


            const odds =
                value(
                    match,
                    [
                        "Bookmaker Odds",
                        "Bookmaker odds",
                        "Odds"
                    ]
                );


            const homeAdvantage =
                value(
                    match,
                    [
                        "Home Advantage Score",
                        "Home Advantage",
                        "Home Advantage Rating"
                    ]
                );


            const h2h =
                value(
                    match,
                    [
                        "Head to Head",
                        "Head To Head",
                        "H2H"
                    ]
                );


            const oddsValue =
                value(
                    match,
                    [
                        "Odds Value Score",
                        "Odds Value",
                        "Value Score"
                    ]
                );


            html += `

                <div class="match-card">

                    <div class="match-number">

                        MATCH ${index + 1}

                    </div>


                    <div class="teams">

                        ${safe(
                            home || "Home Team"
                        )}

                        <span style="
                            color:#777;
                            font-weight:normal;
                        ">

                            vs

                        </span>

                        ${safe(
                            away || "Away Team"
                        )}

                    </div>


                    <div class="detail-grid">


                        <div class="detail">

                            <strong>
                                League
                            </strong>

                            <span>
                                ${safe(
                                    league || "—"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <strong>
                                Date
                            </strong>

                            <span>
                                ${safe(
                                    date || "—"
                                )}
                            </span>

                        </div>


                        <div class="detail prediction">

                            <strong>
                                AI Prediction
                            </strong>

                            <span>
                                ${safe(
                                    prediction || "—"
                                )}
                            </span>

                        </div>


                        <div class="detail confidence">

                            <strong>
                                Confidence
                            </strong>

                            <span>
                                ${safe(
                                    confidence !== ""
                                        ? confidence + "%"
                                        : "—"
                                )}
                            </span>

                        </div>


                        <div class="detail ${riskClass(risk)}">

                            <strong>
                                Risk Level
                            </strong>

                            <span>
                                ${safe(
                                    risk || "—"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <strong>
                                Recommended Market
                            </strong>

                            <span>
                                ${safe(
                                    market || "—"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <strong>
                                Expected Goals
                            </strong>

                            <span>
                                ${safe(
                                    xg || "—"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <strong>
                                Bookmaker Odds
                            </strong>

                            <span>
                                ${safe(
                                    odds || "—"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <strong>
                                Home Advantage
                            </strong>

                            <span>
                                ${safe(
                                    homeAdvantage || "—"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <strong>
                                Head To Head
                            </strong>

                            <span>
                                ${safe(
                                    h2h || "—"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <strong>
                                Odds Value
                            </strong>

                            <span>
                                ${safe(
                                    oddsValue || "—"
                                )}
                            </span>

                        </div>


                    </div>

                </div>

            `;

        });


        /* =================================================
           CLOSE MATCH BOX
           ================================================= */

        html += `

            </div>

        `;


        container.innerHTML =
            html;


    } catch (error) {


        console.error(
            "APEX Statistics Error:",
            error
        );


        statusElement.textContent =
            "❌ APEX Statistics Connection Error";


        container.innerHTML = `

            <div class="error-box">

                <h3>
                    ⚠️ Statistics could not be loaded
                </h3>

                <p>
                    ${safe(error.message)}
                </p>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   START
   ===================================================== */

loadStatistics();


</script>


</body>

</html>
