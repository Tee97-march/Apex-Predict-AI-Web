<script>

/* =========================================
   APEX STATISTICS ENGINE
   ========================================= */

(function(){

    "use strict";


    const container =
        document.getElementById(
            "statisticsContainer"
        );


    if(!container){

        return;

    }


    /*
     * Read a value using several possible
     * Google Sheets column names.
     */

    function getValue(
        match,
        names
    ){

        for(
            let i = 0;
            i < names.length;
            i++
        ){

            const key =
                Object.keys(match).find(
                    function(existingKey){

                        return existingKey
                            .trim()
                            .toLowerCase()
                            ===
                            names[i]
                                .trim()
                                .toLowerCase();

                    }
                );


            if(
                key !== undefined &&
                match[key] !== null &&
                match[key] !== undefined &&
                String(match[key]).trim() !== ""
            ){

                return match[key];

            }

        }


        return null;

    }


    /*
     * Format numbers safely.
     */

    function numberValue(value){

        if(
            value === null ||
            value === undefined ||
            value === ""
        ){

            return null;

        }


        const cleaned =
            String(value)
                .replace("%","")
                .replace(",","")
                .trim();


        const number =
            Number(cleaned);


        return Number.isFinite(number)
            ? number
            : null;

    }


    /*
     * Display values safely.
     */

    function displayValue(value){

        if(
            value === null ||
            value === undefined ||
            value === ""
        ){

            return "Not available";

        }


        return String(value);

    }


    /*
     * Calculate percentage.
     */

    function percentage(
        value,
        total
    ){

        if(
            !Number.isFinite(value) ||
            !Number.isFinite(total) ||
            total === 0
        ){

            return null;

        }


        return (
            (value / total) * 100
        ).toFixed(1) + "%";

    }


    /*
     * Calculate statistics from
     * the available Match Database.
     */

    function calculateStatistics(
        matches
    ){

        const total =
            matches.length;


        let confidenceTotal = 0;
        let confidenceCount = 0;

        let expectedGoalsTotal = 0;
        let expectedGoalsCount = 0;

        let homeAdvantageTotal = 0;
        let homeAdvantageCount = 0;

        let oddsTotal = 0;
        let oddsCount = 0;

        let oddsValueTotal = 0;
        let oddsValueCount = 0;

        let over15Count = 0;
        let over25Count = 0;

        let lowRiskCount = 0;


        matches.forEach(
            function(match){

                const confidence =
                    numberValue(
                        getValue(
                            match,
                            [
                                "Confidence %",
                                "Confidence",
                                "confidence %"
                            ]
                        )
                    );


                if(
                    confidence !== null
                ){

                    confidenceTotal +=
                        confidence;

                    confidenceCount++;

                }


                const expectedGoals =
                    numberValue(
                        getValue(
                            match,
                            [
                                "Expected Goals",
                                "Expected Goals %",
                                "Expected Goal",
                                "xG"
                            ]
                        )
                    );


                if(
                    expectedGoals !== null
                ){

                    expectedGoalsTotal +=
                        expectedGoals;

                    expectedGoalsCount++;

                }


                const homeAdvantage =
                    numberValue(
                        getValue(
                            match,
                            [
                                "Home Advantage Score",
                                "Home Advantage",
                                "Home Advantage Rating"
                            ]
                        )
                    );


                if(
                    homeAdvantage !== null
                ){

                    homeAdvantageTotal +=
                        homeAdvantage;

                    homeAdvantageCount++;

                }


                const odds =
                    numberValue(
                        getValue(
                            match,
                            [
                                "Bookmaker Odds",
                                "Bookmaker Odd",
                                "Odds"
                            ]
                        )
                    );


                if(
                    odds !== null
                ){

                    oddsTotal +=
                        odds;

                    oddsCount++;

                }


                const oddsValue =
                    numberValue(
                        getValue(
                            match,
                            [
                                "Odds Value Score",
                                "Odds Value",
                                "Value Score"
                            ]
                        )
                    );


                if(
                    oddsValue !== null
                ){

                    oddsValueTotal +=
                        oddsValue;

                    oddsValueCount++;

                }


                const prediction =
                    String(
                        getValue(
                            match,
                            [
                                "Prediction",
                                "AI Prediction"
                            ]
                        ) || ""
                    ).toLowerCase();


                if(
                    prediction.includes(
                        "over 1.5"
                    )
                ){

                    over15Count++;

                }


                if(
                    prediction.includes(
                        "over 2.5"
                    )
                ){

                    over25Count++;

                }


                const risk =
                    String(
                        getValue(
                            match,
                            [
                                "Risk Level",
                                "Risk"
                            ]
                        ) || ""
                    ).toLowerCase();


                if(
                    risk === "low"
                ){

                    lowRiskCount++;

                }

            }
        );


        return {

            total,

            averageConfidence:
                confidenceCount > 0
                    ? (
                        confidenceTotal /
                        confidenceCount
                    ).toFixed(1) + "%"
                    : "Not available",

            averageExpectedGoals:
                expectedGoalsCount > 0
                    ? (
                        expectedGoalsTotal /
                        expectedGoalsCount
                    ).toFixed(2)
                    : "Not available",

            averageHomeAdvantage:
                homeAdvantageCount > 0
                    ? (
                        homeAdvantageTotal /
                        homeAdvantageCount
                    ).toFixed(2)
                    : "Not available",

            averageOdds:
                oddsCount > 0
                    ? (
                        oddsTotal /
                        oddsCount
                    ).toFixed(2)
                    : "Not available",

            averageOddsValue:
                oddsValueCount > 0
                    ? (
                        oddsValueTotal /
                        oddsValueCount
                    ).toFixed(2)
                    : "Not available",

            over15:
                percentage(
                    over15Count,
                    total
                ) || "Not available",

            over25:
                percentage(
                    over25Count,
                    total
                ) || "Not available",

            lowRisk:
                percentage(
                    lowRiskCount,
                    total
                ) || "Not available"

        };

    }


    /*
     * Render the statistics page.
     */

    function renderStatistics(
        data
    ){

        if(
            !data ||
            !data.matchDatabase ||
            !data.matchDatabase.exists ||
            !Array.isArray(
                data.matchDatabase.objects
            )
        ){

            container.innerHTML = `

                <div class="error-box">

                    ❌ MATCH DATABASE data
                    could not be loaded.

                </div>

            `;

            return;

        }


        const matches =
            data.matchDatabase.objects;


        if(
            matches.length === 0
        ){

            container.innerHTML = `

                <div class="empty-box">

                    ⚽ No matches are currently
                    available in the Match Database.

                </div>

            `;

            return;

        }


        const stats =
            calculateStatistics(
                matches
            );


        container.innerHTML = `

            <div class="statistics-summary">

                <h2>
                    📊 APEX AI STATISTICS
                </h2>

                <p>
                    <strong>
                        ${matches.length}
                    </strong>
                    match(es) loaded from
                    Google Sheets.
                </p>


                <div class="statistics-grid">


                    <div class="stat-card">

                        <div class="stat-card-title">
                            Total Matches
                        </div>

                        <div class="stat-card-value">
                            ${stats.total}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-card-title">
                            Average Confidence
                        </div>

                        <div class="stat-card-value">
                            ${stats.averageConfidence}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-card-title">
                            Average Expected Goals
                        </div>

                        <div class="stat-card-value">
                            ${stats.averageExpectedGoals}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-card-title">
                            Average Home Advantage
                        </div>

                        <div class="stat-card-value">
                            ${stats.averageHomeAdvantage}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-card-title">
                            Average Bookmaker Odds
                        </div>

                        <div class="stat-card-value">
                            ${stats.averageOdds}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-card-title">
                            Average Odds Value Score
                        </div>

                        <div class="stat-card-value">
                            ${stats.averageOddsValue}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-card-title">
                            Over 1.5 Predictions
                        </div>

                        <div class="stat-card-value">
                            ${stats.over15}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-card-title">
                            Over 2.5 Predictions
                        </div>

                        <div class="stat-card-value">
                            ${stats.over25}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-card-title">
                            Low Risk Matches
                        </div>

                        <div class="stat-card-value">
                            ${stats.lowRisk}
                        </div>

                    </div>


                </div>

            </div>


            <div class="match-statistics">

                <h2>
                    ⚽ MATCH-BY-MATCH STATISTICS
                </h2>


                ${matches.map(
                    function(match,index){

                        const homeTeam =
                            getValue(
                                match,
                                [
                                    "Home Team",
                                    "HomeTeam",
                                    "Home"
                                ]
                            );


                        const awayTeam =
                            getValue(
                                match,
                                [
                                    "Away Team",
                                    "AwayTeam",
                                    "Aw
