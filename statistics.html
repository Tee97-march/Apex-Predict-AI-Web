<script>

"use strict";


/* =====================================================
   APEX PREDICT AI
   STATISTICS PAGE
   FINAL 10 SELECTED MATCHES
   ===================================================== */

const GOOGLE_SHEETS_API =
"https://script.google.com/macros/s/AKfycbxeZN80_WiP4hNmfbCMlmFDFHsuZ6QMpW7tDce4MRS8ya6RZQJ0F5DK8OPRaUBGiQfOsw/exec";


/* =====================================================
   SAFE VALUE READER
   ===================================================== */

function getValue(match, names){

    if(!match){
        return "";
    }

    const keys = Object.keys(match);

    for(const name of names){

        const foundKey = keys.find(function(key){

            return String(key)
                .trim()
                .toLowerCase()
                ===
                String(name)
                .trim()
                .toLowerCase();

        });

        if(foundKey !== undefined){

            const value = match[foundKey];

            if(
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            ){

                return value;

            }

        }

    }

    return "";

}


/* =====================================================
   NUMBER READER
   ===================================================== */

function numberValue(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return null;

    }

    const number =
        Number(
            String(value)
                .replace("%","")
                .replace(",","")
                .trim()
        );

    return Number.isFinite(number)
        ? number
        : null;

}


/* =====================================================
   SAFE HTML
   ===================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   PERCENTAGE
   ===================================================== */

function percentage(value,total){

    if(
        !Number.isFinite(value) ||
        !Number.isFinite(total) ||
        total === 0
    ){

        return "Not available";

    }

    return (
        (value / total) * 100
    ).toFixed(1) + "%";

}


/* =====================================================
   BUILD STATISTICS
   ===================================================== */

function calculateStatistics(matches){

    let confidenceTotal = 0;
    let confidenceCount = 0;

    let expectedGoalsTotal = 0;
    let expectedGoalsCount = 0;

    let homeAdvantageTotal = 0;
    let homeAdvantageCount = 0;

    let oddsTotal = 0;
    let oddsCount = 0;

    let oddsValueTotal = 0;
    let oddsValueCount = 0;

    let over15 = 0;
    let over25 = 0;
    let lowRisk = 0;


    matches.forEach(function(match){

        const confidence =
            numberValue(
                getValue(
                    match,
                    [
                        "Confidence %",
                        "Confidence",
                        "confidence %"
                    ]
                )
            );

        if(confidence !== null){

            confidenceTotal += confidence;
            confidenceCount++;

        }


        const expectedGoals =
            numberValue(
                getValue(
                    match,
                    [
                        "Expected Goals",
                        "Expected Goal",
                        "Expected Goals %",
                        "xG"
                    ]
                )
            );

        if(expectedGoals !== null){

            expectedGoalsTotal += expectedGoals;
            expectedGoalsCount++;

        }


        const homeAdvantage =
            numberValue(
                getValue(
                    match,
                    [
                        "Home Advantage Score",
                        "Home Advantage",
                        "Home Advantage Rating"
                    ]
                )
            );

        if(homeAdvantage !== null){

            homeAdvantageTotal += homeAdvantage;
            homeAdvantageCount++;

        }


        const odds =
            numberValue(
                getValue(
                    match,
                    [
                        "Bookmaker Odds",
                        "Bookmaker Odd",
                        "Odds"
                    ]
                )
            );

        if(odds !== null){

            oddsTotal += odds;
            oddsCount++;

        }


        const oddsValue =
            numberValue(
                getValue(
                    match,
                    [
                        "Odds Value Score",
                        "Odds Value",
                        "Value Score"
                    ]
                )
            );

        if(oddsValue !== null){

            oddsValueTotal += oddsValue;
            oddsValueCount++;

        }


        const prediction =
            String(
                getValue(
                    match,
                    [
                        "Prediction",
                        "AI Prediction"
                    ]
                )
            ).toLowerCase();


        const market =
            String(
                getValue(
                    match,
                    [
                        "Recommended Market",
                        "recommended market",
                        "Recommended market",
                        "Market"
                    ]
                )
            ).toLowerCase();


        const combined =
            prediction + " " + market;


        if(
            combined.includes("over 1.5")
        ){

            over15++;

        }


        if(
            combined.includes("over 2.5")
        ){

            over25++;

        }


        const risk =
            String(
                getValue(
                    match,
                    [
                        "Risk Level",
                        "Risk"
                    ]
                )
            ).toLowerCase();


        if(risk === "low"){

            lowRisk++;

        }

    });


    return {

        total: matches.length,

        averageConfidence:
            confidenceCount
                ? (
                    confidenceTotal /
                    confidenceCount
                ).toFixed(1) + "%"
                : "Not available",

        averageExpectedGoals:
            expectedGoalsCount
                ? (
                    expectedGoalsTotal /
                    expectedGoalsCount
                ).toFixed(2)
                : "Not available",

        averageHomeAdvantage:
            homeAdvantageCount
                ? (
                    homeAdvantageTotal /
                    homeAdvantageCount
                ).toFixed(2)
                : "Not available",

        averageOdds:
            oddsCount
                ? (
                    oddsTotal /
                    oddsCount
                ).toFixed(2)
                : "Not available",

        averageOddsValue:
            oddsValueCount
                ? (
                    oddsValueTotal /
                    oddsValueCount
                ).toFixed(2)
                : "Not available",

        over15:
            percentage(
                over15,
                matches.length
            ),

        over25:
            percentage(
                over25,
                matches.length
            ),

        lowRisk:
            percentage(
                lowRisk,
                matches.length
            )

    };

}


/* =====================================================
   CREATE DETAIL FIELD
   ===================================================== */

function detail(title,value){

    if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ){

        return "";

    }

    return `

        <div class="match-detail">

            <div class="match-detail-title">
                ${escapeHTML(title)}
            </div>

            <div class="match-detail-value">
                ${escapeHTML(value)}
            </div>

        </div>

    `;

}
